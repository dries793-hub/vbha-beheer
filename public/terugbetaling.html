<style>
:root{--bg:#F5F5F6;--surface:#FFFFFF;--sunken:#F1F1F2;--ink:#1A1B1E;--muted:#686B71;--line:#E5E6E8;--line-strong:#CCCED2;--navy:#18191C;--accent:#C0161F;--accent-deep:#8F0F16;--accent-soft:#FCEBEC;--good:#18794A;--good-soft:#E3F4EA;--info:#2F6FE4;--info-soft:#E4EDFD;--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}

.hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;color:#fff}
.hdr .logo{height:30px;width:auto;display:block}
.hdr span{font-size:13.5px;color:#A4A7AD;border-left:1px solid #3a3c40;padding-left:14px}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.title{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.title img{height:48px;width:auto}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
label,.lbl{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}

.opt{position:relative}

.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.ok .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok h2{margin:0 0 8px;font-size:22px}

.paybox{text-align:left;margin-top:22px;padding:18px;border-radius:12px;background:var(--sunken)}

.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.pd{margin:0;display:flex;flex-direction:column;gap:10px}

.pd .mono{margin:0}
.cp{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 10px;font:500 12.5px var(--f);cursor:pointer}

.hint.c{text-align:center;margin:8px 0 0}

.wacht:empty{display:none}

.zelf summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style-position:inside}

.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}

<main>
  <div class="title"><h1 id="h1">Terugbetaling</h1></div>
  <p class="lead" id="lead"></p>
  <div id="box"><div class="card"><p style="margin:0">Laden…</p></div></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+Number(n||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const Q=new URLSearchParams(location.search),ID=Q.get("i")||"",TOK=Q.get("t")||"",T0=Date.now();
const fmtIban=v=>String(v||"").replace(/\s+/g,"").toUpperCase().replace(/(.{4})/g,"$1 ").trim();
function ibanOk(i){i=String(i||"").replace(/\s+/g,"").toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(i))return false;const r=(i.slice(4)+i.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);let m=0;for(const ch of r)m=(m*10+Number(ch))%97;return m===1}
async function api(b){const r=await fetch("/api/terug"+(b?"":"?i="+encodeURIComponent(ID)+"&t="+encodeURIComponent(TOK)),b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Er ging iets mis. Probeer het opnieuw.");return j}
const OK=(t,p)=>`<div class="card ok"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>${t}</h2><p>${p}</p></div>`;
document.addEventListener("input",e=>{if(e.target.id==="iban"){const p=e.target.selectionStart,v=e.target.value,f=fmtIban(v);if(f!==v){e.target.value=f;try{e.target.setSelectionRange(f.length,f.length)}catch(x){}}}});
/* ---------- persoonlijke link: rekeningnummer doorgeven ---------- */
function toonLink(j){$("#h1").textContent="Terugbetaling";
  if(j.status==="betaald"){$("#lead").textContent="";$("#box").innerHTML=OK("Al terugbetaald",`${eur(j.bedrag)} voor ${esc(j.reden)} werd overgeschreven.`);return}
  if(j.status==="geweigerd"){$("#lead").textContent="";$("#box").innerHTML=OK("Afgesloten","Deze aanvraag is afgesloten. Neem contact op met de Vriendenkring als je vragen hebt.");return}
  $("#lead").textContent="Geef je rekeningnummer door, dan schrijft de Vriendenkring het bedrag naar je over.";
  $("#box").innerHTML=`<div class="sum">Voor <b>${esc(j.reden)}</b><span class="bd">${eur(j.bedrag)}</span></div>
   ${j.ibanGekend?`<div class="vg-ok">✓ We ontvingen je rekeningnummer (eindigend op ${esc(j.ibanEind)}). Je kan het hieronder nog wijzigen.</div>`:""}
   <form class="card" id="f" novalidate><div class="grid"><div class="full"><label for="tnv">Naam van de rekeninghouder</label><input type="text" id="tnv" value="${esc(j.naam)}" maxlength="80" autocomplete="name"></div>
   <div class="full"><label for="iban">Rekeningnummer (IBAN)</label><input type="text" id="iban" inputmode="text" autocomplete="off" placeholder="BE00 0000 0000 0000" maxlength="42" spellcheck="false"></div></div>
   <p class="err" id="err"></p><button class="btn" type="submit">Doorgeven</button></form>`;
  $("#f").addEventListener("submit",async e=>{e.preventDefault();const iban=$("#iban").value,err=$("#err");if(!ibanOk(iban)){err.textContent="Dit rekeningnummer klopt niet. Kijk het even na.";return}
    const b=e.submitter||$("#f .btn");b.disabled=true;err.textContent="";
    try{await api({i:ID,t:TOK,iban,tnv:$("#tnv").value.trim()});$("#lead").textContent="";$("#box").innerHTML=OK("Bedankt!",`We schrijven ${eur(j.bedrag)} zo snel mogelijk over naar je rekening.`)}catch(x){err.textContent=x.message;b.disabled=false}})}
/* ---------- onkostennota indienen ---------- */
let BON=null;
async function verklein(file){if(file.type==="application/pdf"){if(file.size>4e6)throw new Error("De PDF is te groot (max. 4 MB).");return{data:await new Promise((ok,nok)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=nok;r.readAsDataURL(file)}),naam:file.name}}
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){bmp=await new Promise((ok,nok)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>nok(new Error("Dit bestand is geen foto of PDF."));i.src=URL.createObjectURL(file)})}
  const s=Math.min(1,2000/Math.max(bmp.width,bmp.height)),cv=document.createElement("canvas");cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return{data:cv.toDataURL("image/jpeg",.82),naam:(file.name||"bon").replace(/\.[^.]+$/,"")+".jpg"}}
function toonOnkost(){$("#h1").textContent="Onkosten terugvragen";$("#lead").textContent="Kosten gemaakt voor de Vriendenkring? Vul dit in met een foto van het kasticket of de factuur. Na goedkeuring storten we het bedrag terug.";
  const vd=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
  $("#box").innerHTML=`<form class="card" id="f" novalidate><div class="grid">
    <div class="full"><label for="naam">Naam</label><div class="lp"><input type="text" id="naam" maxlength="80" placeholder="Begin je naam te typen" autocomplete="off"><div class="lp-l" id="naamL" hidden role="listbox"></div></div></div>
    <div><label for="bedrag">Bedrag (€)</label><input class="num" type="text" id="bedrag" inputmode="decimal" placeholder="0,00"></div>
    <div><label for="datum">Datum van de aankoop</label><input type="date" id="datum" value="${vd}" max="${vd}"></div>
    <div class="full"><label for="reden">Waarvoor?</label><textarea id="reden" maxlength="300" placeholder="bv. drank voor de bestuursvergadering, affiches jaarmarkt"></textarea></div>
    <div class="full"><span class="lbl">Kasticket of factuur</span><label class="up" id="upl"><input type="file" id="bon" accept="image/*,application/pdf"><svg viewBox="0 0 24 24"><path d="M12 16V4m-5 5l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span id="bonT">Foto nemen of bestand kiezen</span></label><label class="geen" id="geenW" hidden><input type="checkbox" id="geenBon"> Ik heb geen kasticket of factuur</label></div>
    <div class="full"><label for="iban">Rekeningnummer (IBAN) voor de terugbetaling</label><p class="hint" style="margin:-2px 0 6px">Al eens doorgegeven? Dan mag je dit leeg laten.</p><input type="text" id="iban" autocomplete="off" placeholder="BE00 0000 0000 0000" maxlength="42" spellcheck="false"></div>
    <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
   </div><p class="err" id="err"></p><button class="btn" type="submit">Indienen</button></form>`;
  lidPicker($("#naam"),$("#naamL"));
  $("#bon").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;$("#bonT").textContent="Bezig…";try{BON=await verklein(f);$("#bonT").textContent="✓ "+(f.name||"bewijsstuk");$("#upl").classList.add("ok")}catch(x){BON=null;$("#bonT").textContent=x.message;$("#upl").classList.remove("ok")}});
  $("#f").addEventListener("submit",async e=>{e.preventDefault();const v=s=>$(s).value.trim(),err=$("#err");
    const bedrag=Number(v("#bedrag").replace(/\s/g,"").replace(",","."));
    const f=!v("#naam")?"Vul je naam in.":!(bedrag>0)?"Vul het bedrag in.":!v("#reden")?"Schrijf kort waarvoor de kosten waren.":!BON&&!$("#geenBon").checked?($("#geenW").hidden=false,"Voeg een foto van het kasticket of de factuur toe, of vink aan dat je er geen hebt."):v("#iban")&&v("#iban")!==MASK&&!ibanOk(v("#iban"))?"Dit rekeningnummer klopt niet. Kijk het even na.":"";
    if(f){err.textContent=f;return}const b=$("#f .btn");b.disabled=true;b.textContent="Bezig met versturen…";err.textContent="";
    try{await api({actie:"onkost",naam:v("#naam"),lidId:$("#naam").dataset.id||"",bedrag,datum:v("#datum"),reden:v("#reden"),iban:v("#iban")===MASK?"":v("#iban"),bon:BON,geenBon:!BON&&$("#geenBon").checked,website:v("#website"),duur:Date.now()-T0});
      $("#lead").textContent="";$("#box").innerHTML=OK("Bedankt!",`Je onkosten van ${eur(bedrag)} zijn doorgegeven. Na goedkeuring storten we het bedrag terug.`)}
    catch(x){err.textContent=x.message;b.disabled=false;b.textContent="Indienen"}})}
/* gekend rekeningnummer van het gekozen lid (gedeeltelijk verborgen) */
let MASK="";
async function ibanVan(id){const f=$("#iban");if(!f)return;try{const r=await fetch("/api/terug?lid="+encodeURIComponent(id));const j=r.ok?await r.json():{};
  if(j.iban&&(!f.value.trim()||f.value===MASK)){MASK=j.iban;f.value=MASK;f.classList.add("lp-ok")}}catch(e){}}
function ibanWis(){const f=$("#iban");if(f&&MASK&&f.value===MASK){f.value="";f.classList.remove("lp-ok")}MASK=""}
document.addEventListener("focusin",e=>{if(e.target.id==="iban"&&MASK&&e.target.value===MASK)e.target.select()});
document.addEventListener("input",e=>{if(e.target.id==="iban"&&MASK&&e.target.value!==MASK){e.target.classList.remove("lp-ok");if(e.target.value.includes("•"))e.target.value=""}},true);
/* naam kiezen uit de leden (vanaf 3 letters) */
function lidPicker(inp,box){let T=0,L=[],sel=-1;
  const teken=()=>{box.innerHTML=L.length?L.map((l,i)=>`<button type="button" class="lp-i${i===sel?" on":""}" data-i="${i}" role="option">${esc(l.toon||l.naam)}</button>`).join(""):'<div class="lp-leeg">Geen lid gevonden. Je mag je naam gewoon volledig typen.</div>';box.hidden=false};
  const kies=l=>{inp.value=l.toon||l.naam;inp.dataset.id=l.id;inp.classList.add("lp-ok");box.hidden=true;ibanVan(l.id)};
  inp.addEventListener("input",()=>{if(inp.dataset.id)ibanWis();delete inp.dataset.id;inp.classList.remove("lp-ok");clearTimeout(T);const q=inp.value;sel=-1;if(q.trim().length<3){L=[];box.hidden=true;return}
    T=setTimeout(async()=>{try{const r=await fetch("/api/leden?q="+encodeURIComponent(q));L=r.ok?await r.json():[]}catch(e){L=[]}if(inp.value===q)teken()},160)});
  inp.addEventListener("keydown",e=>{if(box.hidden||!L.length)return;if(e.key==="ArrowDown"){e.preventDefault();sel=(sel+1)%L.length;teken()}else if(e.key==="ArrowUp"){e.preventDefault();sel=(sel-1+L.length)%L.length;teken()}else if(e.key==="Enter"){e.preventDefault();kies(L[sel<0?0:sel])}else if(e.key==="Escape")box.hidden=true});
  box.addEventListener("mousedown",e=>{const b=e.target.closest(".lp-i");if(!b)return;e.preventDefault();kies(L[+b.dataset.i])});
  inp.addEventListener("blur",()=>setTimeout(()=>{box.hidden=true;if(!inp.dataset.id&&L.length===1&&inp.value.trim())kies(L[0])},150))}
if(ID&&TOK)api().then(toonLink).catch(x=>{$("#lead").textContent="";$("#box").innerHTML=`<div class="card"><p style="margin:0">${esc(x.message)}</p></div>`});else toonOnkost();
</script>
</body>
</html>
