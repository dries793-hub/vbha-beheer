<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+Number(n||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const lang=iso=>new Date(iso+"T12:00:00").toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"});
const Q=new URLSearchParams(location.search),ID=Q.get("i")||"",TOK=Q.get("t")||"";
const CART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 11h10.6L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',PLUS='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
let V=null;const ED={};// per kind: {items:[...], man:{...}}
async function api(b){const r=await fetch("/api/kinderfeest"+(b?"":"?cadeau="+encodeURIComponent(ID)+"&t="+encodeURIComponent(TOK)),b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cadeau:ID,t:TOK,...b})}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Er ging iets mis. Probeer het opnieuw.");return j}
function tag(it){return it.auto?(it.beschikbaar===false?'<span class="tag nok">niet op voorraad</span>':it.beschikbaar?'<span class="tag ok">op voorraad</span>':""):'<span class="tag w">niet automatisch gecontroleerd</span>'}
function prod(it,i,k,edit){return `<div class="pr">${it.foto?`<img src="${esc(it.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<span class="ph"></span>'}<div class="m"><b>${esc(it.naam||it.url)}</b><small>${esc(it.winkel)} ${tag(it)} · <a href="${esc(it.url)}" target="_blank" rel="noopener">bekijken</a>${it.levertijd?`<br>${esc(it.levertijd)}`:""}</small></div><span class="p">${it.prijs!=null?eur(it.prijs):"?"}</span>${edit?`<button type="button" class="x" data-weg="${k}" data-i="${i}" aria-label="Verwijderen">×</button>`:""}</div>`}
const extraT=c=>c&&c.extra>0?`</div><div class="bijb" style="margin:-4px 0 10px">${c.betaald?`✓ ${eur(c.extra)} bijbetaald`:`<b>${eur(c.extra)}</b> boven het budget: nog bij te betalen (zie onderaan)`}`:"";
const magBij=(k,rest)=>V.bijbetalen&&rest<0&&-rest<=V.maxExtra+0.004;
function kaart(k){const E=ED[k.i];
  if(k.voorzien||k.budget==null)return `<div class="card kc"><h2>${esc(k.naam)}</h2><p class="sub">${k.leeftijd!=null?k.leeftijd+" jaar op het feest":""}</p><div class="state bon">De vriendenkring voorziet zelf een cadeau${k.tekst&&!/vbha|vereniging|vriendenkring/i.test(k.tekst)?" ("+esc(k.tekst)+")":""}. Je hoeft niets te kiezen.</div></div>`;
  const c=k.cadeau;
  if(!V.open||k.besteld){const st=k.besteld?"Besteld":"Gekozen";
    return `<div class="card kc"><h2>${esc(k.naam)}</h2><p class="sub">Budget ${eur(k.budget)}</p>${c&&c.bon?`<div class="state bon">${esc(k.naam)} krijgt een bon van bol.com van ${eur(k.budget)}.</div>`:c&&c.items?`<div class="state ok">${st}: ${eur(c.totaal)}${extraT(c)}</div>${c.items.map((it,i)=>prod(it,i,k.i,false)).join("")}`:`<div class="state bon">Er werd niets gekozen: ${esc(k.naam)} krijgt een bon van bol.com van ${eur(k.budget)}.</div>`}</div>`}
  if(!E.bewerk&&c){return `<div class="card kc"><h2>${esc(k.naam)}</h2><p class="sub">${k.leeftijd!=null?k.leeftijd+" jaar · ":""}budget ${eur(k.budget)}</p>${c.bon?`<div class="state bon">${esc(k.naam)} krijgt een bon van bol.com van ${eur(k.budget)}.</div>`:`<div class="state ok">✓ Bewaard: ${eur(c.totaal)}${extraT(c)}</div>${c.items.map((it,i)=>prod(it,i,k.i,false)).join("")}`}${c.betaald?"":`<button type="button" class="lnk" data-bewerk="${k.i}">Wijzigen</button>`}</div>`}
  const tot=E.items.reduce((s,x)=>s+(Number(x.prijs)||0),0),rest=Math.round((k.budget-tot)*100)/100,pct=Math.min(100,Math.round(tot/k.budget*100));
  const lijn=(it,i)=>`<div class="cl">${it.foto?`<img src="${esc(it.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<span class="ph"></span>'}<div class="m"><b>${esc(it.naam||it.url)}</b><small>${esc(it.winkel)} ${tag(it)}${it.levertijd?` · ${esc(it.levertijd)}`:""} · <a href="${esc(it.url)}" target="_blank" rel="noopener">bekijken</a></small></div><span class="p">${it.prijs!=null?eur(it.prijs):"?"}</span><button type="button" class="x" data-weg="${k.i}" data-i="${i}" aria-label="Verwijderen" title="Verwijderen">×</button></div>`;
  return `<div class="card kc mand" id="k${k.i}"><div class="mk"><span class="mic">${CART}</span><div><h2>${esc(k.naam)}</h2><p class="sub">${k.leeftijd!=null?k.leeftijd+" jaar op het feest · ":""}budget ${eur(k.budget)}</p></div><span class="mn">${E.items.length}</span></div>
    <div class="cls">${E.items.length?E.items.map(lijn).join(""):'<div class="leeg">Het mandje is nog leeg. Plak hieronder de link van een product.</div>'}</div>
    ${E.laden?`<div class="laad"><span class="spin"></span><div><b>Even geduld…</b><small>We halen het product op bij ${esc(E.laden)}. Dat duurt een tiental seconden.</small></div></div>`:
    E.man?`<div class="pr" style="display:block"><b style="font-size:14px">De winkel gaf de gegevens van dit product niet vrij.</b><div class="hint">Vul zelf de naam en de prijs in.</div><div class="man"><input id="mn${k.i}" placeholder="Naam van het product" value="${esc(E.man.naam||"")}"><input id="mp${k.i}" inputmode="decimal" placeholder="Prijs (€)"></div><div class="acts"><button type="button" class="sbtn" data-mok="${k.i}">Toevoegen</button><button type="button" class="lnk" data-mx="${k.i}" style="margin:0">Annuleren</button></div></div>`:
    `<div class="add"><input id="u${k.i}" type="url" inputmode="url" placeholder="Plak hier de link van het product" autocomplete="off"><button type="button" data-check="${k.i}">${PLUS}<span>Toevoegen</span></button></div><div class="hint">Open het product op bol.com of dreamland.be, kopieer de link en plak die hier. <button type="button" class="info" data-hulp aria-label="Hoe vind ik de link?">i</button> <button type="button" class="lnk" data-hulp style="font-size:13px">Hoe vind ik de link?</button></div>`}
    <div class="msg" id="m${k.i}"></div>
    <div class="tot"><div class="tr"><span>Totaal</span><b>${eur(tot)}</b></div><div class="bar"><span style="width:${pct}%" class="${rest<0?"te":""}"></span></div><div class="tr sm">${rest>=0?`<span class="okk">nog ${eur(rest)} over van ${eur(k.budget)}</span>`:`<span class="te">${eur(-rest)} boven het budget van ${eur(k.budget)}</span>`}</div>${rest<0?`<div class="bijb">${magBij(k,rest)?`Het verschil van <b>${eur(-rest)}</b> betaal je zelf bij met Bancontact, na het bevestigen.`:V.bijbetalen?`Bijbetalen kan tot ${eur(V.maxExtra)} boven het budget. Haal iets uit het mandje.`:`Haal iets uit het mandje om binnen het budget te blijven.`}</div>`:""}</div>
    <div class="acts"><button type="button" class="btn" data-save="${k.i}"${!E.items.length||(rest<0&&!magBij(k,rest))||E.laden?" disabled":""}>${rest<0&&magBij(k,rest)?`Bevestigen en ${eur(-rest)} bijbetalen`:"Mandje bevestigen"}</button></div>
    <div style="text-align:center"><button type="button" class="lnk" data-bon="${k.i}">Liever een bon van bol.com (${eur(k.budget)})</button>${c?` <button type="button" class="lnk" data-annul="${k.i}" style="margin-left:12px">Annuleren</button>`:""}</div></div>`}
/* ---------- bijbetalen met Bancontact ---------- */
const BC_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10 18.5h4"/></svg>';
let BT=null,BTI=null;
function appLink(o){if(!o||!o.deeplink)return null;const ret=location.origin+location.pathname+"?i="+encodeURIComponent(ID)+"&t="+encodeURIComponent(TOK)+"&betaling=terug";return o.deeplink+(o.deeplink.includes("?")?"&":"?")+"returnUrl="+encodeURIComponent(ret)}
function betaalBlok(){if(!V)return"";const b=V.betaling;
  if(!(V.teBetalen>0))return V.extraTotaal>0&&b&&b.status==="SUCCEEDED"?`<div class="card bet ok"><b>✓ Bijbetaling ontvangen</b><p class="hint" style="margin:4px 0 0">Bedankt! We bestellen de cadeaus.</p></div>`:"";
  const mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  return `<div class="card bet"><h2>Bijbetalen: ${eur(V.teBetalen)}</h2><p class="sub">De gekozen cadeaus gaan samen ${eur(V.teBetalen)} boven het budget. Pas na betaling bestellen we ze.</p>
   ${BT?`<a class="btn bc" href="${esc((mob&&appLink(BT))||BT.checkout||appLink(BT)||"#")}">${BC_ICON}Betaal ${eur(V.teBetalen)} met Bancontact</a>${BT.qrcode&&!mob?`<div class="qrw"><img src="${esc(BT.qrcode)}" alt="Bancontact-QR-code" width="190" height="190"><p class="hint">Scan met de Bancontact-app of je bankapp.</p></div>`:""}<p class="hint" id="btSt" aria-live="polite">${b&&b.status&&b.status!=="SUCCEEDED"&&!["FAILED","EXPIRED","CANCELLED"].includes(b.status)?"We wachten op je betaling…":""}</p>`
     :`<button type="button" class="btn bc" id="btGo">${BC_ICON}Betaal ${eur(V.teBetalen)} met Bancontact</button>`}
   ${b&&["FAILED","EXPIRED","CANCELLED","AUTHORIZATION_FAILED"].includes(b.status)?'<p class="hint" style="color:#b91c1c">De vorige betaling is niet gelukt. Probeer opnieuw.</p>':""}</div>`}
function volg(n){clearTimeout(BTI);if(n<=0)return;BTI=setTimeout(async()=>{try{const j=await api({actie:"betaalstatus"});V=j;if(!(V.teBetalen>0)){BT=null;toon();return}if(V.betaling&&["FAILED","EXPIRED","CANCELLED","AUTHORIZATION_FAILED"].includes(V.betaling.status)){BT=null;toon();return}}catch(e){}volg(n-1)},3000)}
document.addEventListener("click",async e=>{const g=e.target.closest("#btGo");if(!g)return;g.disabled=true;
  try{BT=await api({actie:"betaal"});toon();volg(60)}catch(x){g.disabled=false;alert(x.message)}});
/* ---------- hulp: waar vind ik de link van een product? (geïllustreerd, geen echte winkelpagina) ---------- */
const HU_PC=`<svg viewBox="0 0 420 250" role="img" aria-label="Voorbeeld van een browser op een computer: de link staat in de adresbalk bovenaan"><rect width="420" height="250" fill="#f4f4f5"/><rect x="0" y="0" width="420" height="34" fill="#e4e4e7"/><circle cx="16" cy="17" r="5" fill="#f87171"/><circle cx="32" cy="17" r="5" fill="#fbbf24"/><circle cx="48" cy="17" r="5" fill="#34d399"/>
<rect x="66" y="7" width="340" height="20" rx="10" fill="#fff" stroke="#c0161f" stroke-width="2.5"/><text x="80" y="21" font-family="Arial,sans-serif" font-size="11" fill="#1a1b1e">https://www.bol.com/be/nl/p/speelgoed-voorbeeld/9300000…</text>
<path d="M300 60 L300 34" stroke="#c0161f" stroke-width="2.5"/><path d="M294 40 L300 30 L306 40" fill="none" stroke="#c0161f" stroke-width="2.5"/><rect x="200" y="60" width="200" height="40" rx="8" fill="#c0161f"/><text x="300" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff">1. Klik hier in de adresbalk</text><text x="300" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff">2. Ctrl+C (Mac: ⌘+C) = kopiëren</text>
<rect x="20" y="114" width="120" height="120" rx="8" fill="#fff" stroke="#e4e4e7"/><path d="M50 200 L80 150 L110 200 Z" fill="#d4d4d8"/><circle cx="105" cy="145" r="10" fill="#d4d4d8"/><rect x="160" y="120" width="200" height="14" rx="4" fill="#3f3f46"/><rect x="160" y="142" width="140" height="10" rx="4" fill="#a1a1aa"/><text x="160" y="185" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1a1b1e">€ 24,99</text><rect x="160" y="198" width="130" height="30" rx="6" fill="#d4d4d8"/></svg>`;
const HU_GSM=`<svg viewBox="0 0 420 300" role="img" aria-label="Voorbeeld op een gsm: tik op Delen en kies Link kopiëren"><rect width="420" height="300" fill="#f4f4f5"/>
<rect x="30" y="12" width="150" height="276" rx="18" fill="#fff" stroke="#3f3f46" stroke-width="3"/><rect x="42" y="30" width="126" height="18" rx="9" fill="#e4e4e7"/><text x="50" y="43" font-family="Arial,sans-serif" font-size="9" fill="#52525b">bol.com/be/nl/p/…</text>
<rect x="50" y="60" width="110" height="90" rx="6" fill="#f4f4f5"/><path d="M70 135 L95 95 L120 135 Z" fill="#d4d4d8"/><rect x="50" y="160" width="100" height="9" rx="3" fill="#3f3f46"/><text x="50" y="190" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a1b1e">€ 24,99</text>
<circle cx="150" cy="186" r="13" fill="#fff" stroke="#c0161f" stroke-width="2.5"/><path d="M150 192 V179 M145 183 L150 178 L155 183" stroke="#1a1b1e" stroke-width="2" fill="none"/><rect x="143" y="186" width="14" height="10" rx="2" fill="none" stroke="#1a1b1e" stroke-width="1.6"/>
<text x="105" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c0161f">1. Tik op Delen</text><text x="105" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#52525b">(in de app of de browser)</text>
<path d="M190 150 H225" stroke="#c0161f" stroke-width="2.5"/><path d="M218 143 L228 150 L218 157" fill="none" stroke="#c0161f" stroke-width="2.5"/>
<rect x="240" y="12" width="150" height="276" rx="18" fill="#fff" stroke="#3f3f46" stroke-width="3"/><rect x="246" y="150" width="138" height="132" rx="12" fill="#f4f4f5"/><text x="258" y="172" font-family="Arial,sans-serif" font-size="10" fill="#52525b">Delen via…</text>
<rect x="254" y="182" width="122" height="28" rx="7" fill="#fff" stroke="#c0161f" stroke-width="2.5"/><text x="266" y="200" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1a1b1e">🔗 Link kopiëren</text><rect x="254" y="216" width="122" height="22" rx="6" fill="#fff"/><text x="266" y="231" font-family="Arial,sans-serif" font-size="10" fill="#a1a1aa">WhatsApp</text><rect x="254" y="242" width="122" height="22" rx="6" fill="#fff"/><text x="266" y="257" font-family="Arial,sans-serif" font-size="10" fill="#a1a1aa">Mail</text>
<text x="315" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c0161f">2. Kies</text><text x="315" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c0161f">"Link kopiëren"</text></svg>`;
function hulp(){const mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);let t=mob?"gsm":"pc";const bg=document.createElement("div");bg.className="hu-bg";document.body.appendChild(bg);
  const teken=()=>{bg.innerHTML=`<div class="hu" role="dialog" aria-label="Hoe vind ik de link?"><h3>Hoe vind ik de link?</h3><div class="hu-tab"><button type="button" data-hut="gsm" class="${t==="gsm"?"on":""}">Gsm of tablet</button><button type="button" data-hut="pc" class="${t==="pc"?"on":""}">Computer</button></div>
   ${t==="pc"?HU_PC+`<ol><li>Open het product op bol.com of dreamland.be.</li><li>Klik bovenaan in de <b>adresbalk</b>: de hele link wordt blauw.</li><li>Kopieer met <b>Ctrl+C</b> (Mac: <b>⌘+C</b>) of rechtsklik › Kopiëren.</li><li>Klik hier in het vak en plak met <b>Ctrl+V</b> (Mac: <b>⌘+V</b>).</li></ol>`
     :HU_GSM+`<ol><li>Open het product in de app of de website van bol.com of Dreamland.</li><li>Tik op <b>Delen</b> (het pijltje uit een vierkantje, of de drie bolletjes).</li><li>Kies <b>Link kopiëren</b> (of <b>Kopieer</b>).</li><li>Kom terug naar deze pagina, houd je vinger op het vak en kies <b>Plakken</b>.</li></ol>`}
   <button type="button" class="sl" data-hux>Begrepen</button></div>`};
  bg.addEventListener("click",e=>{const b=e.target.closest("[data-hut]");if(b){t=b.dataset.hut;teken();return}if(e.target===bg||e.target.closest("[data-hux]"))bg.remove()});teken()}
document.addEventListener("click",e=>{if(e.target.closest("[data-hulp]")){e.preventDefault();hulp()}});
function toon(){if(!V)return;
  $("#lead").innerHTML=V.open?`Kies per kind een of meer cadeaus op <a href="https://www.bol.com" target="_blank" rel="noopener">bol.com</a> of <a href="https://www.dreamland.be" target="_blank" rel="noopener">dreamland.be</a>, binnen het budget${V.bijbetalen?" (of betaal het verschil zelf bij)":""}. Let op de beschikbaarheid en de levertijd. Kiezen kan tot en met <b>${esc(lang(V.tot))}</b>.`:`De termijn om te kiezen is voorbij. Wie niets koos, krijgt een bon van bol.com ter waarde van het budget.`;
  $("#box").innerHTML=V.kinderen.map(kaart).join("")+betaalBlok()+`<p class="hint" style="margin-top:16px;text-align:center">Kinderfeest ${esc(lang(V.datum))} · ${esc(V.lid)}</p>`}
function init(j){V=j;for(const k of V.kinderen){ED[k.i]={items:k.cadeau&&k.cadeau.items?k.cadeau.items.map(x=>({...x})):[],bewerk:false,man:null}}toon()}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t||!V)return;const d=t.dataset;
  const k=V.kinderen.find(x=>String(x.i)===String(d.check??d.save??d.weg??d.bon??d.bewerk??d.annul??d.mok??d.mx));if(!k)return;const E=ED[k.i],msg=m=>{const el=$("#m"+k.i);if(el)el.textContent=m||""};
  if(d.bewerk!=null){E.bewerk=true;toon();return}
  if(d.annul!=null){E.bewerk=false;E.items=k.cadeau&&k.cadeau.items?k.cadeau.items.map(x=>({...x})):[];E.man=null;toon();return}
  if(d.weg!=null){E.items.splice(+d.i,1);E.bewerk=true;toon();return}
  if(d.mx!=null){E.man=null;toon();return}
  if(d.check!=null){const u=($("#u"+k.i).value||"").trim();if(!u){msg("Plak eerst de link van het product.");return}
    E.laden=/dreamland/i.test(u)?"Dreamland":"bol.com";E.bewerk=true;toon();
    try{const p=await api({actie:"check",url:u});E.laden=null;if(p.auto){if(p.beschikbaar===false){toon();msg(`"${p.naam}" is niet op voorraad. Kies een ander product.`);return}E.items.push(p);toon()}else{E.man={url:p.url,winkel:p.winkel,naam:p.naam||"",foto:p.foto};E.bewerk=true;toon()}}
    catch(x){E.laden=null;toon();msg(x.message)}return}
  if(d.mok!=null){const n=($("#mn"+k.i).value||"").trim(),p=Number(String($("#mp"+k.i).value||"").replace(",","."));if(!n||!(p>0)){msg("Vul de naam en de prijs in.");return}
    E.items.push({...E.man,naam:n,prijs:Math.round(p*100)/100,auto:false});E.man=null;toon();return}
  if(d.save!=null||d.bon!=null){const kaartEl=t.closest(".card");kaartEl&&kaartEl.classList.add("wait");
    try{const j=await api({actie:"bewaar",kind:k.i,bijbetalen:true,...(d.bon!=null?{bon:true}:{items:E.items.map(x=>x.sig?{url:x.url,winkel:x.winkel,naam:x.naam,prijs:x.prijs,foto:x.foto,artikelnr:x.artikelnr,beschikbaar:x.beschikbaar,levertijd:x.levertijd,gecontroleerd:x.gecontroleerd,auto:true,sig:x.sig}:{url:x.url,naam:x.naam,prijs:x.prijs})})});
      const nieuw=j.kinderen.find(x=>x.i===k.i);V=j;ED[k.i]={items:nieuw.cadeau&&nieuw.cadeau.items?nieuw.cadeau.items.map(x=>({...x})):[],bewerk:false,man:null};for(const x of V.kinderen)if(!ED[x.i])ED[x.i]={items:[],bewerk:false,man:null};toon()}
    catch(x){kaartEl&&kaartEl.classList.remove("wait");msg(x.message)}}});
// plakken van een link: meteen beginnen met ophalen (geen klik op Toevoegen nodig)
document.addEventListener("paste",e=>{const t=e.target;if(!t.id||!/^u\d+$/.test(t.id))return;setTimeout(()=>{if(/^https?:\/\/(www\.)?(bol\.com|dreamland\.be)\//i.test((t.value||"").trim())){const b=document.querySelector(`[data-check="${t.id.slice(1)}"]`);b&&b.click()}},30)});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.id&&/^u\d+$/.test(t.id)){e.preventDefault();const b=document.querySelector(`[data-check="${t.id.slice(1)}"]`);b&&b.click()}});
if(!ID||!TOK)$("#box").innerHTML='<div class="card"><p style="margin:0">Deze link is onvolledig. Gebruik de link uit de bevestigingsmail.</p></div>';
else api().then(j=>{init(j);if(Q.get("betaling")==="terug"&&V.teBetalen>0){api({actie:"betaalstatus"}).then(x=>{V=x;toon();if(V.teBetalen>0)volg(40)}).catch(()=>{})}}).catch(x=>{$("#box").innerHTML=`<div class="card"><p style="margin:0">${esc(x.message)}</p></div>`});
</script>
