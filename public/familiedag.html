<title>Familiedag · VBHA</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
:root{--bg:#F5F5F6;--surface:#FFFFFF;--sunken:#F1F1F2;--ink:#1A1B1E;--muted:#686B71;--line:#E5E6E8;--line-strong:#CCCED2;--navy:#18191C;--accent:#C0161F;--accent-deep:#8F0F16;--accent-soft:#FCEBEC;--good:#18794A;--good-soft:#E3F4EA;--info:#2F6FE4;--info-soft:#E4EDFD;--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--surface:#1A1B1E;--sunken:#202226;--ink:#ECEDEF;--muted:#9B9EA5;--line:#2A2C30;--line-strong:#3C3F45;--accent-soft:#3A1416;--good-soft:#12301F;--info-soft:#16233D}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
.hdr{background:var(--navy);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;color:#fff}
.hdr .logo{height:30px;width:auto;display:block}
.hdr span{font-size:13.5px;color:#A4A7AD;border-left:1px solid #3a3c40;padding-left:14px}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.title{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.title img{height:48px;width:auto}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
label,.lbl{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line-strong);border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;background:var(--surface)}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input:focus-visible+span{box-shadow:0 0 0 3px var(--info-soft)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pay{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--sunken);font-size:14px}
.pay b{font-variant-numeric:tabular-nums}
.err{color:var(--accent);font-weight:500;min-height:0;margin:14px 0 0}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;width:100%;padding:13px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 16px var(--f);cursor:pointer}
.btn:hover{background:var(--accent-deep)}
.btn:disabled{opacity:.6;cursor:default}
.ok{text-align:center;padding:30px 22px}
.ok .ic{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 14px}
.ok .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok h2{margin:0 0 8px;font-size:22px}
.ok p{margin:0 0 6px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;color:var(--ink)}
.paybox{text-align:left;margin-top:22px;padding:18px;border-radius:12px;background:var(--sunken)}
.paybox h3{margin:0 0 14px;font-size:17px;text-align:center}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr{width:200px;max-width:70vw;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qrwrap p{margin:0;font-size:13.5px;color:var(--muted);text-align:center;max-width:34ch}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.pd{margin:0;display:flex;flex-direction:column;gap:10px}
.pd>div{display:flex;flex-direction:column;gap:3px}
.pd dt{font-size:12.5px;color:var(--muted)}
.pd dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.pd .mono{margin:0}
.cp{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 10px;font:500 12.5px var(--f);cursor:pointer}
.cp:hover{border-color:var(--ink)}
.cp.ok{border-color:var(--good);color:var(--good)}
.btn.bc{margin-top:0;background:#1A1B1E;font-size:16.5px;padding:15px 18px;text-decoration:none}
.btn.bc:hover{background:#000}
.btn.bc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.bc.off{opacity:.45;pointer-events:none}
.hint.c{text-align:center;margin:8px 0 0}
.qrwrap.desk{margin-top:16px}
@media (pointer:coarse){.qrwrap.desk{display:none}}
.qr img{display:block;width:100%;height:auto}
.wacht{margin:10px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.wacht:empty{display:none}
.zelf{margin-top:16px;border-top:1px solid var(--line-strong);padding-top:12px}
.zelf summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style-position:inside}
.zelf[open] summary{margin-bottom:12px}
.paid{text-align:center;padding:6px 0}
.paid h3{margin:0 0 6px}
.paid p{margin:0;color:var(--muted)}
.paid .ic{width:48px;height:48px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 10px}
.paid .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.paybox .hint{margin:12px 0 0;font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr 1fr}h1{font-size:23px}.card{padding:18px}.hdr span{display:none}}
.hero h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.fact span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.fact b{display:block;font-weight:600;font-size:15px;margin-top:2px}
.fact small{display:block;color:var(--muted);font-size:13px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch label{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px 12px 40px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--surface)}
.ch input{position:absolute;left:14px;top:15px;width:18px;height:18px;margin:0;accent-color:var(--accent)}
.ch b{font-weight:600}.ch span{font-size:13px;color:var(--muted)}
.ch .pr{font-size:17px;font-weight:700;color:var(--ink)}
.ch label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-height:80px;resize:vertical}
textarea:focus,input[type=date]:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
input[type=date]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.kid{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;align-items:end;background:var(--sunken)}
.kid .age{grid-column:1/-1;font-size:13px;color:var(--muted);min-height:1em;margin-top:-4px}
.kdel{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;padding:10px 8px;border-radius:6px}
.kdel:hover{background:var(--accent-soft);color:var(--accent)}
.kadd{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--line-strong);background:none;border-radius:10px;padding:10px 16px;font-weight:600;color:var(--accent);cursor:pointer;margin-top:10px}
.kadd:hover{border-color:var(--accent);background:var(--accent-soft)}
.sum{margin:8px 0 0;color:var(--muted)}
@media (max-width:560px){.facts{grid-template-columns:1fr 1fr}.facts .fact:last-child{grid-column:1/-1}.ch{grid-template-columns:1fr}.kid{grid-template-columns:1fr}}
.bevestig{text-align:center;padding:34px 24px}
.bevestig .ic{width:72px;height:72px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px}
.bevestig .ic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bevestig h2{margin:0 0 8px;font-size:24px}
.bevestig .lead2{margin:0 auto;max-width:440px;color:var(--muted);font-size:15.5px}
.bevestig .sam{margin:22px auto 0;max-width:420px;border:1px solid var(--line);border-radius:12px;text-align:left;overflow:hidden}
.bevestig .sam div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14.5px}
.bevestig .sam div+div{border-top:1px solid var(--line)}
.bevestig .sam span{color:var(--muted)}
.bevestig .sam b{text-align:right}
.bevestig .tot{margin:22px 0 0;font-size:18px;font-weight:700}
.lp{position:relative}
.lp-l{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;overflow:hidden;max-height:280px;overflow-y:auto}
.lp-l[hidden]{display:none}
.lp-i{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.lp-i+.lp-i{border-top:1px solid var(--line)}
.lp-i:hover,.lp-i.on{background:var(--sunken)}
.lp-i b{font-weight:700}
.lp-leeg{padding:11px 14px;font-size:14px;color:var(--muted)}
.lp input.lp-ok{border-color:var(--good);background:var(--good-soft)}
/* iPhone: datumvelden niet breder dan hun vak, geen schuifbalken */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;box-sizing:border-box;min-height:44px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
html,body{overflow-x:hidden}
@media (max-width:760px){*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}}
.kid>*{min-width:0}
.lp-prijs{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:10px;background:#f3f8f4;border:1px solid #cfe7d6;font-size:14.5px}
.lp-prijs small{color:var(--muted)}.lp-prijs[hidden]{display:none}
.lp-st{flex:none;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#fff;background:#a5703f}
.lp-st.zilver{background:#8d959e}.lp-st.goud{background:#c19a2e}
.fk{display:block;font-size:12.5px;color:var(--muted)}
</style>
<style>
.pr-l{display:flex;flex-direction:column;gap:10px}
.pr-r{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.pr-r.on{border-color:var(--accent);background:var(--accent-soft)}
.pr-r .nm{flex:1;min-width:0}.pr-r .nm b{display:block}.pr-r .nm span{font-size:13px;color:var(--muted)}
.pr-r .pp{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pr-r .pp s{color:var(--muted);font-weight:500;margin-right:4px}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);font:700 20px var(--f);color:var(--ink);cursor:pointer;line-height:1}
.stp button:disabled{opacity:.35;cursor:default}.stp output{min-width:22px;text-align:center;font-weight:700;font-size:17px}
.wie{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info-b{white-space:pre-line;margin:0 0 18px;color:var(--muted)}
@media (max-width:560px){.pr-r{flex-wrap:wrap}.pr-r .nm{flex-basis:calc(100% - 110px)}}
</style>
</head>

  <p class="lead" id="lead">Een dag vol plezier voor het hele gezin. Schrijf je hier in.</p>

<script>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const t0=Date.now();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>{const x=Number(n)||0;return "€"+x.toLocaleString("nl-BE",{minimumFractionDigits:Number.isInteger(x)?0:2,maximumFractionDigits:2})};
document.addEventListener("click",async e=>{const b=e.target.closest(".cp");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.cp);const t=b.textContent;b.textContent="Gekopieerd";b.classList.add("ok");setTimeout(()=>{b.textContent=t;b.classList.remove("ok")},1600)}catch(x){}});
const BC_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10 18.5h4"/></svg>';
function handmatig(j){return `<dl class="pd"><div><dt>Bedrag</dt><dd><b>${eur(j.bedrag)}</b></dd></div>
  <div><dt>Rekeningnummer</dt><dd><span class="mono">${esc(j.rekeningnummer)}</span><button type="button" class="cp" data-cp="${esc(String(j.rekeningnummer).replace(/\s+/g,""))}">Kopieer</button></dd></div>
  ${j.begunstigde?`<div><dt>Begunstigde</dt><dd>${esc(j.begunstigde)}</dd></div>`:""}
  <div><dt>Mededeling</dt><dd><span class="mono">${esc(j.mededeling)}</span><button type="button" class="cp" data-cp="${esc(j.mededeling)}">Kopieer</button></dd></div></dl>
  <p class="hint">Gebruik exact deze mededeling, dan wordt je betaling automatisch herkend.</p>`}
function appLink(o){if(!o||!o.deeplink)return null;const ret=location.origin+location.pathname+"?betaling=terug";return o.deeplink+(o.deeplink.includes("?")?"&":"?")+"returnUrl="+encodeURIComponent(ret)}
function onlineBlok(o,bedrag){const href=appLink(o);
  return `<div id="online"><a class="btn bc" id="bcGo" href="${esc(href||o.checkout||"#")}">${BC_ICON}Betaal ${eur(bedrag)} met Bancontact</a>
  <p class="hint c">${o.deeplink?"Je Bancontact- of bankapp opent en je bevestigt daar binnen 2 minuten.<br><small>Kom je op een pagina om een app te downloaden? Dan heb je geen app die Bancontact Pay ondersteunt: kies dan hieronder <b>overschrijving</b>.</small>":"Je gaat naar de beveiligde betaalpagina. Daar betaal je met de Bancontact-app, je bankapp of je kaart."}</p>
  ${o.qrcode?`<div class="qrwrap desk"><div class="qr"><img src="${esc(o.qrcode)}" alt="Bancontact-QR-code" width="200" height="200"></div><p>Op een computer? Scan deze code met de Bancontact-app of de app van je bank.</p></div>`:""}
  <p class="wacht" id="bcStatus" aria-live="polite"></p></div>`}
let KLAAR=null;
function toonKlaar(j){KLAAR=j;if(!(j.bedrag>0)){gratisKlaar(j);return}
  const o=j.online&&(j.online.deeplink||j.online.checkout)?j.online:null;
  $("#box").innerHTML=`<div class="card ok"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>Bedankt, ${esc(j.voornaam)}!</h2><p>Je inschrijving voor ${j.personen} ${j.personen===1?"persoon":"personen"} is goed ontvangen.</p>
  ${j.rekeningnummer||o?`<div class="paybox" id="paybox">${o?"":`<h3>Betaal ${eur(j.bedrag)}${j.deadline?" voor "+esc(j.deadline):""}</h3>`}
  ${o?onlineBlok(o,j.bedrag)+`<details class="zelf"><summary>Geen app of lukt het niet? Betaal via overschrijving</summary>${j.deadline?`<p class="hint" style="margin:0 0 10px">Schrijf het bedrag over voor <b>${esc(j.deadline)}</b>.</p>`:""}${handmatig(j)}</details>`
     :`${j.qr?`<div class="qrwrap"><div class="qr">${j.qr}</div><p>Scan deze code met de app van je bank. Bedrag, rekeningnummer en mededeling staan dan al ingevuld.</p></div><div class="or"><span>of schrijf zelf over</span></div>`:""}${handmatig(j)}`}
  </div>`:""}</div>`;
  if(o){BET={t:o.t||"leden",id:o.id,token:o.token};volg()}}
let BET=null,volgT=0,volgN=0;
function betaald(){const j=KLAAR||{};const f=$$("#facts .fact");const tx=(k,sel)=>{const e=f[k]&&f[k].querySelector(sel);return e?e.textContent.trim():""};
  const menu=j.personen===2?esc(j.menu1||"")+" + "+esc(j.menu2||""):esc(j.menu1||"");
  $("#box").innerHTML=`<div class="card bevestig"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h2>Je bent succesvol ingeschreven!</h2><p class="lead2">Bedankt${j.voornaam?", "+esc(j.voornaam):""}. Je betaling${j.bedrag?" van <b>"+eur(j.bedrag)+"</b>":""} is goed ontvangen en je inschrijving voor de familiedag is helemaal in orde.</p>
  <div class="sam">${j.naam?`<div><span>Naam</span><b>${esc(j.naam)}</b></div>`:""}${j.personen?`<div><span>Aanwezig</span><b>${j.personen===2?"2 personen":"1 persoon"}</b></div>`:""}${j.menu1?`<div><span>Menu</span><b>${menu}</b></div>`:""}
  ${tx(0,"b")?`<div><span>Wanneer</span><b>${esc(tx(0,"b"))}${tx(0,"small")?", "+esc(tx(0,"small")):""}</b></div>`:""}${tx(1,"b")?`<div><span>Waar</span><b>${esc(tx(1,"b"))}${tx(1,"small")?", "+esc(tx(1,"small")):""}</b></div>`:""}</div>
  <p class="tot">Tot dan!</p></div>`;window.scrollTo({top:0,behavior:"smooth"});try{sessionStorage.removeItem("vbha_fd")}catch(x){}}
async function volg(){clearTimeout(volgT);if(!BET)return;
  try{const r=await fetch(`/api/betaling?t=${encodeURIComponent(BET.t)}&id=${encodeURIComponent(BET.id)}&token=${encodeURIComponent(BET.token)}`);const s=await r.json();
    if(s.status==="SUCCEEDED"){betaald();return}
    const st=$("#bcStatus");
    if(["EXPIRED","CANCELLED","FAILED","AUTHORIZATION_FAILED"].includes(s.status)){if(st)st.innerHTML=`${s.status==="EXPIRED"?"Deze betaling is verlopen.":"De betaling is niet gelukt."} <button type="button" class="cp" id="bcNieuw">Opnieuw proberen</button>`;const g=$("#bcGo");if(g)g.classList.add("off");return}
    if(s.status==="IDENTIFIED"||s.status==="AUTHORIZED"){if(st)st.textContent="Bevestig de betaling in je app…"}
  }catch(x){}
  if(++volgN<200)volgT=setTimeout(volg,document.hidden?8000:3000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&BET){volgN=0;volg()}});
document.addEventListener("click",async e=>{if(e.target.id!=="bcNieuw")return;e.target.disabled=true;
  try{const r=await fetch("/api/betaling",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(BET)});const o=await r.json();if(!r.ok)throw new Error(o.error);
    const blok=$("#online");if(blok)blok.outerHTML=onlineBlok({...o,id:BET.id,token:BET.token},o.bedrag);volgN=0;volg()}catch(x){e.target.disabled=false;e.target.textContent="Opnieuw proberen"}});


const MND=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"],DAG=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const lang=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");if(!m)return"";const d=new Date(+m[1],+m[2]-1,+m[3]);return DAG[d.getDay()].replace(/^./,c=>c.toUpperCase())+" "+(+m[3])+" "+MND[+m[2]-1]+" "+m[1]};
function gratisKlaar(j){$("#box").innerHTML=`<div class="card bevestig"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h2>Je bent ingeschreven!</h2><p class="lead2">Bedankt${j.voornaam?", "+esc(j.voornaam):""}. Je inschrijving voor ${j.personen} ${j.personen===1?"persoon":"personen"} is goed ontvangen. Je hoeft niets te betalen.</p>
  <div class="sam">${(j.lijnen||[]).map(l=>`<div><span>${esc(l.naam)}</span><b>${l.aantal}</b></div>`).join("")}${$("#fD").textContent!=="–"?`<div><span>Wanneer</span><b>${esc($("#fD").textContent)}${$("#fU").textContent?", "+esc($("#fU").textContent):""}</b></div>`:""}</div>
  <p class="tot">Tot dan!</p></div>`;window.scrollTo({top:0,behavior:"smooth"})}
let INFO=null,LID=false;const AANT={};
function prijsTxt(p){if(LID&&p.lidGratis&&p.prijs>0)return `<s>${eur(p.prijs)}</s>gratis`;return p.prijs>0?eur(p.prijs):"gratis"}
function tekenPrijzen(){$("#prijzen").innerHTML=INFO.prijzen.map(p=>{const n=AANT[p.id]||0;return `<div class="pr-r${n?" on":""}" data-id="${esc(p.id)}"><div class="nm"><b>${esc(p.naam)}</b>${p.uitleg?`<span>${esc(p.uitleg)}</span>`:""}${p.lidGratis&&p.prijs>0&&!LID?`<span>gratis voor leden</span>`:""}</div><span class="pp">${prijsTxt(p)}</span>
  <div class="stp"><button type="button" data-d="-1" aria-label="Eén minder"${n?"":" disabled"}>−</button><output aria-live="polite">${n}</output><button type="button" data-d="1" aria-label="Eén meer">+</button></div></div>`}).join("");upd()}
function totaal(){let t=0,n=0;for(const p of INFO.prijzen){const a=AANT[p.id]||0;n+=a;t+=a*(LID&&p.lidGratis?0:p.prijs)}return{t:Math.round(t*100)/100,n}}
function upd(){const T=totaal(),pay=$("#pay");if(!T.n){pay.hidden=true;$("#go").textContent="Inschrijven";return}pay.hidden=false;
  pay.innerHTML=T.t>0?`Te betalen: <b>${eur(T.t)}</b> voor ${T.n} ${T.n===1?"persoon":"personen"}. ${INFO.online?"Na het inschrijven betaal je meteen met Bancontact of met een overschrijving.":"Na het inschrijven zie je hoe je overschrijft."}`:`${T.n} ${T.n===1?"persoon":"personen"} · <b>gratis</b>${LID?" voor leden":""}. Je hoeft niets te betalen.`;
  $("#go").textContent=T.t>0?"Inschrijven en betalen":"Inschrijven"}
document.addEventListener("click",e=>{const b=e.target.closest(".stp button");if(!b)return;const id=b.closest(".pr-r").dataset.id;AANT[id]=Math.max(0,Math.min(30,(AANT[id]||0)+ +b.dataset.d));tekenPrijzen()});
document.addEventListener("change",e=>{if(e.target.name==="wie"){const niet=e.target.value==="niet";$("#wLid").hidden=niet;$("#wNiet").hidden=!niet;LID=!niet&&!!$("#naam").dataset.id;$("#emHint").textContent=niet?"(verplicht, voor de bevestiging)":"(voor de bevestiging; leeg = het adres dat we van je kennen)";tekenPrijzen()}});
function gesloten(j){$("#box").innerHTML=`<div class="card bevestig"><div class="ic" style="background:var(--sunken);color:var(--muted)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h2>De inschrijvingen zijn afgesloten</h2><p class="lead2">${j.gesloten==="verlopen"&&j.totTekst?"Inschrijven kon tot en met "+esc(j.totTekst)+".":"Je kan je op dit moment niet inschrijven."} Vragen? Mail naar info@vbha.be.</p></div>`}
function alMeld(inp,t){let m=document.getElementById("alMeld");const go=$("#go");
  if(!t){if(m)m.remove();if(go&&go.dataset.al){go.disabled=false;delete go.dataset.al}return}
  if(!m){m=document.createElement("div");m.id="alMeld";m.setAttribute("role","alert");m.style.cssText="margin:8px 0 0;padding:10px 12px;border-radius:10px;background:#fdecea;color:#8a1c12;border:1px solid #f5c2bd;font-size:14.5px;line-height:1.45";
    (inp.closest(".lp")||inp.parentElement).append(m)}
  const k=t.indexOf(". ");m.innerHTML=k>0?"<b>"+esc(t.slice(0,k+1))+"</b> "+esc(t.slice(k+2)):esc(t);if(go){go.disabled=true;go.dataset.al="1"}}

async function lidPrijs(id){alMeld($("#naam"),"");LID=!!id;tekenPrijzen();if(!id)return;
  try{const r=await fetch("/api/familiedag?lid="+encodeURIComponent(id));const j=await r.json();if(r.ok&&j.al){alMeld($("#naam"),j.melding)}}catch(x){}}
fetch("/api/familiedag").then(r=>r.ok?r.json():null).then(j=>{if(!j)return;INFO=j;$("#h1").textContent=j.titel;document.title=j.titel+" · VBHA";
  $("#fD").textContent=j.datum?lang(j.datum):"Datum volgt";$("#fU").textContent=j.uur?"vanaf "+j.uur:"";
  const loc=String(j.locatie||"").split(",");$("#fL").textContent=loc[0]||"Locatie volgt";$("#fL2").textContent=loc.slice(1).join(",").trim();
  $("#fT").textContent=j.totTekst?"t.e.m. "+j.totTekst.replace(/ \d{4}$/,""):"–";$("#fP").textContent=j.prijzen.some(p=>p.lidGratis&&p.prijs>0)?"gratis voor leden":"";
  if(j.info){$("#info").hidden=false;$("#info").textContent=j.info}$("#lead").textContent=j.prijzen.every(p=>p.lidGratis||!p.prijs)?"Een dag vol plezier voor het hele gezin, aangeboden door de vriendenkring. Schrijf je hier in.":"Een dag vol plezier voor het hele gezin. Schrijf je hier in"+(j.online?" en betaal meteen online.":".");
  $("#wie").hidden=!j.nietLeden;tekenPrijzen();if(!j.open)gesloten(j)});
$("#f").addEventListener("submit",async e=>{e.preventDefault();const er=$("#err");er.textContent="";const niet=!$("#wNiet").hidden;
  const d={lidId:niet?"":$("#naam").dataset.id||"",naam:niet?$("#nNaam").value.trim():$("#naam").value.trim(),email:$("#email").value.trim(),aantallen:AANT,opmerking:$("#opm").value.trim(),website:$("#website").value,duur:Date.now()-t0};
  if(!niet&&!d.lidId){er.textContent=d.naam?"Kies je naam uit de lijst van leden.":"Vul je naam in en kies ze uit de lijst.";$("#naam").focus();return}
  if(niet&&d.naam.length<3){er.textContent="Vul je naam in.";$("#nNaam").focus();return}
  if(niet&&!/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]{2,}$/.test(d.email)){er.textContent="Vul een geldig e-mailadres in.";$("#email").focus();return}
  if(!totaal().n){er.textContent="Kies met hoeveel personen je komt.";return}
  const b=$("#go");b.disabled=true;const tx=b.textContent;b.textContent="Bezig…";
  try{const r=await fetch("/api/familiedag",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Inschrijven lukte niet.");
    const v={...j,naam:d.naam,voornaam:j.voornaam||d.naam.split(" ").slice(-1)[0]};toonKlaar(v);try{sessionStorage.setItem("vbha_fd",JSON.stringify({...v,qr:null}))}catch(x){}window.scrollTo({top:0,behavior:"smooth"})}
  catch(x){er.textContent=x.message;b.disabled=false;b.textContent=tx}});
(function(){if(!/[?&]betaling=terug/.test(location.search))return;let j=null;try{j=JSON.parse(sessionStorage.getItem("vbha_fd")||"null")}catch(x){}if(!j)return;history.replaceState(null,"",location.pathname);toonKlaar(j)})();
/* naam van het lid kiezen: suggesties terwijl je typt */
function lidPicker(inp){const wrap=inp.parentElement;wrap.classList.add("lp");const box=document.createElement("div");box.className="lp-l";box.hidden=true;box.setAttribute("role","listbox");wrap.append(box);
  let T=0,L=[],sel=-1,laatste="";inp.setAttribute("autocomplete","off");inp.setAttribute("role","combobox");inp.setAttribute("aria-autocomplete","list");
  const mark=(n,q)=>{const t=q.trim().split(/\s+/).filter(Boolean);let h=esc(n);for(const x of t){const re=new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","i");h=h.replace(re,"<b>$1</b>")}return h};
  const teken=q=>{if(!L.length){box.innerHTML=q.trim().length>=3?'<div class="lp-leeg">Geen lid gevonden met deze naam.</div>':"";box.hidden=q.trim().length<3;return}
    box.innerHTML=L.map((l,i)=>`<button type="button" class="lp-i${i===sel?" on":""}" data-i="${i}" role="option">${mark(l.naam,q)}</button>`).join("");box.hidden=false};
  const kies=l=>{inp.value=l.naam;inp.dataset.id=l.id;inp.classList.add("lp-ok");box.hidden=true;laatste=l.naam;lidPrijs(l.id)};
  inp.addEventListener("input",()=>{if(inp.dataset.id)lidPrijs(null);delete inp.dataset.id;inp.classList.remove("lp-ok");clearTimeout(T);const q=inp.value;sel=-1;
    if(q.trim().length<3){L=[];box.hidden=true;return}
    T=setTimeout(async()=>{try{const r=await fetch("/api/leden?q="+encodeURIComponent(q));L=r.ok?await r.json():[];}catch(e){L=[]}if(inp.value===q)teken(q)},160)});
  inp.addEventListener("keydown",e=>{if(box.hidden||!L.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();sel=(sel+1)%L.length;teken(inp.value)}else if(e.key==="ArrowUp"){e.preventDefault();sel=(sel-1+L.length)%L.length;teken(inp.value)}
    else if(e.key==="Enter"){e.preventDefault();kies(L[sel<0?0:sel])}else if(e.key==="Escape"){box.hidden=true}});
  box.addEventListener("mousedown",e=>{const b=e.target.closest(".lp-i");if(!b)return;e.preventDefault();kies(L[+b.dataset.i])});
  inp.addEventListener("blur",()=>setTimeout(()=>{box.hidden=true;if(!inp.dataset.id&&L.length===1&&inp.value.trim())kies(L[0])},150));}
lidPicker($("#naam"));
