<title>Webshop · VBHA</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F5F6;--surface:#FFFFFF;--sunken:#F1F1F2;--ink:#1A1B1E;--muted:#686B71;--line:#E5E6E8;--line-strong:#CCCED2;--navy:#18191C;--accent:#C0161F;--accent-deep:#8F0F16;--accent-soft:#FCEBEC;--good:#18794A;--good-soft:#E3F4EA;--info:#2F6FE4;--info-soft:#E4EDFD;--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--surface:#1A1B1E;--sunken:#202226;--ink:#ECEDEF;--muted:#9B9EA5;--line:#2A2C30;--line-strong:#3C3F45;--accent-soft:#3A1416;--good-soft:#12301F;--info-soft:#16233D}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
.hdr{background:var(--navy);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;color:#fff}
.hdr .logo{height:30px;width:auto;display:block}
.hmand{margin-left:auto;position:relative;width:44px;height:44px;display:grid;place-items:center;border:1px solid #3a3c40;border-radius:10px;background:transparent;color:#fff;cursor:pointer;padding:0;flex:none}
.hmand:hover{border-color:#6a6c70}.hmand svg{width:22px;height:22px}
.hmand b{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#c0161f;color:#fff;font:700 12px/20px system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--navy)}
.hmand.bump{animation:hb .35s}@keyframes hb{40%{transform:scale(1.15)}}
.hdr span{font-size:13.5px;color:#A4A7AD;border-left:1px solid #3a3c40;padding-left:14px}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.title{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.title img{height:48px;width:auto}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
label,.lbl{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line-strong);border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;background:var(--surface)}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input:focus-visible+span{box-shadow:0 0 0 3px var(--info-soft)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pay{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--sunken);font-size:14px}
.pay b{font-variant-numeric:tabular-nums}
.err{color:var(--accent);font-weight:500;min-height:0;margin:14px 0 0}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;width:100%;padding:13px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 16px var(--f);cursor:pointer}
.btn:hover{background:var(--accent-deep)}
.btn:disabled{opacity:.6;cursor:default}
.ok{text-align:center;padding:30px 22px}
.ok .ic{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 14px}
.ok .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok h2{margin:0 0 8px;font-size:22px}
.ok p{margin:0 0 6px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;color:var(--ink)}
.paybox{text-align:left;margin-top:22px;padding:18px;border-radius:12px;background:var(--sunken)}
.paybox h3{margin:0 0 14px;font-size:17px;text-align:center}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr{width:200px;max-width:70vw;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qrwrap p{margin:0;font-size:13.5px;color:var(--muted);text-align:center;max-width:34ch}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.pd{margin:0;display:flex;flex-direction:column;gap:10px}
.pd>div{display:flex;flex-direction:column;gap:3px}
.pd dt{font-size:12.5px;color:var(--muted)}
.pd dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.pd .mono{margin:0}
.cp{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 10px;font:500 12.5px var(--f);cursor:pointer}
.cp:hover{border-color:var(--ink)}
.cp.ok{border-color:var(--good);color:var(--good)}
.btn.bc{margin-top:0;background:#1A1B1E;font-size:16.5px;padding:15px 18px;text-decoration:none}
.btn.bc:hover{background:#000}
.btn.bc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.bc.off{opacity:.45;pointer-events:none}
.hint.c{text-align:center;margin:8px 0 0}
.qrwrap.desk{margin-top:16px}
@media (pointer:coarse){.qrwrap.desk{display:none}}
.qr img{display:block;width:100%;height:auto}
.wacht{margin:10px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.wacht:empty{display:none}
.zelf{margin-top:16px;border-top:1px solid var(--line-strong);padding-top:12px}
.zelf summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style-position:inside}
.zelf[open] summary{margin-bottom:12px}
.paid{text-align:center;padding:6px 0}
.paid h3{margin:0 0 6px}
.paid p{margin:0;color:var(--muted)}
.paid .ic{width:48px;height:48px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 10px}
.paid .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.paybox .hint{margin:12px 0 0;font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr 1fr}h1{font-size:23px}.card{padding:18px}.hdr span{display:none}}
.hero h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.fact span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.fact b{display:block;font-weight:600;font-size:15px;margin-top:2px}
.fact small{display:block;color:var(--muted);font-size:13px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch label{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px 12px 40px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--surface)}
.ch input{position:absolute;left:14px;top:15px;width:18px;height:18px;margin:0;accent-color:var(--accent)}
.ch b{font-weight:600}.ch span{font-size:13px;color:var(--muted)}
.ch .pr{font-size:17px;font-weight:700;color:var(--ink)}
.ch label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-height:80px;resize:vertical}
textarea:focus,input[type=date]:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
input[type=date]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.kid{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;align-items:end;background:var(--sunken)}
.kid .age{grid-column:1/-1;font-size:13px;color:var(--muted);min-height:1em;margin-top:-4px}
.kdel{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;padding:10px 8px;border-radius:6px}
.kdel:hover{background:var(--accent-soft);color:var(--accent)}
.kadd{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--line-strong);background:none;border-radius:10px;padding:10px 16px;font-weight:600;color:var(--accent);cursor:pointer;margin-top:10px}
.kadd:hover{border-color:var(--accent);background:var(--accent-soft)}
.sum{margin:8px 0 0;color:var(--muted)}
@media (max-width:560px){.facts{grid-template-columns:1fr 1fr}.facts .fact:last-child{grid-column:1/-1}.ch{grid-template-columns:1fr}.kid{grid-template-columns:1fr}}
.bevestig{text-align:center;padding:34px 24px}
.bevestig .ic{width:72px;height:72px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px}
.bevestig .ic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bevestig h2{margin:0 0 8px;font-size:24px}
.bevestig .lead2{margin:0 auto;max-width:440px;color:var(--muted);font-size:15.5px}
.bevestig .sam{margin:22px auto 0;max-width:420px;border:1px solid var(--line);border-radius:12px;text-align:left;overflow:hidden}
.bevestig .sam div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14.5px}
.bevestig .sam div+div{border-top:1px solid var(--line)}
.bevestig .sam span{color:var(--muted)}
.bevestig .sam b{text-align:right}
.bevestig .tot{margin:22px 0 0;font-size:18px;font-weight:700}
.lp{position:relative}
.lp-l{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;overflow:hidden;max-height:280px;overflow-y:auto}
.lp-l[hidden]{display:none}
.lp-i{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.lp-i+.lp-i{border-top:1px solid var(--line)}
.lp-i:hover,.lp-i.on{background:var(--sunken)}
.lp-i b{font-weight:700}
.lp-leeg{padding:11px 14px;font-size:14px;color:var(--muted)}
.lp input.lp-ok{border-color:var(--good);background:var(--good-soft)}
/* iPhone: datumvelden niet breder dan hun vak, geen schuifbalken */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;box-sizing:border-box;min-height:44px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
html,body{overflow-x:hidden}
@media (max-width:760px){*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}}
.kid>*{min-width:0}
.lp-prijs{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:10px;background:#f3f8f4;border:1px solid #cfe7d6;font-size:14.5px}
.lp-prijs small{color:var(--muted)}.lp-prijs[hidden]{display:none}
.lp-st{flex:none;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#fff;background:#a5703f}
.lp-st.zilver{background:#8d959e}.lp-st.goud{background:#c19a2e}
.fk{display:block;font-size:12.5px;color:var(--muted)}
</style>
<style>
main{max-width:980px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:520px){.prods{grid-template-columns:1fr 1fr;gap:10px}}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s,transform .15s}
.pr:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-1px)}
.pr .im{aspect-ratio:1/1;background:#f3f3f4 center/cover no-repeat;position:relative}
.pr .im .uit{position:absolute;left:8px;top:8px;background:#1a1b1e;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.pr .bd{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pr .bd b{font-size:15.5px;line-height:1.25}.pr .bd .pz{font-size:17px;font-weight:800;color:var(--accent);margin-top:auto}
.pr .add{margin:0 12px 12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 15px var(--f);padding:11px;cursor:pointer}
.pr .add:disabled{background:var(--sunken);color:var(--muted);cursor:default}
.pr .q{display:flex;align-items:center;justify-content:space-between;margin:0 12px 12px;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.pr .q button{width:44px;height:42px;border:0;background:var(--sunken);font-size:20px;color:var(--ink);cursor:pointer}.pr .q span{font-weight:700;font-size:16px}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
@media (prefers-color-scheme:dark){.mbar{background:rgba(26,27,30,.92)}}
.mbar button{width:100%;max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 16px var(--f);padding:15px 18px;cursor:pointer}
.mbar[hidden]{display:none}
body.met-bar main{padding-bottom:100px}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg[hidden]{display:none}
.dlg .in{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px}
@media (min-width:700px){.dlg{align-items:center}.dlg .in{border-radius:18px}}
.dlg .x{float:right;border:0;background:var(--sunken);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;color:var(--ink)}
.gal{aspect-ratio:1/1;background:#f3f3f4 center/contain no-repeat;border-radius:12px;margin:0 0 10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px}.thumbs button{flex:none;width:64px;height:64px;border-radius:10px;border:2px solid transparent;background:#f3f3f4 center/cover no-repeat;cursor:pointer}
.thumbs button.on{border-color:var(--accent)}
.keuze{display:grid;gap:8px}
.keuze label{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line-strong);border-radius:12px;cursor:pointer;background:var(--surface)}
.keuze label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.keuze label.uit{opacity:.45;pointer-events:none}
.keuze input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.keuze .t{flex:1;display:flex;flex-direction:column}.keuze .t small{color:var(--muted);font-size:13px}.keuze .pz{font-weight:700}
.ml{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ml .im{width:52px;height:52px;border-radius:10px;background:#f3f3f4 center/cover no-repeat;flex:none}
.ml .t{flex:1;min-width:0}.ml .t b{display:block}.ml .t small{color:var(--muted)}
.ml .q{display:flex;align-items:center;gap:6px}.ml .q button{width:34px;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}.tot.g{font-size:20px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
h3.s{margin:20px 0 10px;font-size:17px}
</style>

<script>
const adresVolledig=s=>{s=String(s||"").trim();return /[A-Za-zÀ-ÿ]{2,}/.test(s)&&/\b[1-9]\d{3}\s+[A-Za-zÀ-ÿ'’][A-Za-zÀ-ÿ'’ .\-]+/.test(s)&&/[A-Za-zÀ-ÿ.]\s*\d+\s*[A-Za-z]?\b(?=.*\b[1-9]\d{3}\b)/.test(s)};
const $=s=>document.querySelector(s),t0=Date.now(),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+Number(n||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const img=id=>id?"/api/shop?img="+encodeURIComponent(id):"";
let W=null,MAND={},LEV="post",BET="",BETS=null,volgT=0,volgN=0;
try{MAND=JSON.parse(localStorage.getItem("vbha_shop")||"{}")||{}}catch(x){}
const bewaar=()=>{try{localStorage.setItem("vbha_shop",JSON.stringify(MAND))}catch(x){}};
const item=id=>(W&&W.items||[]).find(i=>i.id===id);
function mandLijst(){return Object.entries(MAND).map(([id,n])=>({i:item(id),n})).filter(x=>x.i&&x.n>0)}
function sub(){return mandLijst().reduce((s,x)=>s+x.i.prijs*x.n,0)}
function gewicht(){return mandLijst().reduce((s,x)=>s+(x.i.gewicht||0)*x.n,0)}
function vk(){if(LEV!=="post")return{prijs:0,naam:"Afhalen in de kazerne"};const s=sub();if(W.gratisVanaf&&s>=W.gratisVanaf)return{prijs:0,naam:"Gratis verzending"};const g=gewicht()+(W.verpakking||0),t=(W.tarieven||[]).find(x=>g<=x.tot);return t?{prijs:t.prijs,naam:t.naam||("tot "+t.tot+" g")}:null}
function zet(id,n){const i=item(id);if(!i)return;n=Math.max(0,Math.min(50,n,i.voorraad!=null?i.voorraad:50));if(n)MAND[id]=n;else delete MAND[id];bewaar();balk()}
function balk(){const L=mandLijst(),n=L.reduce((a,x)=>a+x.n,0),b=$("#mbar");b.hidden=!n||VIEW!=="shop";document.body.classList.toggle("met-bar",!b.hidden);$("#mbT").textContent=`Winkelmandje (${n})`;const hn=$("#hN"),hm=$("#hMand");if(hn&&hm){if(String(n)!==hn.textContent&&n>Number(hn.textContent||0)){hm.classList.remove("bump");void hm.offsetWidth;hm.classList.add("bump")}hn.textContent=n;hn.hidden=!n;hm.setAttribute("aria-label",n?`Winkelmandje: ${n} artikel${n>1?"s":""}, ${eur(sub())}`:"Winkelmandje is leeg");hm.title=n?`Winkelmandje (${n}) · ${eur(sub())}`:"Je winkelmandje is nog leeg"}$("#mbP").textContent=eur(sub())+" →"}
let VIEW="shop";
function winkel(){VIEW="shop";const L=W.items||[];
  $("#box").innerHTML=L.length?`<div class="prods">${L.map(i=>{const n=MAND[i.id]||0;return `<div class="pr" data-toon="${esc(i.id)}"><div class="im" style="background-image:url('${img(i.hoofd)}')">${i.uitverkocht?'<span class="uit">Uitverkocht</span>':""}</div><div class="bd"><b>${esc(i.naam)}</b><span class="pz">${eur(i.prijs)}</span></div>
    ${i.uitverkocht?'<button class="add" disabled>Uitverkocht</button>':n?`<div class="q" data-stop><button type="button" data-q="${esc(i.id)}" data-d="-1" aria-label="Eén minder">−</button><span>${n}</span><button type="button" data-q="${esc(i.id)}" data-d="1" aria-label="Eén meer">+</button></div>`:`<button class="add" type="button" data-add="${esc(i.id)}">In mandje</button>`}</div>`}).join("")}</div>`:'<div class="card"><p style="margin:0">Er staan nog geen artikelen in de webshop.</p></div>';balk()}
function detail(id){const i=item(id);if(!i)return;let cur=i.hoofd;const A=i.afbeeldingen.length?i.afbeeldingen:[i.hoofd].filter(Boolean);
  const teken=()=>{$("#dlgIn").innerHTML=`<button class="x" data-dlgx aria-label="Sluiten">×</button><h2 style="margin:4px 0 12px">${esc(i.naam)}</h2>${cur?`<div class="gal" style="background-image:url('${img(cur)}')"></div>`:""}${A.length>1?`<div class="thumbs">${A.map(a=>`<button type="button" class="${a===cur?"on":""}" data-th="${esc(a)}" style="background-image:url('${img(a)}')" aria-label="Afbeelding"></button>`).join("")}</div>`:""}
    <p style="margin:0 0 12px;white-space:pre-line">${esc(i.beschrijving)}</p><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><b style="font-size:22px;color:var(--accent)">${eur(i.prijs)}</b>${i.uitverkocht?'<span class="muted">Uitverkocht</span>':`<button class="btn" style="width:auto;margin:0" data-add="${esc(i.id)}" data-dlgx>In mandje</button>`}</div>`;
    $("#dlgIn").querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{cur=b.dataset.th;teken()})};
  teken();$("#dlg").hidden=false}
document.addEventListener("click",e=>{const a=e.target.closest("[data-add]");if(a){e.stopPropagation();zet(a.dataset.add,(MAND[a.dataset.add]||0)+1);if(a.hasAttribute("data-dlgx"))$("#dlg").hidden=true;if(VIEW==="shop")winkel();return}
  const q=e.target.closest("[data-q]");if(q){e.stopPropagation();zet(q.dataset.q,(MAND[q.dataset.q]||0)+ +q.dataset.d);VIEW==="kassa"?afrekenen():winkel();return}
  if(e.target.closest("[data-stop]"))return;
  if(e.target.closest("[data-dlgx]")||e.target.id==="dlg"){$("#dlg").hidden=true;return}
  const t=e.target.closest("[data-toon]");if(t){detail(t.dataset.toon);return}
  if(e.target.closest("#naarMand")){afrekenen();window.scrollTo({top:0})}
  if(e.target.closest("#hMand")){if(mandLijst().length){afrekenen();window.scrollTo({top:0})}else{if(VIEW!=="shop")winkel();window.scrollTo({top:0,behavior:"smooth"})}}
  if(e.target.id==="terug"){winkel();window.scrollTo({top:0})}});
/* ---------- afrekenen ---------- */
function afrekenen(){VIEW="kassa";balk();const L=mandLijst();if(!L.length){winkel();return}const v=vk(),s=sub(),tot=s+(v?v.prijs:0),bc=W.online;if(BET==="cash"&&LEV!=="afhalen")BET="";if(BET==="bancontact"&&!bc)BET="";
  const vals={};document.querySelectorAll("#f input,#f textarea").forEach(x=>vals[x.name]=x.value);
  $("#box").innerHTML=`<div class="card"><p style="margin:0 0 6px"><button type="button" class="linkb" id="terug" style="border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font:inherit">← Verder winkelen</button></p>
   <h3 class="s" style="margin-top:6px">Je winkelmandje</h3>${L.map(x=>`<div class="ml"><div class="im" style="background-image:url('${img(x.i.hoofd)}')"></div><div class="t"><b>${esc(x.i.naam)}</b><small>${eur(x.i.prijs)}</small></div><div class="q"><button type="button" data-q="${esc(x.i.id)}" data-d="-1">−</button><b>${x.n}</b><button type="button" data-q="${esc(x.i.id)}" data-d="1">+</button></div></div>`).join("")}
   <h3 class="s">Levering</h3><div class="keuze">
    <label><input type="radio" name="lev" value="post"${LEV==="post"?" checked":""}><span class="t"><b>Verzenden met bpost</b><small>Naar je adres in België</small></span><span class="pz">${LEV==="post"?(v?(v.prijs?eur(v.prijs):"gratis"):"te zwaar"):""}</span></label>
    <label><input type="radio" name="lev" value="afhalen"${LEV==="afhalen"?" checked":""}><span class="t"><b>Afhalen in de kazerne</b><small>${esc(W.afhaaladres||"")}. We nemen contact met je op voor een afspraak.</small></span><span class="pz">gratis</span></label></div>
   <h3 class="s">Betalen</h3><div class="keuze">
    <label class="${bc?"":"uit"}"><input type="radio" name="bet" value="bancontact"${BET==="bancontact"?" checked":""}${bc?"":" disabled"}><span class="t"><b>Bancontact</b><small>Meteen betalen met de Bancontact- of bankapp</small></span></label>
    <label><input type="radio" name="bet" value="overschrijving"${BET==="overschrijving"?" checked":""}><span class="t"><b>Overschrijving</b><small>Je krijgt de betaalgegevens per mail</small></span></label>
    <label class="${LEV==="afhalen"?"":"uit"}"><input type="radio" name="bet" value="cash"${BET==="cash"?" checked":""}${LEV==="afhalen"?"":" disabled"}><span class="t"><b>Cash bij afhalen</b><small>${LEV==="afhalen"?"Je betaalt wanneer je de bestelling ophaalt":"Enkel mogelijk bij afhalen"}</small></span></label></div>
   <h3 class="s">Je gegevens</h3><form id="f" novalidate><div class="grid">
    <div><label for="voornaam">Voornaam *</label><input type="text" id="voornaam" name="voornaam" autocomplete="given-name" maxlength="80" value="${esc(vals.voornaam||"")}"></div>
    <div><label for="naam">Naam *</label><input type="text" id="naam" name="naam" autocomplete="family-name" maxlength="80" value="${esc(vals.naam||"")}"></div>
    <div class="full"><label for="adres">Adres *</label><input type="text" id="adres" name="adres" autocomplete="street-address" placeholder="Straat nr, postcode gemeente" maxlength="200" value="${esc(vals.adres||"")}"></div>
    <div><label for="email">E-mail *</label><input type="email" id="email" name="email" autocomplete="email" inputmode="email" maxlength="120" value="${esc(vals.email||"")}"></div>
    <div><label for="telefoon">Telefoon *</label><input type="tel" id="telefoon" name="telefoon" autocomplete="tel" maxlength="40" value="${esc(vals.telefoon||"")}"></div>
    <div class="full"><label for="opmerking">Opmerking <span style="font-weight:400;color:var(--muted)">(optioneel)</span></label><textarea id="opmerking" name="opmerking" maxlength="500" style="min-height:60px">${esc(vals.opmerking||"")}</textarea></div></div>
    <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <div style="margin-top:16px"><div class="tot"><span>Artikelen</span><span>${eur(s)}</span></div><div class="tot"><span>${LEV==="post"?"Verzending":"Afhalen"}</span><span>${LEV==="post"?(v?(v.prijs?eur(v.prijs):"gratis"):"–"):"gratis"}</span></div><div class="tot g"><span>Totaal</span><span>${eur(tot)}</span></div></div>
    <p class="err" id="err" role="alert"></p><button class="btn" id="go" type="submit"${v?"":" disabled"}>${BET==="bancontact"?"Bestellen en betalen":"Bestelling plaatsen"}</button></form></div>`;
  $("#f").onsubmit=bestel}
document.addEventListener("change",e=>{if(e.target.name==="lev"){LEV=e.target.value;afrekenen()}else if(e.target.name==="bet"){BET=e.target.value;const g=$("#go");if(g)g.textContent=BET==="bancontact"?"Bestellen en betalen":"Bestelling plaatsen"}});
async function bestel(e){e.preventDefault();const f=e.target,er=$("#err");er.textContent="";const d=Object.fromEntries(new FormData(f));
  const miss=[["voornaam","je voornaam"],["naam","je naam"],["adres","je adres"],["email","je e-mailadres"],["telefoon","je telefoonnummer"]].find(([k])=>!String(d[k]||"").trim());
  if(miss){er.textContent="Vul "+miss[1]+" in.";f.elements[miss[0]].focus();return}
  if(!adresVolledig(d.adres)){er.textContent="Vul je volledige adres in: straat, huisnummer, postcode en gemeente.";f.elements.adres.focus();return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(d.email).trim())){er.textContent="Dit e-mailadres lijkt niet te kloppen.";f.elements.email.focus();return}
  if(!BET){er.textContent="Kies hoe je betaalt.";return}
  const v=vk(),tot=Math.round((sub()+(v?v.prijs:0))*100)/100,b=$("#go");b.disabled=true;b.textContent="Bezig…";
  try{const r=await fetch("/api/shop",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...d,items:MAND,levering:LEV,betaalwijze:BET,totaal:tot,duur:Date.now()-t0})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Bestellen lukte niet.");
    MAND={};bewaar();try{sessionStorage.setItem("vbha_shop_best",JSON.stringify(j))}catch(x){}besteld(j)}
  catch(x){er.textContent=x.message;b.disabled=false;b.textContent="Opnieuw proberen"}}
function appLink(o){if(!o||!o.deeplink)return null;const ret=location.origin+location.pathname+"?betaling=terug";return o.deeplink+(o.deeplink.includes("?")?"&":"?")+"returnUrl="+encodeURIComponent(ret)}
async function besteld(j){VIEW="klaar";balk();window.scrollTo({top:0});
  if(j.betaalwijze==="bancontact"&&j.online){const o=j.online;$("#box").innerHTML=`<div class="card ok"><h2>Nog één stap, ${esc(j.voornaam)}!</h2><p>Bestelling <b>${esc(j.nr)}</b>: betaal <b>${eur(j.totaal)}</b> met Bancontact.</p><div class="paybox"><div id="online"><a class="btn bc" id="bcGo" href="${esc(appLink(o)||o.checkout||"#")}">Betaal ${eur(j.totaal)} met Bancontact</a>
      <p class="hint c">Je Bancontact- of bankapp opent. Lukt het niet? Je krijgt binnen 20 minuten een mail om via overschrijving te betalen.</p>${o.qrcode?`<div class="qrwrap desk"><div class="qr"><img src="${esc(o.qrcode)}" alt="Bancontact-QR-code" width="200" height="200"></div><p>Op een computer? Scan deze code met de Bancontact-app.</p></div>`:""}<p class="wacht" id="bcStatus" aria-live="polite"></p></div></div></div>`;BETS={t:"shop_orders",id:j.id,token:j.token};volgN=0;volg();return}
  toonBestelling(j.id,j.token,true)}
async function toonBestelling(id,token,nieuw){try{const r=await fetch(`/api/shop?b=${encodeURIComponent(id)}&t=${encodeURIComponent(token)}`);const o=await r.json();if(!r.ok)throw new Error(o.error);
  $("#box").innerHTML=`<div class="card bevestig"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>${o.betaald?"Betaald, bedankt!":"Bedankt voor je bestelling!"}</h2><p class="lead2">Bestelling <b>${esc(o.nr)}</b> · ${eur(o.totaal)}. ${nieuw?"Je krijgt een bevestiging per mail.":""}</p>
   ${o.iban?`<div class="paybox" style="text-align:left"><h3>Betaal via overschrijving</h3>${o.qr?`<div class="qrwrap"><div class="qr">${o.qr}</div><p>Scan met je bankapp: alles staat al ingevuld.</p></div><div class="or"><span>of schrijf zelf over</span></div>`:""}<dl class="pd"><div><dt>Bedrag</dt><dd><b>${eur(o.totaal)}</b></dd></div><div><dt>Rekeningnummer</dt><dd><span class="mono">${esc(o.iban)}</span></dd></div><div><dt>Begunstigde</dt><dd>${esc(o.begunstigde)}</dd></div><div><dt>Mededeling</dt><dd><span class="mono">${esc(o.mededeling)}</span></dd></div></dl></div>`:""}
   <div class="sam">${o.items.map(l=>`<div><span>${l.aantal} × ${esc(l.naam)}</span><b>${eur(l.prijs*l.aantal)}</b></div>`).join("")}<div><span>${o.levering==="post"?"Verzending":"Afhalen in de kazerne"}</span><b>${o.verzendkost?eur(o.verzendkost):"gratis"}</b></div></div>
   <p class="lead2" style="margin-top:16px">${o.levering==="post"?"We sturen je bestelling met bpost zodra ze betaald is.":"We nemen contact met je op om een moment af te spreken om af te halen."}</p>
   <button class="btn" type="button" id="terug" style="margin-top:18px">Terug naar de webshop</button></div>`}catch(x){$("#box").innerHTML=`<div class="card"><p style="margin:0">${esc(x.message)}</p></div>`}}
async function volg(){clearTimeout(volgT);if(!BETS)return;
  try{const r=await fetch(`/api/betaling?t=shop_orders&id=${encodeURIComponent(BETS.id)}&token=${encodeURIComponent(BETS.token)}`);const s=await r.json();
    if(s.status==="SUCCEEDED"){const b=BETS;BETS=null;setTimeout(()=>toonBestelling(b.id,b.token,true),1200);return}
    const st=$("#bcStatus");
    if(["EXPIRED","CANCELLED","FAILED","AUTHORIZATION_FAILED"].includes(s.status)){if(st)st.innerHTML=`${s.status==="EXPIRED"?"Deze betaling is verlopen.":"De betaling is niet gelukt."} <button type="button" class="cp" id="bcNieuw">Opnieuw proberen</button>`;const g=$("#bcGo");if(g)g.classList.add("off");return}
    if(s.status==="IDENTIFIED"||s.status==="AUTHORIZED"){if(st)st.textContent="Bevestig de betaling in je app…"}}catch(x){}
  if(++volgN<200)volgT=setTimeout(volg,document.hidden?8000:3000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&BETS){volgN=0;volg()}});
document.addEventListener("click",async e=>{if(e.target.id!=="bcNieuw")return;e.target.disabled=true;
  try{const r=await fetch("/api/betaling",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(BETS)});const o=await r.json();if(!r.ok)throw new Error(o.error);const g=$("#bcGo");if(g){g.href=appLink(o)||o.checkout;g.classList.remove("off")}$("#bcStatus").textContent="";volgN=0;volg()}catch(x){e.target.disabled=false}});
/* ---------- start ---------- */
(async()=>{const P=new URLSearchParams(location.search);
  try{const r=await fetch("/api/shop");W=await r.json();if(!r.ok)throw new Error(W.error);}catch(x){$("#box").innerHTML='<div class="card"><p style="margin:0">De webshop kon niet geladen worden. Probeer later opnieuw.</p></div>';return}
  $("#h1").textContent=W.naam||"Webshop";document.title=(W.naam||"Webshop")+" · VBHA";$("#intro").textContent=W.intro||"";
  for(const k of Object.keys(MAND))if(!item(k))delete MAND[k];
  if(P.get("b")){VIEW="klaar";toonBestelling(P.get("b"),P.get("t")||"",false);return}
  if(/[?&]betaling=terug/.test(location.search)){history.replaceState(null,"",location.pathname);let j=null;try{j=JSON.parse(sessionStorage.getItem("vbha_shop_best")||"null")}catch(x){}if(j){besteld(j);return}}
  if(!W.open){$("#box").innerHTML='<div class="card"><p style="margin:0">De webshop is momenteel gesloten. Kom later nog eens terug!</p></div>';return}
  winkel()})();
</script>
<script src="/adres.js" defer></script>
</body>
