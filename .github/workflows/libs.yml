name: Bibliotheken lokaal zetten
on: workflow_dispatch
permissions:
  contents: write
jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Downloaden en controleren (SRI)
        run: |
          set -e
          mkdir -p public/lib
          get() { curl -fsSL "$1" -o "public/lib/$2"; h=$(openssl dgst -$3 -binary "public/lib/$2" | openssl base64 -A); [ "$h" = "$4" ] || { echo "HASH FOUT $2: $h"; exit 1; }; echo "ok $2"; }
          get https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js xlsx.full.min.js sha512 r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==
          get https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js jszip.min.js sha512 XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==
          get https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js supabase.js sha512 5QlAIYM7a9+bg7jqFAqIhxKuoYPQPa3abmtLr896Wn8WLmRDUgOnAZKqVOP334elaXtEe/2f8roTZOFN10Xmzg==
          get https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js qrcode.min.js sha512 ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==
          get https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js leaflet.min.js sha512 puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==
          get https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js jsQR.js sha384 b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx
      - name: Bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lib
          git commit -m "Bibliotheken lokaal (public/lib) [skip ci]" || echo "niets nieuw"
          git push
