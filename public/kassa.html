.ks-man{display:flex;gap:8px;margin-top:10px}.ks-man input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;background:var(--surface);color:var(--ink)}
.ks-man .btn{margin:0;width:auto}
.linkb{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13.5px}
.ks-code{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.15em;text-align:center;font-size:22px!important;width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
/* kassascherm: alles op één scherm, grote tegels, vaste balk onderaan */
.ks-hdr{padding:10px 12px;position:sticky;top:0;z-index:30}.ks-hdr .in{max-width:none;gap:10px}
.ks-hdr b{color:#fff;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ks-hdr small{color:#c9cbd0;font-size:13px;white-space:nowrap}
.ks-hdr #menu{flex:none;width:38px;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;cursor:pointer}
.ks-hdr #menu svg{width:20px;height:20px;fill:#fff}
.ks-menu{position:fixed;top:56px;right:10px;z-index:40;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.25);min-width:230px;overflow:hidden}
.ks-menu button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:none;font:500 15.5px var(--f);color:var(--ink);text-align:left;cursor:pointer}
.ks-menu button+button{border-top:1px solid var(--line)}.ks-menu button b{color:var(--muted);font-weight:600}
main.ks{max-width:none;padding:10px 10px 0}
.vk{display:flex;flex-direction:column;height:calc(100vh - var(--hh,58px) - 18px);height:calc(100dvh - var(--hh,58px) - 18px)}
.vk .ks-tabs{margin-bottom:8px;flex:none;width:100%}
.pos2{flex:1;min-height:0;width:100%;display:grid;gap:10px;grid-auto-rows:auto;align-content:start;overflow-y:auto;padding-bottom:8px}
.pos2 .pt{min-height:0;height:100%;padding:8px;gap:2px;overflow:hidden}
.pos2 .pt svg{width:min(clamp(32px,8vw,56px),calc(var(--rh,200px)*.3))!important;height:min(clamp(32px,8vw,56px),calc(var(--rh,200px)*.3))!important;flex:none}
.pos2 .pt b{font-size:min(clamp(15px,4.2vw,20px),calc(var(--rh,200px)*.15));line-height:1.15}.pos2 .pt span{font-size:min(clamp(14px,3.8vw,18px),calc(var(--rh,200px)*.14))}
.pt .min{position:absolute;top:6px;left:6px;width:38px;height:38px;border-radius:999px;border:0;background:rgba(0,0,0,.1);color:var(--ink);font:800 26px/1 var(--f);display:grid;place-items:center;cursor:pointer}
.pt i{min-width:38px;height:38px;font-size:19px;top:6px;right:6px}
.balk{flex:none;width:100%;display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.balk .tot{display:flex;flex-direction:column;justify-content:center;padding:0 6px 0 2px;min-width:96px}
.balk .tot b{font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.balk .tot button{border:0;background:none;color:var(--muted);font:500 13px var(--f);padding:2px 0;text-align:left;cursor:pointer}
.balk .btn{margin:0;min-height:60px;font-size:18px;border-radius:12px}
.balk .btn:disabled{opacity:.35}
.bq .ks-acts .btn,.ks-acts .btn{min-height:58px}
/* lang drukken op een tegel: aantal ingeven */
.pt{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pt.lp{transform:scale(.96);transition:transform 1s}
.np-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.np{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.np h3{margin:0 0 4px;font-size:17px}.np .np-p{color:var(--muted);font-size:14px}
.np .np-v{font:700 40px/1.2 var(--f);text-align:center;padding:10px;margin:10px 0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--sunken);min-height:50px}
.np .np-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.np .np-k button{font:600 24px var(--f);padding:14px 0;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;-webkit-user-select:none;user-select:none}
.np .np-k button:active{background:var(--sunken)}
.np .np-a{display:grid;grid-template-columns:1fr 1fr;gap:8px}.np .np-a .btn{margin-top:12px}
.np .btn.sec2{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
</style>
<script src="/lib/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/kassa-iconen.js"></script>
</head>
<body>
<header class="hdr ks-hdr"><div class="in"><b id="hNaam">Kassa</b><small id="hTot"></small><button type="button" id="menu" aria-label="Menu" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div></header><div id="menuL" class="ks-menu" hidden></div>
<main class="ks"><div id="box"></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+Number(n||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const JSQR={src:"/lib/jsQR.js",sri:"sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx"};
const tril=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(x){}};
let TOK=null,ST=null,TAB="verkoop",MAND={},VK=null,vkT=0,naT=0;
try{const t=JSON.parse(localStorage.getItem("vbha_kassa")||"null");if(t&&t.tot>Date.now())TOK=t}catch(x){}
const post=async b=>{const r=await fetch("/api/kassa",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:TOK&&TOK.token,...b})});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"Er ging iets mis. Controleer de internetverbinding.");e.status=r.status;throw e}return j};
function fout(e){if(e&&e.status===401){login(e.message);return true}return false}
/* ---------- aanmelden ---------- */
function login(msg){stop();TOK=null;slaap();const mb=$("#menu");if(mb)mb.hidden=true;try{localStorage.removeItem("vbha_kassa")}catch(x){}$("#hNaam").textContent="Kassa";$("#hTot").textContent="";
  $("#box").innerHTML=`<form class="card" id="fl" novalidate style="margin-top:12px"><h2 style="margin:0 0 6px">Kassa</h2><p class="lead" style="margin:0 0 14px">Geef de kassacode in die je van het bestuur kreeg.</p><label for="kc">Kassacode</label><input type="text" id="kc" class="ks-code" autocomplete="off" autocapitalize="characters" maxlength="12"><p class="err" id="err" role="alert">${esc(msg||"")}</p><button class="btn" id="go" type="submit">Starten</button></form>`;
  $("#fl").onsubmit=async e=>{e.preventDefault();const b=$("#go");b.disabled=true;try{const j=await post({actie:"login",code:$("#kc").value});TOK=j;try{localStorage.setItem("vbha_kassa",JSON.stringify(j))}catch(x){}await laad();toon()}catch(x){$("#err").textContent=x.message;b.disabled=false}}}
/* scherm wakker houden zolang de kassa open is (Screen Wake Lock; zelf vergrendelen blijft mogelijk) */
let WL=null;async function wakker(){try{if(!("wakeLock" in navigator)||!TOK||document.visibilityState!=="visible"||WL)return;WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}catch(e){WL=null}}
function slaap(){try{if(WL)WL.release()}catch(e){}WL=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wakker()});
["click","touchend"].forEach(t=>document.addEventListener(t,()=>{if(!WL)wakker()},{passive:true}));
async function laad(){ST=await post({actie:"stand"});wakker();$("#hNaam").textContent="Kassa · "+ST.naam;hoofd()}
function menuTeken(){$("#menuL").innerHTML=`<button type="button" id="wgWissel">Wisselgeld-hulp <b>${WG?"aan":"uit"}</b></button><button type="button" id="herlaad">Kassa vernieuwen</button><button type="button" id="naarApp">Naar het dashboard</button><button type="button" id="afmeld">Afmelden</button>`}
function hoofd(){if(!ST)return;$("#menu").hidden=false;const t=ST.totalen||{};$("#hTot").textContent=`${t.verkopen||0} verkopen · ${eur((t.bancontact||0)+(t.cash||0))}`}
const tabs=()=>ST&&ST.scan?`<div class="ks-tabs"><button type="button" data-tab="verkoop" class="${TAB==="verkoop"?"on":""}">Verkopen</button><button type="button" data-tab="scan" class="${TAB==="scan"?"on":""}">Scannen</button></div>`:"";
function toon(){if(!ST)return;if(!ST.scan)TAB="verkoop";if(TAB==="scan")scanner();else{stop();verkoopScherm()}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(!t)return;TAB=t.dataset.tab;toon()});
// stand en tegels af en toe verversen (op de achtergrond, zonder te storen)
setInterval(async()=>{if(!TOK||VK||document.hidden)return;try{const oud=JSON.stringify(ST&&ST.tegels);await laad();if(TAB==="verkoop"&&JSON.stringify(ST.tegels)!==oud&&!Object.keys(MAND).length)verkoopScherm()}catch(e){fout(e)}},45000);
/* ---------- verkopen ---------- */
const kleur=k=>(window.KASSA_KLEUREN||{})[k]||["#55585e","#f0f1f2"];

/* lang drukken (1 seconde) op een tegel: aantal ingeven met een cijferklavier */
let lpT=0,lpX=0,lpY=0,lpEl=null,lpNa=0;
function lpStop(){clearTimeout(lpT);lpT=0;if(lpEl)lpEl.classList.remove("lp");lpEl=null}
document.addEventListener("pointerdown",e=>{const t=e.target.closest("[data-pt]");if(!t||e.target.closest("[data-min]"))return;lpStop();lpEl=t;lpX=e.clientX;lpY=e.clientY;t.classList.add("lp");
  lpT=setTimeout(()=>{const id=t.dataset.pt;lpStop();lpNa=Date.now();tril(30);aantalScherm(id)},1000)});
document.addEventListener("pointermove",e=>{if(lpT&&(Math.abs(e.clientX-lpX)>12||Math.abs(e.clientY-lpY)>12))lpStop()});
for(const ev of ["pointerup","pointercancel","scroll"])document.addEventListener(ev,()=>{if(lpT)lpStop()},true);
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-pt]"))e.preventDefault()});
// de klik die na het loslaten volgt mag geen extra stuk toevoegen
document.addEventListener("click",e=>{if(lpNa&&Date.now()-lpNa<800&&e.target.closest("[data-pt]")){e.stopImmediatePropagation();e.preventDefault()}},true);
function aantalScherm(id){const x=(ST.tegels||[]).find(t=>t.id===id);if(!x)return;let v=String(MAND[id]||"");
  const bg=document.createElement("div");bg.className="np-bg";
  bg.innerHTML=`<div class="np" role="dialog" aria-label="Aantal ingeven"><h3>${esc(x.naam)}</h3><div class="np-p">${eur(x.prijs)} per stuk</div><div class="np-v" id="npV"></div>
    <div class="np-k">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-np="${n}">${n}</button>`).join("")}<button type="button" data-np="c" aria-label="Wissen">C</button><button type="button" data-np="0">0</button><button type="button" data-np="b" aria-label="Laatste cijfer wissen">⌫</button></div>
    <div class="np-a"><button type="button" class="btn sec2" data-np="x">Annuleren</button><button type="button" class="btn" data-np="ok">OK</button></div></div>`;
  const teken=()=>{const n=Number(v)||0;bg.querySelector("#npV").innerHTML=v?`${n}× <small style="font-size:18px;color:var(--muted)">= ${eur(n*x.prijs)}</small>`:'<span style="color:var(--muted)">0</span>'};
  const sluit=()=>{bg.remove();document.removeEventListener("keydown",kd,true)};
  const ok=()=>{const n=Math.min(999,Number(v)||0);if(n)MAND[id]=n;else delete MAND[id];sluit();tril(12);verkoopScherm()};
  const druk=k=>{if(k==="x")sluit();else if(k==="ok")ok();else if(k==="c")v="";else if(k==="b")v=v.slice(0,-1);else if(v.length<3)v=(v==="0"?"":v)+k;if(document.body.contains(bg))teken()};
  const kd=e=>{if(/^[0-9]$/.test(e.key))druk(e.key);else if(e.key==="Backspace")druk("b");else if(e.key==="Enter")druk("ok");else if(e.key==="Escape")druk("x");else return;e.preventDefault();e.stopPropagation()};
  const t0=Date.now();bg.addEventListener("click",e=>{e.stopPropagation();if(Date.now()-t0<400)return;const b=e.target.closest("[data-np]");if(b)druk(b.dataset.np);else if(e.target===bg)sluit()});
  document.addEventListener("keydown",kd,true);document.body.appendChild(bg);teken()}
function kolommen(n){const w=innerWidth;if(n<=2)return n;if(n<=4)return 2;if(n<=6)return w<640?2:3;if(n<=9)return 3;if(n<=12)return w<640?3:4;return w>=900?5:w>=640?4:3}
function verkoopScherm(){clearTimeout(naT);const T=ST.tegels||[],tot=T.reduce((n,x)=>n+(MAND[x.id]||0)*x.prijs,0),aantal=Object.values(MAND).reduce((a,b)=>a+b,0);
  $("#box").innerHTML=`<div class="vk">${tabs()}${T.length?`<div class="pos2" style="grid-template-columns:repeat(${kolommen(T.length)},minmax(0,1fr))">${T.map(x=>{const [k,b]=kleur(x.kleur),n=MAND[x.id]||0;return `<button type="button" class="pt" data-pt="${esc(x.id)}" style="--k:${k};--b:${b}"><i>${n||""}</i>${n?`<span class="min" data-min="${esc(x.id)}" role="button" aria-label="Eén minder">−</span>`:""}${typeof kassaIcoon==="function"?kassaIcoon(x.icoon,k):""}<b>${esc(x.naam)}</b><span>${eur(x.prijs)}</span></button>`}).join("")}</div>`:'<div class="card"><p style="margin:0">Nog geen tegels ingesteld.</p></div>'}
   <div class="balk"><div class="tot"><b>${eur(tot)}</b>${aantal?`<button type="button" id="leeg">✕ wissen</button>`:""}</div>${aantal&&!(tot>0)?`<button class="btn" id="cash">Registreren (gratis)</button>`:`<button class="btn" id="afr"${tot>0&&ST.online?"":" disabled"}>Bancontact</button><button class="btn sec" id="cash"${tot>0?"":" disabled"}>Cash</button>`}</div></div>`}
function pasHoogte(){const v=$(".vk"),h=$(".ks-hdr");if(h)document.documentElement.style.setProperty("--hh",h.offsetHeight+"px");if(v)v.style.height="";
  // vierkante tegels: rijhoogte = kolombreedte (aspect-ratio werkt niet betrouwbaar in een scrollend grid op iPhone)
  const g=$(".pos2");if(g){const n=(getComputedStyle(g).gridTemplateColumns||"").split(" ").filter(Boolean).length||1,gap=parseFloat(getComputedStyle(g).columnGap)||0;const w=Math.floor((g.clientWidth-gap*(n-1))/n);
    // alles op één scherm: rijen zo hoog als de breedte, maar nooit hoger dan wat in de beschikbare hoogte past
    const rows=Math.ceil(g.children.length/n),rg=parseFloat(getComputedStyle(g).rowGap)||gap,hh=Math.floor((g.clientHeight-8-rg*(rows-1))/rows);
    const h=Math.max(56,Math.min(w,hh>0?hh:w));if(w>0){g.style.gridAutoRows=h+"px";g.style.setProperty("--rh",h+"px")}}}
addEventListener("resize",()=>requestAnimationFrame(pasHoogte));
// iPhone: de werkbalk van Safari verdwijnt of verschijnt zonder gewone resize; de hoogte volgt 100dvh, de tegels passen zich aan
if(window.visualViewport)visualViewport.addEventListener("resize",()=>requestAnimationFrame(pasHoogte));
if(window.ResizeObserver){const ro=new ResizeObserver(()=>requestAnimationFrame(pasHoogte));new MutationObserver(()=>{const v=$(".vk");ro.disconnect();if(v)ro.observe(v)}).observe(document.getElementById("box"),{childList:true})}
new MutationObserver(pasHoogte).observe(document.getElementById("box"),{childList:true});
addEventListener("resize",()=>{if(ST&&TAB==="verkoop"&&!VK&&$(".pos2"))verkoopScherm()});
document.addEventListener("click",e=>{if(e.target.closest("[data-min]")){const k=e.target.closest("[data-min]").dataset.min;MAND[k]=Math.max(0,(MAND[k]||0)-1);if(!MAND[k])delete MAND[k];tril(8);verkoopScherm();return}const t=e.target.closest("[data-pt]");if(t){MAND[t.dataset.pt]=(MAND[t.dataset.pt]||0)+1;tril(12);verkoopScherm();const n=$(`[data-pt="${CSS.escape(t.dataset.pt)}"]`);if(n){n.classList.add("flash")}return}
  const m=e.target.closest("[data-min]");if(m){const k=m.dataset.min;MAND[k]=Math.max(0,(MAND[k]||0)-1);if(!MAND[k])delete MAND[k];verkoopScherm();return}
  const id=(e.target.closest("button[id]")||{}).id||"";
  if(id==="menu"){const m=$("#menuL");if(m.hidden){menuTeken();m.hidden=false}else m.hidden=true;return}
  if(!e.target.closest("#menuL")&&!$("#menuL").hidden)$("#menuL").hidden=true;
  if(id==="wgWissel"){zetWG(!WG);menuTeken();return}
  if(id==="herlaad"){$("#menuL").hidden=true;laad().then(toon).catch(fout);return}
  // terug naar de beheer-app (die draait op het eigen adres, ook als de kassa via vbha.be geopend werd)
  if(id==="naarApp"){$("#menuL").hidden=true;location.href=/(^|\.)vbha\.be$/i.test(location.hostname)?"https://vbha-beheer.vercel.app/#dashboard":"/#dashboard";return}
  if(id==="afmeld"){$("#menuL").hidden=true;login();return}
  if(id==="wgUit"){zetWG(false);cashBevestig();return}
  if(id==="leeg"){MAND={};verkoopScherm()}else if(id==="afr")bancontact();else if(id==="cash"){if(!mandTot())gratisVerkoop();else cashScherm()}
  else if(id==="vkStop"){if(VK)post({actie:"stop",id:VK.id}).catch(()=>{});VK=null;clearTimeout(vkT);verkoopScherm()}
  else if(id==="vkNieuw")nieuweQr();else if(id==="vkVolgende"||id==="okVolgende")volgende();else if(id==="cashTerug")verkoopScherm();
  else if(id==="cashOk")cashBevestig();else if(e.target.closest("[data-wg]")){const v=e.target.closest("[data-wg]").dataset.wg;cashOntv=v==="gepast"?mandTot():Number(v);cashTeken()}});
const mandTot=()=>Math.round((ST.tegels||[]).reduce((n,x)=>n+(MAND[x.id]||0)*x.prijs,0)*100)/100;
function wat(){return (ST.tegels||[]).filter(x=>MAND[x.id]).map(x=>`${MAND[x.id]}× ${esc(x.naam)}`).join("<br>")}
// Bancontact: QR meteen lokaal tekenen uit de betaallink (geen wachten op een afbeelding)
function qrCanvas(txt){if(!window.qrcode)return null;const q=qrcode(0,"M");q.addData(txt);q.make();const n=q.getModuleCount(),px=8,r=2,cv=document.createElement("canvas");cv.width=cv.height=(n+r*2)*px;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.fillStyle="#000";for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))g.fillRect((x+r)*px,(y+r)*px,px,px);return cv}
async function gratisVerkoop(){try{const j=await post({actie:"verkoop",items:MAND,betaalwijze:"cash",bedrag:0});VK=j;gelukt(true)}catch(e){if(fout(e))return;if(e.status===409){await laad();MAND={};verkoopScherm()}alert(e.message)}}
async function bancontact(){if(!mandTot())return gratisVerkoop();const b=$("#afr");b.disabled=true;b.textContent="QR maken…";
  try{const j=await post({actie:"verkoop",items:MAND,betaalwijze:"bancontact",bedrag:mandTot()});VK=j;toonQr();volgVk(1200)}
  catch(e){if(fout(e))return;if(e.status===409){await laad();MAND={};verkoopScherm()}alert(e.message);const x=$("#afr");if(x){x.disabled=false;x.textContent="Bancontact"}}}
function toonQr(){$("#box").innerHTML=tabs()+`<div class="card bq"><div class="bedrag">${eur(VK.bedrag)}</div><div id="qrPlek"></div><p class="wacht" id="vkSt" style="margin-top:10px">Wachten…</p>
  <div class="ks-acts" style="grid-template-columns:1fr 1fr"><button class="btn sec" id="vkNieuw">↻ Nieuwe QR</button><button class="btn sec" id="vkStop">✕ Annuleren</button></div></div>`;
  const p=$("#qrPlek"),cv=VK.deeplink&&qrCanvas(VK.deeplink);if(cv)p.append(cv);else if(VK.qrcode)p.innerHTML=`<img src="${esc(VK.qrcode)}" alt="Bancontact-QR-code">`;else p.innerHTML='<p class="err">Geen QR-code ontvangen. Tik op Nieuwe QR.</p>'}
async function nieuweQr(){const b=$("#vkNieuw");if(b)b.disabled=true;try{const j=await post({actie:"nieuweqr",id:VK.id});VK={...VK,...j};toonQr();volgVk(1200)}catch(e){if(!fout(e))alert(e.message);if(b)b.disabled=false}}
function volgVk(ms){clearTimeout(vkT);vkT=setTimeout(async()=>{if(!VK)return;const id=VK.id;
  try{const j=await post({actie:"status",id});if(!VK||VK.id!==id)return;
    if(j.status==="SUCCEEDED"){gelukt(false);return}
    const st=$("#vkSt"),eind=["EXPIRED","CANCELLED","FAILED","AUTHORIZATION_FAILED"].includes(j.status);
    if(st){if(eind)st.textContent=j.status==="EXPIRED"?"QR-code verlopen. Tik op Nieuwe QR.":"Betaling niet gelukt. Tik op Nieuwe QR.";else if(j.status==="IDENTIFIED"||j.status==="AUTHORIZED")st.textContent="Klant bevestigt in de app…"}
    if(eind)return}catch(e){if(fout(e))return}
  volgVk(1500)},ms)}
// cash met wisselgeld
let cashOntv=0;
// wisselgeld-hulp: aan of uit (per toestel onthouden). Uit = één tik op Cash boekt meteen.
let WG=true;try{WG=localStorage.getItem("vbha_kassa_wg")!=="0"}catch(x){}
function zetWG(v){WG=v;try{localStorage.setItem("vbha_kassa_wg",v?"1":"0")}catch(x){}}
function cashScherm(){cashOntv=0;if(!WG){cashBevestig();return}cashTeken()}
function cashTeken(){const t=mandTot(),terug=cashOntv?Math.round((cashOntv-t)*100)/100:null;
  $("#box").innerHTML=tabs()+`<div class="card bq"><div class="bedrag">${eur(t)}</div>
   <div class="wg" style="grid-template-columns:repeat(${(n=>n===4||n<=2?Math.max(1,Math.min(2,n)):3)(["gepast",5,10,20,50,100].filter(v=>v!=="gepast"&&v>=t).length)},1fr)">${["gepast",5,10,20,50,100].filter(v=>v==="gepast"||v>=t).map(v=>`<button type="button" data-wg="${v}" class="${(v==="gepast"?t:v)===cashOntv?"on":""}">${v==="gepast"?"Gepast":"€"+v}</button>`).join("")}</div>
   ${terug!=null?(terug>=0?`<div class="terug">Wisselgeld ${eur(terug)}</div>`:`<div class="terug" style="color:var(--accent)">Nog ${eur(-terug)} tekort</div>`):''}
   <div class="ks-acts" style="grid-template-columns:2fr 1fr"><button class="btn" id="cashOk"${terug!=null&&terug<0?" disabled":""}>✓ Ontvangen</button><button class="btn sec" id="cashTerug">Terug</button></div>
   <p style="margin:12px 0 0"><button type="button" class="linkb" id="wgUit">Dit scherm voortaan overslaan</button></p></div>`}
async function cashBevestig(){const b=$("#cashOk")||$("#cash");if(b)b.disabled=true;
  try{const j=await post({actie:"verkoop",items:MAND,betaalwijze:"cash",bedrag:mandTot(),ontvangen:cashOntv||null});VK=j;gelukt(true)}
  catch(e){if(fout(e))return;if(e.status===409){await laad();MAND={};verkoopScherm()}alert(e.message);if(b)b.disabled=false}}
function gelukt(cash){clearTimeout(vkT);tril([70,40,70]);const bedrag=VK?VK.bedrag:mandTot(),w=wat();
  $("#box").innerHTML=tabs()+`<div class="card bq ok"><div class="vink">✓</div><div class="bedrag">${eur(bedrag)}</div><p style="margin:0;font-size:19px;color:var(--ink)"><b>${w}</b></p>
   <button class="btn" id="okVolgende" style="margin-top:18px">Volgende klant <span id="auto" style="opacity:.7;font-weight:500">5</span></button></div>`;
  if(ST&&ST.totalen){ST.totalen.verkopen++;if(cash)ST.totalen.cash+=bedrag;else ST.totalen.bancontact+=bedrag;hoofd()}
  let n=5;const tik=()=>{n--;const a=$("#auto");if(!a)return;if(n<=0){volgende();return}a.textContent=String(n);naT=setTimeout(tik,1000)};naT=setTimeout(tik,1000)}
function volgende(){clearTimeout(naT);MAND={};VK=null;verkoopScherm()}
/* ---------- scannen ---------- */
let S=null;
function stop(){if(!S)return;S.stop=true;cancelAnimationFrame(S.raf);if(S.stream)S.stream.getTracks().forEach(x=>x.stop());S=null}
function laadJsQR(){if(window.jsQR)return Promise.resolve();return new Promise((ok,nok)=>{const s=document.createElement("script");s.src=JSQR.src;s.integrity=JSQR.sri;s.crossOrigin="anonymous";s.onload=ok;s.onerror=()=>nok(new Error("De QR-lezer kon niet geladen worden."));document.head.append(s)})}
async function scanner(){const f=ST.fuif||{};
  $("#box").innerHTML=tabs()+`<div class="ks-cam"><video id="v" playsinline muted></video><div class="ks-kader"></div><div class="ks-res" id="res" hidden></div></div>
   <div class="ks-bar"><span id="stand">${f.binnen!=null?`${f.binnen} binnen (${f.gescand} van ${f.tickets} online gescand + ${f.kassaInkom} kassa)`:""}</span><button type="button" class="linkb" id="uit">Afmelden</button></div>
   <form class="ks-man" id="man" novalidate><input id="code" placeholder="Of typ de code" autocomplete="off" autocapitalize="characters"><button class="btn" type="submit">Controleren</button></form><p class="hint" id="stat" style="text-align:center"></p>`;
  $("#uit").onclick=()=>login();$("#man").onsubmit=e=>{e.preventDefault();const v=$("#code").value.trim();if(v){check(v);$("#code").value=""}};
  if(S)return;S={bezig:false,stop:false,laatst:"",t:0};
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});if(!S||S.stop){st.getTracks().forEach(x=>x.stop());return}
    S.stream=st;const v=$("#v");v.srcObject=st;await v.play();
    let det=null;if("BarcodeDetector" in window){try{const fm=await BarcodeDetector.getSupportedFormats();if(fm.includes("qr_code"))det=new BarcodeDetector({formats:["qr_code"]})}catch(x){}}
    if(!det)await laadJsQR();const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const loop=async()=>{if(!S||S.stop)return;const vv=$("#v");
      if(vv&&!S.bezig&&vv.readyState>=2){let txt="";
        try{if(det){const r=await det.detect(vv);txt=r[0]&&r[0].rawValue||""}else{const w=Math.min(720,vv.videoWidth),h=Math.round(vv.videoHeight*w/vv.videoWidth);cv.width=w;cv.height=h;cx.drawImage(vv,0,0,w,h);const r=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});txt=r&&r.data||""}}catch(x){}
        if(txt&&!(txt===S.laatst&&Date.now()-S.t<4000)){S.laatst=txt;S.t=Date.now();check(txt)}}
      S.raf=requestAnimationFrame(loop)};loop();
  }catch(e){const s=$("#stat");if(s)s.textContent=e&&e.name==="NotAllowedError"?"Geen toegang tot de camera. Sta de camera toe, of typ de code hierboven.":"De camera kon niet starten. Typ de code hierboven."}}
async function check(txt){if(S)S.bezig=true;const r=$("#res");
  try{const j=await post({actie:"scan",code:txt});const tijd=s=>new Date(s).toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});
    r.className="ks-res "+(j.ok?(j.soort==="drank"?"dk":"ok"):j.al?"al":"nok");
    r.innerHTML=j.ok?(j.soort==="drank"?`<b>🍺 Drankkaart €${esc(j.waarde)} geven</b><span>${esc(j.naam)}</span><small>Drankkaart ${j.nr} van ${j.van}</small>`:`<b>✓ Geldig</b><span>${esc(j.naam)}</span><small>Ticket ${j.nr} van ${j.van}</small>`)
      :`<b>${j.al?"⚠ Al gescand":"✕ Niet geldig"}</b><span>${esc(j.naam||"")}</span><small>${esc(j.reden||"")}${j.al&&j.op?" Om "+tijd(j.op)+".":""}</small>`;
    r.hidden=false;tril(j.ok?80:[60,60,60]);if(j.ok&&j.soort!=="drank"&&ST.fuif){ST.fuif.gescand++;ST.fuif.binnen++;const s=$("#stand");if(s)s.textContent=`${ST.fuif.binnen} binnen (${ST.fuif.gescand} van ${ST.fuif.tickets} online gescand + ${ST.fuif.kassaInkom} kassa)`}}
  catch(e){if(fout(e))return;r.className="ks-res nok";r.innerHTML=`<b>Fout</b><small>${esc(e.message)}</small>`;r.hidden=false}
  setTimeout(()=>{if(S)S.bezig=false;const x=$("#res");if(x)x.hidden=true},2000)}
/* ---------- start ---------- */
(async()=>{const P=new URLSearchParams(location.search),c=P.get("code");if(c)history.replaceState(null,"",location.pathname);
  if(c&&(!TOK)){login();$("#kc").value=c;$("#fl").requestSubmit();return}
  if(!TOK){login();return}
  $("#box").innerHTML='<div class="card"><p style="margin:0;color:var(--muted)">Kassa laden…</p></div>';
  try{await laad();toon()}catch(e){if(!fout(e))$("#box").innerHTML=`<div class="card"><p style="margin:0">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Opnieuw</button></div>`}})();
</script>
