name: screenshots
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          cat > s.mjs <<'X'
          import { chromium, devices } from 'playwright';
          const b = await chromium.launch();
          const go = async (naam, url, opt, full) => { const p = await b.newPage(opt); await p.goto(url, { waitUntil: 'networkidle' }); await p.waitForTimeout(1500); await p.screenshot({ path: naam, fullPage: !!full }); await p.close(); };
          const D = { viewport: { width: 1440, height: 900 }, deviceScaleFactor: 2 };
          await go('home.png', 'https://vbha.be/', D);
          await go('home-full.png', 'https://vbha.be/', D, true);
          await go('shop.png', 'https://vbha.be/shop', D);
          await go('shop-full.png', 'https://vbha.be/shop', D, true);
          await go('gsm-home.png', 'https://vbha.be/', devices['iPhone 13']);
          await go('gsm-shop.png', 'https://vbha.be/shop', devices['iPhone 13']);
          await b.close();
          X
          node s.mjs
      - run: |
          mkdir out && mv *.png out/ && cd out && git init -q -b shots && git add . && git -c user.name=bot -c user.email=bot@vbha.be commit -qm shots
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots
