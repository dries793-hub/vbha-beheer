<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VBHA Beheer</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: in de lijn van SPARK — donkerblauwe kopbalk met logo, witte menubalk met iconen, gecentreerd werkvlak met witte kaarten. VBHA-rood blijft de actiekleur. */
:root{
  --bg:#F5F5F6; --surface:#FFFFFF; --sunken:#F1F1F2; --ink:#1A1B1E; --muted:#686B71; --line:#E5E6E8; --line-strong:#CCCED2;
  --navy:#18191C; --navy-2:#26282C; --navy-ink:#FFFFFF; --navy-muted:#A4A7AD;
  --plate:#18191C; --plate-ink:#FFFFFF;
  --accent:#C0161F; --accent-deep:#8F0F16; --accent-soft:#FCEBEC; --accent-ink:#FFFFFF; --signal:#F5B800;
  --info:#2F6FE4; --info-soft:#E4EDFD;
  --good:#18794A; --good-soft:#E3F4EA; --warn:#8A5A00; --warn-soft:#FDF3D7; --bad:#C0161F; --bad-soft:#FCEBEC;
  --brons:#9A5B26; --zilver:#6F7983; --goud:#A98207;
  --shadow:0 1px 2px rgba(17,18,20,.05),0 1px 3px rgba(17,18,20,.04);
  --shadow-lg:0 12px 32px rgba(17,18,20,.18);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#1A1B1E; --sunken:#202226; --ink:#ECEDEF; --muted:#9B9EA5; --line:#2A2C30; --line-strong:#3C3F45;
  --navy:#0A0A0B; --navy-2:#1C1D20; --navy-ink:#FFFFFF; --navy-muted:#9A9DA3; --plate:#2A2C30; --plate-ink:#FFFFFF;
  --accent:#F0454E; --accent-deep:#B5141C; --accent-soft:#3A1A1E; --accent-ink:#FFFFFF; --signal:#F5B800;
  --info:#7DA7F5; --info-soft:#1B2A47;
  --good:#4CC38A; --good-soft:#13301F; --warn:#F0C04F; --warn-soft:#33290F; --bad:#FF6B70; --bad-soft:#3A1A1E;
  --brons:#D08A4F; --zilver:#AEB6BF; --goud:#E8C33E; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1A1B1E; --sunken:#202226; --ink:#ECEDEF; --muted:#9B9EA5; --line:#2A2C30; --line-strong:#3C3F45;
  --navy:#0A0A0B; --navy-2:#1C1D20; --navy-ink:#FFFFFF; --navy-muted:#9A9DA3; --plate:#2A2C30; --plate-ink:#FFFFFF;
  --accent:#F0454E; --accent-deep:#B5141C; --accent-soft:#3A1A1E; --accent-ink:#FFFFFF; --signal:#F5B800;
  --info:#7DA7F5; --info-soft:#1B2A47;
  --good:#4CC38A; --good-soft:#13301F; --warn:#F0C04F; --warn-soft:#33290F; --bad:#FF6B70; --bad-soft:#3A1A1E;
  --brons:#D08A4F; --zilver:#AEB6BF; --goud:#E8C33E; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.app{min-height:100%;display:flex;flex-direction:column}
.inner{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* kopbalk */
.hdr{background:var(--navy);color:var(--navy-ink);border-bottom:1px solid var(--navy-2);position:sticky;top:env(safe-area-inset-top,0px);z-index:21}
.hdr .inner{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand .logo{height:28px;width:auto;display:block}
.logo-l{display:none!important}
.brand-lbl{font-weight:500;font-size:15px;color:var(--navy-ink);padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}
.who{font-size:13px;color:var(--navy-muted)}
.hdr-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--navy-muted);flex:none}
.hdr-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hdr-btn:hover{background:var(--navy-2);color:var(--navy-ink)}
.hdr-btn.on{background:var(--navy-2);color:var(--navy-ink)}
.who:empty{display:none}
.who.ro{background:var(--signal);color:#1A1400;padding:3px 10px;border-radius:999px;font-weight:600}
/* menubalk */
.navbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 67px);z-index:20;box-shadow:0 1px 3px rgba(17,18,20,.06)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:8px;padding:15px 12px 13px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14.5px;white-space:nowrap;border-bottom:2px solid transparent}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.nav a:hover{color:var(--accent)}
.nav a:hover svg{color:var(--accent)}
.nav a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nav a.on svg{color:var(--accent)}
.nav .navdd{display:flex;align-items:center;gap:8px;padding:15px 12px 13px;color:var(--ink);background:none;border:0;border-bottom:2px solid transparent;font-weight:500;font-size:14.5px;white-space:nowrap;cursor:pointer}
.nav .navdd svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.nav .navdd .chev{width:14px;height:14px;margin-left:-2px}
.nav .navdd:hover,.nav .navdd[aria-expanded="true"]{color:var(--accent)}
.nav .navdd:hover svg,.nav .navdd[aria-expanded="true"] svg{color:var(--accent)}
.nav .navdd.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nav .navdd.on svg{color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;padding:0 7px;line-height:18px}
.sumbar{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.sumbar b{color:var(--ink)} .sumbar b.in{color:var(--good)} .sumbar b.out{color:var(--bad)}
.sumbar.boxed{border:1px solid var(--line);border-radius:var(--r);background:var(--sunken)}
.bulkbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;margin-bottom:12px;background:var(--plate);color:var(--plate-ink);border-radius:var(--r);position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px);z-index:5;box-shadow:var(--shadow-lg)}
.bulkbar .sel{background:var(--surface);color:var(--ink);padding:5px 8px}
.bulkbar .btn{background:transparent;color:var(--plate-ink);border-color:rgba(255,255,255,.3)}
.bulkbar .btn:hover{background:rgba(255,255,255,.1)}
.bulkbar .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.bulkbar .btn.danger{color:#FFB3B6}
.pager{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.journal .desc{max-width:440px;min-width:220px}
.desc .d1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc .d2{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.chk,td.chk{width:38px;padding-right:0}
td.chk input,th.chk input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);margin:0}
tr.selrow td{background:var(--accent-soft)!important}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover,th.sorted{color:var(--ink)}
.arr{font-size:9px;margin-left:4px}
.acct{font-size:13px;color:var(--muted)}
.acct.kas{color:var(--warn);font-weight:500}
.amt{font-weight:600;white-space:nowrap}
.cat{font-weight:500}
.nowrap{white-space:nowrap}
.small{font-size:12.5px}
.muted{color:var(--muted)}
td .small svg,.small svg{width:14px;height:14px;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:12px}
.checks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.legend{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-left:8px}
.track2{height:8px;background:var(--sunken);border-radius:4px;display:flex;gap:2px;overflow:hidden}
.track2 span{display:block;height:100%;border-radius:2px}
.sel.sm{padding:5px 8px;font-size:13.5px}
tr.dim td{opacity:.5}
.li.click{cursor:pointer;border-radius:6px}
.li.click:hover{background:var(--sunken)}
.mbar:hover rect:first-of-type{fill:var(--sunken)}
.mapping summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.navmenu{position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:220px;display:flex;flex-direction:column;gap:2px}
.navmenu a{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
.navmenu a:hover,.navmenu a:focus-visible{background:var(--sunken);color:var(--accent)}
.navmenu a.on{color:var(--accent);font-weight:600}
.navmenu svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.navmenu a:hover svg,.navmenu a.on svg{color:var(--accent)}
/* werkvlak */
.main{flex:1;min-width:0;padding-block:28px 64px}
.wrap{display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.emblem{height:52px;width:auto;display:block;flex:none}
.emblem-d{display:none}
.top .emblem-d+div{margin-top:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .emblem-l{display:none}:root:not([data-theme="light"]) .emblem-d{display:block}}
:root[data-theme="dark"] .emblem-l{display:none}:root[data-theme="dark"] .emblem-d{display:block}
.top h1{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top .sub{color:var(--muted);margin-top:2px;font-size:14px}
.grow{flex:1}
.yearpick{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:3px 6px 3px 12px}
.yearpick label{font-size:13px;color:var(--muted)}
.yearpick select{border:0;background:transparent;color:var(--ink);font:600 15px var(--f-body);padding:5px 4px;cursor:pointer}
/* knoppen */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:8px 14px;font:500 14px/1.2 var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunken)}
.btn.primary{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.primary:hover{background:var(--accent-soft)}
.modal-f .btn.primary,.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modal-f .btn.primary:hover,.btn.solid:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
/* kaarten */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:58px}
.panel-h h2{font:600 16px/1.3 var(--f-display);margin:0}
.panel-b{padding:20px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1240px){.tiles.six{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;min-width:0;box-shadow:var(--shadow)}
a.tile:hover{border-color:var(--line-strong)}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:500}
.tile .val{font:600 clamp(20px,1.9vw,25px)/1.2 var(--f-display);white-space:nowrap;letter-spacing:-.01em}
.tile .hint{font-size:12.5px;color:var(--muted)}
.tile.hero{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.tile.hero .lbl,.tile.hero .hint{color:var(--navy-muted)}
/* werkbalk */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.sel{padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;cursor:pointer;font-weight:500;font-size:14px;border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:var(--navy-ink)}
/* tabellen */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken);position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunken)}
td.num,th.num{text-align:right;white-space:nowrap}
td.muted{color:var(--muted)}
.nm b{font-weight:600}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong);background:var(--sunken)}
.in{color:var(--good)} .out{color:var(--bad)}
.cellin{width:74px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);text-align:right}
.cellin:focus{border-color:var(--info);outline:none;box-shadow:0 0 0 3px var(--info-soft)}
.cellin.wide{width:100%;min-width:150px;text-align:left}
/* badges */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.nok{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--sunken);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.medal{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;letter-spacing:.03em}
.medal i{width:9px;height:9px;border-radius:50%;display:inline-block}
.medal.BRONS{color:var(--brons)} .medal.BRONS i{background:var(--brons)}
.medal.ZILVER{color:var(--zilver)} .medal.ZILVER i{background:var(--zilver)}
.medal.GOUD{color:var(--goud)} .medal.GOUD i{background:var(--goud)}
.medal.na{color:var(--muted)} .medal.na i{background:transparent;border:1.5px solid var(--muted)}
/* lijsten */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.note.info{background:var(--sunken);color:var(--ink);border:1px solid var(--line)}
.note.info a{color:inherit;font-weight:600}
.catbar{display:grid;grid-template-columns:minmax(0,160px) 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.catbar .track{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden;display:flex}
.catbar .track span{display:block;height:100%}
/* formulieren */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:500;color:var(--ink)}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--info);outline:none;box-shadow:0 0 0 3px var(--info-soft)}
.fld textarea{min-height:220px;resize:vertical;line-height:1.55}
.fld .help{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
/* venster */
.modal-bg{position:fixed;inset:0;background:rgba(12,13,15,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);box-shadow:var(--shadow-lg);border:1px solid var(--line);margin:auto 0;overflow:hidden}
.modal.wide{width:min(1100px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 16px 16px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font:600 18px var(--f-display);flex:1}
.modal-b{padding:22px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--sunken)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:11px 18px;border-radius:var(--r);font-weight:500;z-index:60;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.toast.bad{background:var(--accent);color:#fff}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:7px 18px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--sunken);border-radius:6px;padding:2px 8px;font-size:12.5px;cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace}
.chip:hover{border-color:var(--info);color:var(--info)}
.preview{border:1px solid var(--line);border-radius:var(--r);background:#fff;color:#111;padding:16px;min-height:200px;overflow:auto;max-height:520px}
.mailhead{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.mailhead b{color:var(--ink)}
.loading{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 16px;color:var(--muted);text-align:center}
.loading b{font-weight:600;font-size:17px;color:var(--ink)}
.ro [data-w]{display:none!important}
.rowflag td:first-child{box-shadow:inset 3px 0 0 var(--signal)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--sunken);padding:1px 6px;border-radius:4px}
details summary{font-weight:500}
@media (max-width:900px){ .g2,.g3{grid-template-columns:minmax(0,1fr)} .hdr .inner{height:58px} .navbar{top:calc(env(safe-area-inset-top,0px) + 59px)} .bulkbar{top:calc(env(safe-area-inset-top,0px) + 112px)} .brand .logo{height:24px} .brand-lbl{font-size:13.5px} }
@media (max-width:560px){ .brand-lbl{display:none} }
@media (max-width:640px){ .form{grid-template-columns:minmax(0,1fr)} .tiles,.tiles.six{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .tile{padding:12px 14px} .tile.hero,.tiles.six .tile:last-child{grid-column:1/-1} .tile .val{font-size:21px;white-space:normal} .main{padding-block:20px 56px} .panel-h{padding:14px 16px} .panel-b{padding:16px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

img{max-width:100%}

.auth{min-height:calc(100vh - 220px);display:grid;place-items:center;padding-block:20px}
.auth-card{width:min(420px,100%)}
.auth-card .panel-b{padding:28px}
.auth-card h1{font-size:22px;margin:0;font-weight:600}
.auth-card .emblem{height:56px;width:auto;align-self:flex-start}
</style>
