<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>html{touch-action:manipulation}
.stp{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;width:max-content;background:var(--surface)}
.stp button{width:54px;border:0;background:var(--sunken);color:var(--ink);font-size:24px;cursor:pointer}
.stp button:active{background:var(--line)}
.stp input{width:70px!important;border:0!important;border-inline:1px solid var(--line-strong)!important;border-radius:0!important;text-align:center;font-size:22px!important;font-weight:700;padding:8px 0!important;-moz-appearance:textfield;box-shadow:none!important}
.stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.aantal{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.aantal .som{font-size:15px;color:var(--muted)}.aantal .som b{color:var(--ink);font-size:20px}
.via{position:relative}
.vl{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.14);overflow:hidden}
.vl button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer}
.vl button+button{border-top:1px solid var(--line)}
.vl button:hover,.vl button.on{background:var(--sunken)}
.vk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.vk:empty{display:none}
.vk .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.tks{display:grid;gap:14px;margin-top:20px}
.tk{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;background:#fff;color:#111}
.tk img{width:220px;max-width:70vw;height:auto;display:block;margin:6px auto}
.tk .c{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.08em;font-size:16px}
.tk .n{font-size:12px;letter-spacing:.12em;color:#b30000;font-weight:700}
</style>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=new URLSearchParams(location.search),url=P.get("c")?"/api/fuif?c="+encodeURIComponent(P.get("c")):P.get("b")?`/api/fuif?b=${encodeURIComponent(P.get("b"))}&t=${encodeURIComponent(P.get("t")||"")}`:"";
const tijd=s=>new Date(s).toLocaleString("nl-BE",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
(async()=>{if(!url){$("#box").innerHTML='<div class="card"><p style="margin:0">Deze link is onvolledig.</p></div>';return}
  try{const r=await fetch(url);const j=await r.json();if(!r.ok)throw new Error(j.error||"Ticket niet gevonden.");const e=j.ev||{};
    document.title=(e.naam||"Ticket")+" · VBHA";
    const st=!j.geldig?`<p class="err" style="text-align:center">${j.status==="geannuleerd"?"Dit ticket werd geannuleerd.":"Dit ticket is (nog) niet betaald."}</p>`:"";
    $("#box").innerHTML=`<div class="card" style="text-align:center"><p style="margin:0;font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700">${j.tickets.length>1?j.tickets.length+" TICKETS":"TICKET"}</p>
      <h1 style="margin:4px 0 6px">${esc(e.naam||"")}</h1><p style="margin:0;color:var(--muted)">${esc([e.datumTekst,e.deuren?"deuren "+e.deuren:""].filter(Boolean).join(" · "))}${e.locatie?"<br>"+esc(e.locatie):""}</p>
      ${j.naam?`<p style="margin:12px 0 0">Op naam van <b>${esc(j.naam)}</b></p>`:""}${st}
      <div class="tks">${j.tickets.map(x=>`<div class="tk"${x.gescand?' style="opacity:.55"':""}><div class="n">TICKET ${x.nr} VAN ${x.van}</div><img src="/api/fuif?qr=${esc(x.code)}" alt="QR-code ticket ${x.nr}"><div class="c">${esc(x.code.replace(/(.{4})(?=.)/g,"$1 "))}</div>${x.gescand?`<div style="margin-top:6px;font-size:13px;color:#666">Gescand op ${esc(tijd(x.gescand))}</div>`:""}</div>`).join("")}</div></div>`;
  }catch(x){$("#box").innerHTML=`<div class="card"><p style="margin:0">${esc(x.message)}</p></div>`}})();
</script>
</body>
</html>
