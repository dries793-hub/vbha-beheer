<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reglement puntensysteem · VBHA</title>
<meta name="description" content="Reglement van het puntensysteem van de Vriendenkring Brandweer Hoofdpost Aalst.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F5F6;--surface:#FFFFFF;--sunken:#F1F1F2;--ink:#1A1B1E;--muted:#686B71;--line:#E5E6E8;--line-strong:#CCCED2;--navy:#18191C;--accent:#C0161F;--accent-deep:#8F0F16;--accent-soft:#FCEBEC;--good:#18794A;--good-soft:#E3F4EA;--info:#2F6FE4;--info-soft:#E4EDFD;--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--surface:#1A1B1E;--sunken:#202226;--ink:#ECEDEF;--muted:#9B9EA5;--line:#2A2C30;--line-strong:#3C3F45;--accent-soft:#3A1416;--good-soft:#12301F;--info-soft:#16233D}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
.hdr{background:var(--navy);padding:14px 16px}
.hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;color:#fff}
.hdr .logo{height:30px;width:auto;display:block}
.hdr span{font-size:13.5px;color:#A4A7AD;border-left:1px solid #3a3c40;padding-left:14px}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.title{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.title img{height:48px;width:auto}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
label,.lbl{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line-strong);border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;background:var(--surface)}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input:focus-visible+span{box-shadow:0 0 0 3px var(--info-soft)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pay{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--sunken);font-size:14px}
.pay b{font-variant-numeric:tabular-nums}
.err{color:var(--accent);font-weight:500;min-height:0;margin:14px 0 0}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;width:100%;padding:13px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 16px var(--f);cursor:pointer}
.btn:hover{background:var(--accent-deep)}
.btn:disabled{opacity:.6;cursor:default}
.ok{text-align:center;padding:30px 22px}
.ok .ic{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 14px}
.ok .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok h2{margin:0 0 8px;font-size:22px}
.ok p{margin:0 0 6px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;color:var(--ink)}
.paybox{text-align:left;margin-top:22px;padding:18px;border-radius:12px;background:var(--sunken)}
.paybox h3{margin:0 0 14px;font-size:17px;text-align:center}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr{width:200px;max-width:70vw;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qrwrap p{margin:0;font-size:13.5px;color:var(--muted);text-align:center;max-width:34ch}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.pd{margin:0;display:flex;flex-direction:column;gap:10px}
.pd>div{display:flex;flex-direction:column;gap:3px}
.pd dt{font-size:12.5px;color:var(--muted)}
.pd dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.pd .mono{margin:0}
.cp{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 10px;font:500 12.5px var(--f);cursor:pointer}
.cp:hover{border-color:var(--ink)}
.cp.ok{border-color:var(--good);color:var(--good)}
.btn.bc{margin-top:0;background:#1A1B1E;font-size:16.5px;padding:15px 18px;text-decoration:none}
.btn.bc:hover{background:#000}
.btn.bc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.bc.off{opacity:.45;pointer-events:none}
.hint.c{text-align:center;margin:8px 0 0}
.qrwrap.desk{margin-top:16px}
@media (pointer:coarse){.qrwrap.desk{display:none}}
.qr img{display:block;width:100%;height:auto}
.wacht{margin:10px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.wacht:empty{display:none}
.zelf{margin-top:16px;border-top:1px solid var(--line-strong);padding-top:12px}
.zelf summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style-position:inside}
.zelf[open] summary{margin-bottom:12px}
.paid{text-align:center;padding:6px 0}
.paid h3{margin:0 0 6px}
.paid p{margin:0;color:var(--muted)}
.paid .ic{width:48px;height:48px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 10px}
.paid .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.paybox .hint{margin:12px 0 0;font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr 1fr}h1{font-size:23px}.card{padding:18px}.hdr span{display:none}}
.bevestig{text-align:center;padding:34px 24px}
.bevestig .ic{width:72px;height:72px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px}
.bevestig .ic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bevestig h2{margin:0 0 8px;font-size:24px}
.bevestig .lead2{margin:0 auto;max-width:440px;color:var(--muted);font-size:15.5px}
.bevestig .sam{margin:22px auto 0;max-width:420px;border:1px solid var(--line);border-radius:12px;text-align:left;overflow:hidden}
.bevestig .sam div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14.5px}
.bevestig .sam div+div{border-top:1px solid var(--line)}
.bevestig .sam span{color:var(--muted)}
.bevestig .sam b{text-align:right}
.bevestig .tot{margin:22px 0 0;font-size:18px;font-weight:700}
/* iPhone: datumvelden niet breder dan hun vak, geen schuifbalken */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;box-sizing:border-box;min-height:44px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
html,body{overflow-x:hidden}
@media (max-width:760px){*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}}
.kid>*{min-width:0}

.regl h2{font-size:17px;margin:22px 0 8px}.regl h2:first-child{margin-top:0}.regl ul{margin:0 0 6px;padding-left:20px}.regl li{margin:0 0 6px;line-height:1.5}.regl p{line-height:1.55}
.rtab{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:14.5px}.rtab th,.rtab td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line,#e5e5e5)}.rtab th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#666)}
.medal{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:999px;color:#fff}.medal.BRONS{background:#a5703f}.medal.ZILVER{background:#8d959e}.medal.GOUD{background:#c19a2e}
.regl-end{margin-top:18px;padding:14px 16px;border-radius:12px;background:#f6f6f6;line-height:1.5}
.st-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
@media print{.hdr,.foot,.noprint{display:none!important}.card{box-shadow:none;border:0}}
</style>
</head>

  <p class="lead" id="lead">Hoe je als lid punten verdient en welke korting je daarmee krijgt.</p>
  <div id="box"><div class="card"><p>Laden…</p></div></div>
  <p class="foot noprint">Vragen over je punten? Spreek iemand van het bestuur aan of mail naar <a href="mailto:info@vbha.be">info@vbha.be</a>.</p>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const medal=s=>`<span class="medal ${s}">${s}</span>`;
function toon(c){const w=c.gewichten,dr=c.drempels,k=c.korting;$("#lead").textContent="Werkjaar "+c.jaar+" · "+c.vereniging;
  $("#box").innerHTML=`<div class="card regl">
  <h2>1. Doelstellingen</h2><ul><li>Leden stimuleren om actief deel te nemen.</li><li>Extra inzet belonen met tastbare voordelen.</li></ul>
  <h2>2. Basisprincipes</h2><ul><li>Elk lid betaalt het standaard lidgeld.</li><li>Leden verdienen punten voor hun inzet.</li><li>De punten die je verzamelt in werkjaar (X) gelden voor het daaropvolgende inzetjaar (X+1).</li><li>Maximale korting per activiteit: ${k.goud}% van de kostprijs.</li><li>Geldigheid: 1 jaar. Punten worden jaarlijks op 1 januari op 0 gezet (geen overdracht).</li><li>Erewachters betalen wel hun lidgeld, maar genieten steeds de maximale korting van ${k.goud}% en nemen niet deel aan het puntensysteem.</li></ul>
  <h2>3. Toekenning van punten</h2><p>Elke taak of activiteit krijgt een specifieke puntenwaarde. Het bestuur noteert de punten van de deelnemers na elke activiteit. Het blijft de verantwoordelijkheid van elk lid om zijn of haar puntensaldo te controleren.</p>
  <table class="rtab"><thead><tr><th>Activiteit</th><th>Punten</th></tr></thead><tbody><tr><td>Verkoop kaarten fuif (per stuk)</td><td>${w.kaarten}</td></tr><tr><td>Bussen kalenders (per doos)</td><td>${w.kalenders}</td></tr><tr><td>Hulp bij activiteit (shift/opbouw/afbraak)</td><td>${w.shifts}</td></tr><tr><td>Extra inspanning (ontwerp kalender, aanbrengen sponsor, …)</td><td>50</td></tr><tr><td>Aanwezigheid op vergaderingen (bestuur)</td><td>${w.vergaderingen}</td></tr></tbody></table>
  <h2>4. Omzetting van punten in korting</h2><p>De verzamelde punten worden omgezet in een korting op de kostprijs van betalende activiteiten (bv. banket).</p>
  <table class="rtab"><thead><tr><th>Punten per jaar</th><th>Voordeel</th><th>Type lid</th></tr></thead><tbody><tr><td>0–${dr.zilver-1}</td><td>${k.brons}% korting</td><td>${medal("BRONS")}</td></tr><tr><td>${dr.zilver}–${dr.goud-1}</td><td>${k.zilver}% korting</td><td>${medal("ZILVER")}</td></tr><tr><td>${dr.goud} of meer</td><td>${k.goud}% korting</td><td>${medal("GOUD")}</td></tr></tbody></table>
  <h2>5. Regels rond gebruik</h2><ul><li>Punten zijn strikt persoonsgebonden en kunnen onder geen enkele voorwaarde verkocht, overgedragen of gedeeld worden met andere leden. Ze dienen uitsluitend ter beloning van de individuele inzet van het lid.</li><li>Punten die tijdens een werkjaar worden verzameld, zijn geldig voor het daaropvolgende inzetjaar. Ze kunnen enkel tijdens dat inzetjaar ingezet worden en vervallen bij de jaarlijkse reset. Punten doorschuiven naar een volgend werkjaar kan niet. Zo start elk lid elk jaar opnieuw met gelijke kansen.</li><li>Inzet wordt gewaardeerd op basis van vastgelegde categorieën. Het bestuur kan bij bijzondere inspanningen bijkomende punten toekennen.</li><li>Enkel leden die hun jaarlijkse lidgeld betaald hebben, kunnen punten verzamelen en inruilen. Is het lidgeld niet betaald, dan vervallen alle rechten op deelname aan het puntensysteem.</li><li>Punten geven recht op een korting van maximum ${k.goud}% van de kostprijs van een betalende activiteit. Volledig gratis deelnemen aan een activiteit is dus niet mogelijk.</li><li>Meent een lid te weinig punten ontvangen te hebben, dan kan dit binnen een redelijke termijn gemeld worden bij het bestuur. Het bestuur bekijkt de melding en neemt een definitieve, bindende beslissing.</li><li>Er is geen maximumaantal punten dat een lid kan verzamelen. Enkel de korting per activiteit is begrensd.</li><li>Enkel leden van de vriendenkring komen in aanmerking om punten te verzamelen. Brengt een lid een extern persoon (bv. partner) mee om te helpen, dan krijgt dat lid hiervoor extra punten.</li><li>Het bestuur kan tijdens het jaar extra afspraken maken voor activiteiten die spontaan tot stand komen en niet in dit reglement vermeld staan.</li></ul>
  <div class="regl-end"><b>Afsluitende opmerking</b><br>Het systeem is bedoeld om inzet zichtbaar en belonend te maken, niet om leden uit te melken of te rangschikken.</div>
  <p class="noprint" style="margin:16px 0 0;text-align:center"><button class="btn" type="button" onclick="print()" style="width:auto;display:inline-flex">Afdrukken of bewaren als PDF</button></p></div>`}
fetch("/api/reglement").then(r=>r.ok?r.json():Promise.reject()).then(toon).catch(()=>{$("#box").innerHTML='<div class="card"><p>Het reglement kon niet geladen worden. Probeer het later opnieuw.</p></div>'});
</script>
