name: Adressenregister ophalen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/adressen.mjs
      - run: |
          git config user.name "adressen-bot"; git config user.email "adressen-bot@users.noreply.github.com"
          git checkout --orphan tmp-adressen
          git rm -rfq --cached . ; git add uit/
          git commit -qm "Adressenregister Aalst (tijdelijk)"
          git push -f origin tmp-adressen
