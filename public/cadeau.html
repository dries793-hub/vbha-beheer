<style>
:root{--bg:#F5F5F6;--surface:#FFFFFF;--sunken:#F1F1F2;--ink:#1A1B1E;--muted:#686B71;--line:#E5E6E8;--line-strong:#CCCED2;--navy:#18191C;--accent:#C0161F;--accent-deep:#8F0F16;--accent-soft:#FCEBEC;--good:#18794A;--good-soft:#E3F4EA;--info:#2F6FE4;--info-soft:#E4EDFD;--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--surface:#1A1B1E;--sunken:#202226;--ink:#ECEDEF;--muted:#9B9EA5;--line:#2A2C30;--line-strong:#3C3F45;--accent-soft:#3A1416;--good-soft:#12301F;--info-soft:#16233D}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
.hdr{background:var(--navy);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;color:#fff}
.hdr .logo{height:30px;width:auto;display:block}
.hdr span{font-size:13.5px;color:#A4A7AD;border-left:1px solid #3a3c40;padding-left:14px}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.title{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.title img{height:48px;width:auto}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
label,.lbl{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line-strong);border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;background:var(--surface)}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input:focus-visible+span{box-shadow:0 0 0 3px var(--info-soft)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pay{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--sunken);font-size:14px}
.pay b{font-variant-numeric:tabular-nums}
.err{color:var(--accent);font-weight:500;min-height:0;margin:14px 0 0}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;width:100%;padding:13px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 16px var(--f);cursor:pointer}
.btn:hover{background:var(--accent-deep)}
.btn:disabled{opacity:.6;cursor:default}
.ok{text-align:center;padding:30px 22px}
.ok .ic{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 14px}
.ok .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok h2{margin:0 0 8px;font-size:22px}
.ok p{margin:0 0 6px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;color:var(--ink)}
.paybox{text-align:left;margin-top:22px;padding:18px;border-radius:12px;background:var(--sunken)}
.paybox h3{margin:0 0 14px;font-size:17px;text-align:center}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr{width:200px;max-width:70vw;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qrwrap p{margin:0;font-size:13.5px;color:var(--muted);text-align:center;max-width:34ch}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.pd{margin:0;display:flex;flex-direction:column;gap:10px}
.pd>div{display:flex;flex-direction:column;gap:3px}
.pd dt{font-size:12.5px;color:var(--muted)}
.pd dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.pd .mono{margin:0}
.cp{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 10px;font:500 12.5px var(--f);cursor:pointer}
.cp:hover{border-color:var(--ink)}
.cp.ok{border-color:var(--good);color:var(--good)}
.btn.bc{margin-top:0;background:#1A1B1E;font-size:16.5px;padding:15px 18px;text-decoration:none}
.btn.bc:hover{background:#000}
.btn.bc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.bc.off{opacity:.45;pointer-events:none}
.hint.c{text-align:center;margin:8px 0 0}
.qrwrap.desk{margin-top:16px}
@media (pointer:coarse){.qrwrap.desk{display:none}}
.qr img{display:block;width:100%;height:auto}
.wacht{margin:10px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.wacht:empty{display:none}
.zelf{margin-top:16px;border-top:1px solid var(--line-strong);padding-top:12px}
.zelf summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style-position:inside}
.zelf[open] summary{margin-bottom:12px}
.paid{text-align:center;padding:6px 0}
.paid h3{margin:0 0 6px}
.paid p{margin:0;color:var(--muted)}
.paid .ic{width:48px;height:48px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 10px}
.paid .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.paybox .hint{margin:12px 0 0;font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr 1fr}h1{font-size:23px}.card{padding:18px}.hdr span{display:none}}
.hero h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 22px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.fact span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.fact b{display:block;font-weight:600;font-size:15px;margin-top:2px}
.fact small{display:block;color:var(--muted);font-size:13px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch label{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px 12px 40px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--surface)}
.ch input{position:absolute;left:14px;top:15px;width:18px;height:18px;margin:0;accent-color:var(--accent)}
.ch b{font-weight:600}.ch span{font-size:13px;color:var(--muted)}
.ch .pr{font-size:17px;font-weight:700;color:var(--ink)}
.ch label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-height:80px;resize:vertical}
textarea:focus,input[type=date]:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
input[type=date]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.kid{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;align-items:end;background:var(--sunken)}
.kid .age{grid-column:1/-1;font-size:13px;color:var(--muted);min-height:1em;margin-top:-4px}
.kdel{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;padding:10px 8px;border-radius:6px}
.kdel:hover{background:var(--accent-soft);color:var(--accent)}
.kadd{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--line-strong);background:none;border-radius:10px;padding:10px 16px;font-weight:600;color:var(--accent);cursor:pointer;margin-top:10px}
.kadd:hover{border-color:var(--accent);background:var(--accent-soft)}
.sum{margin:8px 0 0;color:var(--muted)}
@media (max-width:560px){.facts{grid-template-columns:1fr 1fr}.facts .fact:last-child{grid-column:1/-1}.ch{grid-template-columns:1fr}.kid{grid-template-columns:1fr}}
.lp{position:relative}
.lp-l{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;overflow:hidden;max-height:280px;overflow-y:auto}
.lp-l[hidden]{display:none}
.lp-i{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.lp-i+.lp-i{border-top:1px solid var(--line)}
.lp-i:hover,.lp-i.on{background:var(--sunken)}
.lp-i b{font-weight:700}
.lp-leeg{padding:11px 14px;font-size:14px;color:var(--muted)}
.mhint{margin:6px 0 0;font-size:13px;color:var(--muted)}
.lp input.lp-ok{border-color:var(--good);background:var(--good-soft)}
.bevestig{text-align:center;padding:34px 24px}
.bevestig .ic{width:72px;height:72px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px}
.bevestig .ic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bevestig h2{margin:0 0 8px;font-size:24px}
.bevestig .lead2{margin:0 auto;max-width:440px;color:var(--muted);font-size:15.5px}
.bevestig .sam{margin:22px auto 0;max-width:420px;border:1px solid var(--line);border-radius:12px;text-align:left;overflow:hidden}
.bevestig .sam div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14.5px}
.bevestig .sam div+div{border-top:1px solid var(--line)}
.bevestig .sam span{color:var(--muted)}
.bevestig .sam b{text-align:right}
.bevestig .tot{margin:22px 0 0;font-size:18px;font-weight:700}

.lp-l[hidden]{display:none}
.lp-i{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.lp-i+.lp-i{border-top:1px solid var(--line)}
.lp-i:hover,.lp-i.on{background:var(--sunken)}
.lp-i b{font-weight:700}

<style>
.kc{margin-top:14px}.kc h2{margin:0 0 2px;font-size:19px}.kc .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.bud{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunken);font-size:14px;margin:0 0 12px}
.bud b{font-variant-numeric:tabular-nums}.bud .te{color:var(--accent)}.bud .okk{color:var(--good)}
.pr{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--surface)}
.pr img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.pr .ph{width:56px;height:56px;border-radius:8px;background:var(--sunken);flex:none}
.pr .m{flex:1;min-width:0}.pr .m b{display:block;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pr .m small{color:var(--muted);font-size:12.5px}.pr .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 6px}.pr .x:hover{color:var(--accent)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:4px}.tag.ok{background:var(--good-soft);color:var(--good)}.tag.nok{background:var(--accent-soft);color:var(--accent)}.tag.w{background:#fff4e0;color:#9a5b00}
.add{display:flex;gap:8px;margin-top:6px}.add input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.add button,.sbtn{flex:none;padding:0 16px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:600 15px var(--f);cursor:pointer}
.man{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-top:8px}.man input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts .btn{margin-top:0;width:auto;flex:1}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13.5px;padding:0;margin-top:10px}
.state{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:14px;margin:0 0 10px}.state.ok{background:var(--good-soft);color:var(--good)}.state.bon{background:var(--info-soft);color:var(--info)}
.msg{color:var(--accent);font-weight:500;font-size:14px;margin:8px 0 0}.msg:empty{display:none}
.wait{opacity:.6;pointer-events:none}
</style>

<main>
  <div class="title"><h1>Cadeau kiezen</h1></div>
  <p class="lead" id="lead">Kies per kind een of meer cadeaus op bol.com of dreamland.be, binnen het budget.</p>
  <div id="box"><div class="card"><p style="margin:0">Laden…</p></div></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+Number(n||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const lang=iso=>new Date(iso+"T12:00:00").toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long"});
const Q=new URLSearchParams(location.search),ID=Q.get("i")||"",TOK=Q.get("t")||"";
let V=null;const ED={};// per kind: {items:[...], man:{...}}
async function api(b){const r=await fetch("/api/kinderfeest"+(b?"":"?cadeau="+encodeURIComponent(ID)+"&t="+encodeURIComponent(TOK)),b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cadeau:ID,t:TOK,...b})}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Er ging iets mis. Probeer het opnieuw.");return j}
function tag(it){return it.auto?(it.beschikbaar===false?'<span class="tag nok">niet op voorraad</span>':it.beschikbaar?'<span class="tag ok">op voorraad</span>':""):'<span class="tag w">niet automatisch gecontroleerd</span>'}
function prod(it,i,k,edit){return `<div class="pr">${it.foto?`<img src="${esc(it.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<span class="ph"></span>'}<div class="m"><b>${esc(it.naam||it.url)}</b><small>${esc(it.winkel)} ${tag(it)} · <a href="${esc(it.url)}" target="_blank" rel="noopener">bekijken</a>${it.levertijd?`<br>${esc(it.levertijd)}`:""}</small></div><span class="p">${it.prijs!=null?eur(it.prijs):"?"}</span>${edit?`<button type="button" class="x" data-weg="${k}" data-i="${i}" aria-label="Verwijderen">×</button>`:""}</div>`}
function kaart(k){const E=ED[k.i];
  if(k.voorzien||k.budget==null)return `<div class="card kc"><h2>${esc(k.naam)}</h2><p class="sub">${k.leeftijd!=null?k.leeftijd+" jaar op het feest":""}</p><div class="state bon">De vereniging voorziet zelf een cadeau${k.tekst&&!/vbha|vereniging/i.test(k.tekst)?" ("+esc(k.tekst)+")":""}. Je hoeft niets te kiezen.</div></div>`;
  const c=k.cadeau;
  if(!V.open||k.besteld){const st=k.besteld?"Besteld":"Gekozen";
    return `<div class="card kc"><h2>${esc(k.naam)}</h2><p class="sub">Budget ${eur(k.budget)}</p>${c&&c.bon?`<div class="state bon">${esc(k.naam)} krijgt een bon van bol.com van ${eur(k.budget)}.</div>`:c&&c.items?`<div class="state ok">${st}: ${eur(c.totaal)}</div>${c.items.map((it,i)=>prod(it,i,k.i,false)).join("")}`:`<div class="state bon">Er werd niets gekozen: ${esc(k.naam)} krijgt een bon van bol.com van ${eur(k.budget)}.</div>`}</div>`}
  if(!E.bewerk&&c){return `<div class="card kc"><h2>${esc(k.naam)}</h2><p class="sub">${k.leeftijd!=null?k.leeftijd+" jaar · ":""}budget ${eur(k.budget)}</p>${c.bon?`<div class="state bon">${esc(k.naam)} krijgt een bon van bol.com van ${eur(k.budget)}.</div>`:`<div class="state ok">✓ Bewaard: ${eur(c.totaal)}</div>${c.items.map((it,i)=>prod(it,i,k.i,false)).join("")}`}<button type="button" class="lnk" data-bewerk="${k.i}">Wijzigen</button></div>`}
  const tot=E.items.reduce((s,x)=>s+(Number(x.prijs)||0),0),rest=Math.round((k.budget-tot)*100)/100;
  return `<div class="card kc" id="k${k.i}"><h2>${esc(k.naam)}</h2><p class="sub">${k.leeftijd!=null?k.leeftijd+" jaar op het feest · ":""}budget ${eur(k.budget)}</p>
    <div class="bud"><span>Gekozen: <b>${eur(tot)}</b></span>${rest>=0?`<span class="okk">nog <b>${eur(rest)}</b> over</span>`:`<span class="te"><b>${eur(-rest)}</b> te veel</span>`}</div>
    ${E.items.map((it,i)=>prod(it,i,k.i,true)).join("")}
    ${E.man?`<div class="pr" style="display:block"><b style="font-size:14px">De winkel gaf de gegevens van dit product niet vrij.</b><div class="hint">Vul zelf de naam en de prijs in.</div><div class="man"><input id="mn${k.i}" placeholder="Naam van het product" value="${esc(E.man.naam||"")}"><input id="mp${k.i}" inputmode="decimal" placeholder="Prijs (€)"></div><div class="acts"><button type="button" class="sbtn" data-mok="${k.i}">Toevoegen</button><button type="button" class="lnk" data-mx="${k.i}" style="margin:0">Annuleren</button></div></div>`:
    `<div class="add"><input id="u${k.i}" type="url" inputmode="url" placeholder="Plak hier de link van het product" autocomplete="off"><button type="button" data-check="${k.i}">Toevoegen</button></div><div class="hint">Open het product op bol.com of dreamland.be, kopieer de link uit de adresbalk en plak die hier.</div>`}
    <div class="msg" id="m${k.i}"></div>
    <div class="acts"><button type="button" class="btn" data-save="${k.i}"${!E.items.length||rest<0?" disabled":""}>Cadeau bewaren</button></div>
    <button type="button" class="lnk" data-bon="${k.i}">Liever een bon van bol.com (${eur(k.budget)})</button>${c?` <button type="button" class="lnk" data-annul="${k.i}" style="margin-left:12px">Annuleren</button>`:""}</div>`}
function toon(){if(!V)return;
  $("#lead").innerHTML=V.open?`Kies per kind een of meer cadeaus op <a href="https://www.bol.com" target="_blank" rel="noopener">bol.com</a> of <a href="https://www.dreamland.be" target="_blank" rel="noopener">dreamland.be</a>, binnen het budget. Let op de beschikbaarheid en de levertijd. Kiezen kan tot en met <b>${esc(lang(V.tot))}</b>.`:`De termijn om te kiezen is voorbij. Wie niets koos, krijgt een bon van bol.com ter waarde van het budget.`;
  $("#box").innerHTML=V.kinderen.map(kaart).join("")+`<p class="hint" style="margin-top:16px;text-align:center">Kinderfeest ${esc(lang(V.datum))} · ${esc(V.lid)}</p>`}
function init(j){V=j;for(const k of V.kinderen){ED[k.i]={items:k.cadeau&&k.cadeau.items?k.cadeau.items.map(x=>({...x})):[],bewerk:false,man:null}}toon()}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t||!V)return;const d=t.dataset;
  const k=V.kinderen.find(x=>String(x.i)===String(d.check??d.save??d.weg??d.bon??d.bewerk??d.annul??d.mok??d.mx));if(!k)return;const E=ED[k.i],msg=m=>{const el=$("#m"+k.i);if(el)el.textContent=m||""};
  if(d.bewerk!=null){E.bewerk=true;toon();return}
  if(d.annul!=null){E.bewerk=false;E.items=k.cadeau&&k.cadeau.items?k.cadeau.items.map(x=>({...x})):[];E.man=null;toon();return}
  if(d.weg!=null){E.items.splice(+d.i,1);E.bewerk=true;toon();return}
  if(d.mx!=null){E.man=null;toon();return}
  if(d.check!=null){const u=($("#u"+k.i).value||"").trim();if(!u){msg("Plak eerst de link van het product.");return}
    const kaartEl=$("#k"+k.i);kaartEl&&kaartEl.classList.add("wait");msg("");
    try{const p=await api({actie:"check",url:u});if(p.auto){if(p.beschikbaar===false){msg(`"${p.naam}" is niet op voorraad. Kies een ander product.`);kaartEl&&kaartEl.classList.remove("wait");return}E.items.push(p);E.bewerk=true;toon()}else{E.man={url:p.url,winkel:p.winkel,naam:p.naam||"",foto:p.foto};E.bewerk=true;toon()}}
    catch(x){kaartEl&&kaartEl.classList.remove("wait");msg(x.message)}return}
  if(d.mok!=null){const n=($("#mn"+k.i).value||"").trim(),p=Number(String($("#mp"+k.i).value||"").replace(",","."));if(!n||!(p>0)){msg("Vul de naam en de prijs in.");return}
    E.items.push({...E.man,naam:n,prijs:Math.round(p*100)/100,auto:false});E.man=null;toon();return}
  if(d.save!=null||d.bon!=null){const kaartEl=t.closest(".card");kaartEl&&kaartEl.classList.add("wait");
    try{const j=await api({actie:"bewaar",kind:k.i,...(d.bon!=null?{bon:true}:{items:E.items.map(x=>({url:x.url,naam:x.naam,prijs:x.prijs}))})});
      const nieuw=j.kinderen.find(x=>x.i===k.i);V=j;ED[k.i]={items:nieuw.cadeau&&nieuw.cadeau.items?nieuw.cadeau.items.map(x=>({...x})):[],bewerk:false,man:null};for(const x of V.kinderen)if(!ED[x.i])ED[x.i]={items:[],bewerk:false,man:null};toon()}
    catch(x){kaartEl&&kaartEl.classList.remove("wait");msg(x.message)}}});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.id&&/^u\d+$/.test(t.id)){e.preventDefault();const b=document.querySelector(`[data-check="${t.id.slice(1)}"]`);b&&b.click()}});
if(!ID||!TOK)$("#box").innerHTML='<div class="card"><p style="margin:0">Deze link is onvolledig. Gebruik de link uit de bevestigingsmail.</p></div>';
else api().then(init).catch(x=>{$("#box").innerHTML=`<div class="card"><p style="margin:0">${esc(x.message)}</p></div>`});
</script>
</body>
</html>
