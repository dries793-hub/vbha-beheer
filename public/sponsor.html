<html lang="nl">
<head>
<meta charset="utf-8">

<title>Sponsor worden · VBHA</title>
<meta name="description" content="Word sponsor van de brandweerkalender van de Vriendenkring Brandweer Hoofdpost Aalst.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F5F6;--surface:#FFFFFF;--sunken:#F1F1F2;--ink:#1A1B1E;--muted:#686B71;--line:#E5E6E8;--line-strong:#CCCED2;--navy:#18191C;--accent:#C0161F;--accent-deep:#8F0F16;--accent-soft:#FCEBEC;--good:#18794A;--good-soft:#E3F4EA;--info:#2F6FE4;--info-soft:#E4EDFD;--f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--surface:#1A1B1E;--sunken:#202226;--ink:#ECEDEF;--muted:#9B9EA5;--line:#2A2C30;--line-strong:#3C3F45;--accent-soft:#3A1416;--good-soft:#12301F;--info-soft:#16233D}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
.hdr{background:var(--navy);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px;color:#fff}
.hdr .logo{height:30px;width:auto;display:block}
.hdr span{font-size:13.5px;color:#A4A7AD;border-left:1px solid #3a3c40;padding-left:14px}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.title{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.title img{height:48px;width:auto}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
label,.lbl{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:block;text-align:center;padding:10px 6px;border:1px solid var(--line-strong);border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;background:var(--surface)}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input:focus-visible+span{box-shadow:0 0 0 3px var(--info-soft)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pay{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--sunken);font-size:14px}
.pay b{font-variant-numeric:tabular-nums}
.err{color:var(--accent);font-weight:500;min-height:0;margin:14px 0 0}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;width:100%;padding:13px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 16px var(--f);cursor:pointer}
.btn:hover{background:var(--accent-deep)}
.btn:disabled{opacity:.6;cursor:default}
.ok{text-align:center;padding:30px 22px}
.ok .ic{width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 14px}
.ok .ic svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok h2{margin:0 0 8px;font-size:22px}
.ok p{margin:0 0 6px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-block;margin-top:4px;color:var(--ink)}
.paybox{text-align:left;margin-top:22px;padding:18px;border-radius:12px;background:var(--sunken)}
.paybox h3{margin:0 0 14px;font-size:17px;text-align:center}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr{width:200px;max-width:70vw;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qrwrap p{margin:0;font-size:13.5px;color:var(--muted);text-align:center;max-width:34ch}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.pd{margin:0;display:flex;flex-direction:column;gap:10px}
.pd>div{display:flex;flex-direction:column;gap:3px}
.pd dt{font-size:12.5px;color:var(--muted)}
.pd dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.pd .mono{margin:0}
.cp{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 10px;font:500 12.5px var(--f);cursor:pointer}
.cp:hover{border-color:var(--ink)}
.cp.ok{border-color:var(--good);color:var(--good)}
.btn.bc{margin-top:0;background:#1A1B1E;font-size:16.5px;padding:15px 18px;text-decoration:none}
.btn.bc:hover{background:#000}
.btn.bc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.bc.off{opacity:.45;pointer-events:none}
.hint.c{text-align:center;margin:8px 0 0}
.qrwrap.desk{margin-top:16px}
@media (pointer:coarse){.qrwrap.desk{display:none}}
.qr img{display:block;width:100%;height:auto}
.wacht{margin:10px 0 0;text-align:center;font-size:13.5px;color:var(--muted)}
.wacht:empty{display:none}
.zelf{margin-top:16px;border-top:1px solid var(--line-strong);padding-top:12px}
.zelf summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style-position:inside}
.zelf[open] summary{margin-bottom:12px}
.paid{text-align:center;padding:6px 0}
.paid h3{margin:0 0 6px}
.paid p{margin:0;color:var(--muted)}
.paid .ic{width:48px;height:48px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 10px}
.paid .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.paybox .hint{margin:12px 0 0;font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr 1fr}h1{font-size:23px}.card{padding:18px}.hdr span{display:none}}
.bevestig{text-align:center;padding:34px 24px}
.bevestig .ic{width:72px;height:72px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px}
.bevestig .ic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bevestig h2{margin:0 0 8px;font-size:24px}
.bevestig .lead2{margin:0 auto;max-width:440px;color:var(--muted);font-size:15.5px}
.bevestig .sam{margin:22px auto 0;max-width:420px;border:1px solid var(--line);border-radius:12px;text-align:left;overflow:hidden}
.bevestig .sam div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14.5px}
.bevestig .sam div+div{border-top:1px solid var(--line)}
.bevestig .sam span{color:var(--muted)}
.bevestig .sam b{text-align:right}
.bevestig .tot{margin:22px 0 0;font-size:18px;font-weight:700}
/* iPhone: datumvelden niet breder dan hun vak, geen schuifbalken */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;display:block;box-sizing:border-box;min-height:44px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
html,body{overflow-x:hidden}
@media (max-width:760px){*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}}
.kid>*{min-width:0}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.seg2 button{padding:11px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14.5px var(--f);cursor:pointer}
.seg2 button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
h2.sec{font-size:16px;margin:22px 0 10px}
h2.sec:first-child{margin-top:0}
.fm{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fm label{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px 14px 12px;border:1.5px solid var(--line-strong);border-radius:10px;cursor:pointer;background:var(--surface)}
.fm input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.fm .n{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.fm .b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.fm .o{font-size:13px;color:var(--muted);line-height:1.35}
.fm label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.fm label:has(input:focus-visible){box-shadow:0 0 0 3px var(--info-soft)}
.fm .vrij{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
.fm .vrij input[type=text]{position:relative;z-index:2;opacity:1;width:120px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;inset:auto}
.zk{position:relative}
.zk-l{margin-top:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zk-l:empty{display:none}
.zk-l button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}
.zk-l button+button{border-top:1px solid var(--line)}
.zk-l button:hover{background:var(--sunken)}
.gek{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;background:var(--good-soft);color:var(--good);font-weight:600}
.gek button{border:0;background:none;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer}
.chk{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-strong);border-radius:10px;cursor:pointer;margin-top:4px}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.chk small{display:block;color:var(--muted);font-size:13px}
.lg-drop{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px dashed var(--line-strong);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.lg-drop:hover,.lg-drop.on{border-color:var(--accent);background:rgba(200,16,46,.04)}
.lg-ic{flex:none;width:52px;height:52px;border-radius:10px;background:#f1f1f1;display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.lg-ic img{max-width:100%;max-height:100%;object-fit:contain}.lg-ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lg-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.lg-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lg-t small{color:var(--muted);font-size:13px}
.lg-x{flex:none;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}.lg-x:hover{background:#f1f1f1}
.lg-hint{margin:6px 2px 0;font-size:13px;color:var(--muted)}
.lg-meld{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff6e0;border:1px solid #f1c96b;border-radius:12px;padding:12px 14px;margin:16px 0 4px;font-size:14.5px}
.lg-meld b{display:block}.lg-meld a{color:inherit;font-weight:600}
.hint2{font-size:13px;color:var(--muted);margin:6px 0 0}
@media (max-width:560px){.fm{grid-template-columns:1fr 1fr}.fm .b{font-size:21px}}
</style>
</head>

<script>const adresVolledig=s=>{s=String(s||"").trim();return /[A-Za-zÀ-ÿ]{2,}/.test(s)&&/\b[1-9]\d{3}\s+[A-Za-zÀ-ÿ'’][A-Za-zÀ-ÿ'’ .\-]+/.test(s)&&/[A-Za-zÀ-ÿ.]\s*\d+\s*[A-Za-z]?\b(?=.*\b[1-9]\d{3}\b)/.test(s)};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€"+Number(n).toLocaleString("nl-BE",{minimumFractionDigits:0,maximumFractionDigits:2});
const iban=s=>String(s||"").replace(/\s+/g,"").replace(/(.{4})/g,"$1 ").trim();
const Q=new URLSearchParams(location.search);
const OK_ICON='<div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';
const BC_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10 18.5h4"/></svg>';
let CFG=null,MODE="nieuw",GEKOZEN=null,T0=Date.now();
function handmatig(j){return `<dl class="pd"><div><dt>Bedrag</dt><dd><b>${eur(j.bedrag)}</b></dd></div>
  <div><dt>Rekeningnummer</dt><dd><span class="mono">${esc(iban(j.rekeningnummer))}</span><button type="button" class="cp" data-cp="${esc(String(j.rekeningnummer).replace(/\s+/g,""))}">Kopieer</button></dd></div>
  <div><dt>Begunstigde</dt><dd>${esc(j.begunstigde)}</dd></div>
  <div><dt>Mededeling</dt><dd><span class="mono">${esc(j.mededeling)}</span><button type="button" class="cp" data-cp="${esc(j.mededeling)}">Kopieer</button></dd></div></dl>
  <p class="hint">Gebruik exact deze mededeling, dan wordt uw betaling automatisch herkend.${j.deadlineTekst?" Graag betalen vóór <b>"+esc(j.deadlineTekst)+"</b>.":""}</p>`}
function overschrijven(j){return `${j.qr?`<div class="qrwrap"><div class="qr">${j.qr}</div><p>Scan deze code met de app van uw bank. Bedrag, rekeningnummer en mededeling staan dan al ingevuld.</p></div><div class="or"><span>of schrijf zelf over</span></div>`:""}${handmatig(j)}`}

/* ---------- inschrijven ---------- */
function formulier(){const c=CFG;
  $("#h1").textContent="Sponsor worden";
  $("#lead").innerHTML=`Steun de <b>brandweerkalender ${c.kalenderjaar}</b>: 20.000 kalenders in de brievenbus, met uw logo zichtbaar bij gezinnen in Aalst en omgeving.`;
  $("#box").innerHTML=`<form class="card" id="f" novalidate>
   <div class="seg2" role="tablist"><button type="button" data-m="nieuw" class="${MODE==="nieuw"?"on":""}">Nieuwe sponsor</button><button type="button" data-m="bestaand" class="${MODE==="bestaand"?"on":""}">Sponsoring vernieuwen</button></div>
   <div id="zoek"></div>
   <h2 class="sec">Kies uw sponsorformule</h2>
   <div class="fm">${c.formules.map((f,i)=>`<label><input type="radio" name="formule" value="${esc(f.id)}"${i===0?"":""}><span class="n">${esc(f.naam)}</span><span class="b">${eur(f.bedrag)}</span><span class="o">${esc(f.omschrijving||"")}</span></label>`).join("")}
    ${c.vrij&&c.vrij.aan?`<label class="vrij"><input type="radio" name="formule" value="vrij"><span class="n">Vrije bijdrage</span><span style="display:flex;align-items:center;gap:6px">€ <input type="text" id="vb" inputmode="decimal" placeholder="${esc(c.vrij.min||50)}" aria-label="Bedrag vrije bijdrage"></span><span class="o">minstens ${eur(c.vrij.min||0)}</span></label>`:""}</div>
   <h2 class="sec">Gegevens sponsor</h2>
   <p class="hint2" id="hintBest" style="display:${MODE==="bestaand"?"block":"none"};margin:-4px 0 12px">Vul enkel in wat veranderd is; lege velden houden de gegevens die we al hebben.</p>
   <div class="grid">
    <div class="full" id="wBedrijf"><label for="bedrijf">Naam bedrijf / handelszaak *</label><input type="text" id="bedrijf" autocomplete="organization"></div>
    <div><label for="voornaam">Voornaam contactpersoon</label><input type="text" id="voornaam" autocomplete="given-name"></div>
    <div><label for="naam">Naam contactpersoon</label><input type="text" id="naam" autocomplete="family-name"></div>
    <div class="full"><label for="adres" id="lAdres">Adres *</label><input type="text" id="adres" name="adres" autocomplete="street-address" placeholder="Straat nr, postcode gemeente"></div>
    <div><label for="btw">Btw-nummer</label><input type="text" id="btw" placeholder="BE0123.456.789"></div>
    <div><label for="email">E-mail *</label><input type="email" id="email" autocomplete="email" inputmode="email"></div>
    <div><label for="telefoon">Telefoon</label><input type="tel" id="telefoon" autocomplete="tel"></div>
    <label class="chk full" for="factuur"><input type="checkbox" id="factuur"><span><b>Ik wens een factuur</b><small>De factuur wordt meteen aangemaakt en zit als PDF in bijlage bij de bevestigingsmail.</small></span></label>
    <div class="full"><label for="logo">Uw logo</label><div id="lgBox"></div><input type="file" id="logo" accept=".png,.jpg,.jpeg,.svg,.pdf,.eps,.ai,.webp,.tif,.tiff" hidden>
     <p class="lg-hint" id="lgHint">Geen logo bij de hand? Geen probleem: u kan het ook later nog doorsturen naar <a href="mailto:${esc(c.logoMail||"info@vbha.be")}">${esc(c.logoMail||"info@vbha.be")}</a>.</p></div>
   </div>
   <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
   <div class="pay" id="som" style="display:none"></div>
   <p class="err" id="err"></p>
   <button class="btn" type="submit" id="go">Inschrijven</button>
   <p class="hint2" style="text-align:center">Na het inschrijven kan u meteen betalen met Bancontact of via overschrijving.</p></form>`;
  zoekVak();som();lgToon()}

let LOGO=null;const LG_MAX=3.5*1048576,LG_EXT=/\.(png|jpe?g|svg|pdf|eps|ai|webp|tiff?)$/i;
const LG_IC='<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>';
const kb=n=>n<1048576?Math.max(1,Math.round(n/1024))+" kB":(n/1048576).toLocaleString("nl-BE",{maximumFractionDigits:1})+" MB";
function lgToon(){const b=$("#lgBox");if(!b)return;const h=$("#lgHint");
  if(!LOGO){b.innerHTML=`<label class="lg-drop" for="logo" id="lgDrop"><span class="lg-ic">${LG_IC}</span><span class="lg-t"><b>Logo opladen</b><small>Klik of sleep uw logo hierheen · PNG, JPG, SVG, PDF, EPS of AI · max. 3,5 MB</small></span></label>`;if(h)h.style.display="";return}
  const img=/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(LOGO.file.type)?`<img alt="" src="${LOGO.url}">`:LG_IC;
  b.innerHTML=`<div class="lg-drop" id="lgDrop"><span class="lg-ic">${img}</span><span class="lg-t"><b>${esc(LOGO.file.name)}</b><small>${kb(LOGO.file.size)} · wordt meegestuurd met uw inschrijving</small></span><button type="button" class="lg-x" id="lgWeg" aria-label="Logo verwijderen" title="Verwijderen">×</button></div>`;if(h)h.style.display="none"}
function lgKies(f){const err=$("#err");if(!f)return;if(!LG_EXT.test(f.name)){err.textContent="Dit bestandstype kunnen we niet aanvaarden als logo. Gebruik PNG, JPG, SVG, PDF, EPS of AI.";return}
  if(f.size>LG_MAX){err.textContent=`Uw logo is te groot (${kb(f.size)}, max. 3,5 MB). Stuur het dan na het inschrijven door naar ${CFG.logoMail||"info@vbha.be"}.`;return}
  err.textContent="";if(LOGO&&LOGO.url)URL.revokeObjectURL(LOGO.url);LOGO={file:f,url:URL.createObjectURL(f)};lgToon()}
const lgB64=f=>new Promise((ok,nok)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).replace(/^data:[^,]*,/,""));r.onerror=()=>nok(new Error("Het logo kon niet gelezen worden."));r.readAsDataURL(f)});
document.addEventListener("change",e=>{if(e.target.id==="logo"){lgKies(e.target.files[0]);e.target.value=""}});
document.addEventListener("click",e=>{if(e.target.id==="lgWeg"){e.preventDefault();if(LOGO&&LOGO.url)URL.revokeObjectURL(LOGO.url);LOGO=null;lgToon()}});
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest("#lgDrop");if(!z)return;e.preventDefault();z.classList.add("on")}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest("#lgDrop");if(!z)return;e.preventDefault();if(ev==="dragleave"&&z.contains(e.relatedTarget))return;z.classList.remove("on");if(ev==="drop"&&e.dataTransfer&&e.dataTransfer.files[0])lgKies(e.dataTransfer.files[0])}));
function zoekVak(){const z=$("#zoek"),el=$('label[for="email"]');if(el)el.textContent=MODE==="bestaand"?"E-mail (leeg = gekend adres)":"E-mail *";const la=$("#lAdres");if(la)la.textContent=MODE==="bestaand"?"Adres (leeg = gekend adres)":"Adres *";if(MODE!=="bestaand"){z.innerHTML="";$("#wBedrijf").style.display="";return}
  $("#wBedrijf").style.display=GEKOZEN?"none":"";
  z.innerHTML=GEKOZEN?`<div class="gek"><span>✓ ${esc(GEKOZEN.naam)}</span><button type="button" id="anders">Andere kiezen</button></div>`:`<div class="zk"><label for="zq">Zoek uw bedrijf</label><input type="text" id="zq" placeholder="Typ de naam van uw bedrijf" autocomplete="off"><div class="zk-l" id="zl"></div><p class="hint2">Niet gevonden? Kies dan <b>Nieuwe sponsor</b>.</p></div>`}
let zt=0;async function zoek(q){clearTimeout(zt);zt=setTimeout(async()=>{const l=$("#zl");if(!l)return;if(q.trim().length<2){l.innerHTML="";return}
  try{const j=await (await fetch("/api/sponsor?q="+encodeURIComponent(q))).json();l.innerHTML=(j.sponsors||[]).map(s=>`<button type="button" data-sp="${esc(s.id)}" data-n="${esc(s.naam)}">${esc(s.naam)}</button>`).join("")||'<div style="padding:10px 12px;color:var(--muted)">Geen sponsor gevonden.</div>'}catch(x){}},200)}
function gekozenBedrag(){const r=$('input[name="formule"]:checked');if(!r)return null;if(r.value==="vrij"){const v=Number(String(($("#vb")||{}).value||"").replace(",","."));return v>0?v:null}const f=CFG.formules.find(x=>x.id===r.value);return f?Number(f.bedrag):null}
function som(){const s=$("#som"),b=gekozenBedrag(),r=$('input[name="formule"]:checked');if(!s)return;if(!r){s.style.display="none";return}
  const f=r.value==="vrij"?{naam:"Vrije bijdrage"}:CFG.formules.find(x=>x.id===r.value);s.style.display="";s.innerHTML=`Te betalen: <b>${b?eur(b):"–"}</b> · ${esc(f.naam)} · brandweerkalender ${CFG.kalenderjaar}`;$("#go").textContent=b?"Inschrijven en "+eur(b)+" betalen":"Inschrijven"}
async function verstuur(e){e.preventDefault();const err=$("#err");err.textContent="";const g=id=>($("#"+id)||{}).value?.trim()||"";
  const r=$('input[name="formule"]:checked');if(!r){err.textContent="Kies een sponsorformule.";return}
  if(MODE==="bestaand"&&!GEKOZEN){err.textContent="Zoek en kies uw bedrijf, of kies Nieuwe sponsor.";return}
  if(MODE==="nieuw"&&!g("bedrijf")){err.textContent="Vul de naam van uw bedrijf in.";$("#bedrijf").focus();return}
  const em=g("email");if((MODE==="nieuw"||em)&&!/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]{2,}$/.test(em)){err.textContent="Vul een geldig e-mailadres in.";$("#email").focus();return}
  if((MODE==="nieuw"||g("adres"))&&!adresVolledig(g("adres"))){err.textContent="Vul het volledige adres in: straat, huisnummer, postcode en gemeente (bv. Kerkstraat 12, 9300 Aalst).";$("#adres").focus();return}
  const body={formule:r.value,bedrag:r.value==="vrij"?g("vb"):"",sponsorId:MODE==="bestaand"?GEKOZEN.id:"",bedrijf:g("bedrijf"),voornaam:g("voornaam"),naam:g("naam"),straat:g("adres"),gemeente:"",btw:g("btw"),email:em,telefoon:g("telefoon"),factuur:$("#factuur").checked,website:g("website"),duur:Date.now()-T0};
  const b=$("#go");b.disabled=true;b.textContent=LOGO?"Logo en gegevens versturen…":"Bezig…";
  try{if(LOGO)body.logo={naam:LOGO.file.name,type:LOGO.file.type,data:await lgB64(LOGO.file)};const res=await fetch("/api/sponsor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await res.json();if(!res.ok)throw new Error(j.error||"Inschrijven lukte niet.");if(!j.bedrag)throw new Error("Inschrijven lukte niet.");bedankt(j)}
  catch(x){err.textContent=x.message;b.disabled=false;som()}}
function bedankt(j){$("#lead").textContent="";$("#h1").textContent="Bedankt!";
  $("#box").innerHTML=`<div class="card bevestig">${OK_ICON}<h2>${j.nieuw?"Welkom als sponsor!":"Bedankt om te vernieuwen!"}</h2><p class="lead2">We ontvingen uw sponsoring voor de brandweerkalender ${esc(j.kalenderjaar)}. U krijgt zo dadelijk een bevestiging per mail${j.factuur?` met factuur <b>${esc(j.factuur.nr)}</b> in bijlage`:""}.</p>
   <div class="sam"><div><span>Bedrijf</span><b>${esc(j.bedrijf)}</b></div><div><span>Formule</span><b>${esc(j.formule)}</b></div><div><span>Bedrag</span><b>${eur(j.bedrag)}</b></div></div>
   <div class="paybox"><h3>Betalen: ${eur(j.bedrag)}</h3>${j.online?`<a class="btn bc" href="${esc(j.betaalLink)}">${BC_ICON}Betaal met Bancontact</a><details class="zelf"><summary>Geen app of lukt het niet? Betaal via overschrijving</summary>${overschrijven(j)}</details>`:overschrijven(j)}</div>
   ${j.logo?`<p class="hint2">✓ Uw logo is goed ontvangen.</p>`:`<div class="lg-meld" role="status"><span>⚠️</span><span><b>We hebben nog geen logo van u.</b>Stuur uw logo (liefst in hoge resolutie of als vectorbestand) nog door naar <a href="mailto:${esc(j.logoMail||CFG.logoMail||"info@vbha.be")}?subject=${encodeURIComponent("Logo "+j.bedrijf+" - brandweerkalender "+j.kalenderjaar)}">${esc(j.logoMail||CFG.logoMail||"info@vbha.be")}</a>, dan zorgen wij voor de rest.</span></div>`}</div>`;
  if(LOGO&&LOGO.url)URL.revokeObjectURL(LOGO.url);LOGO=null;window.scrollTo({top:0,behavior:"smooth"})}
document.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m){MODE=m.dataset.m;GEKOZEN=null;$$("[data-m]").forEach(x=>x.classList.toggle("on",x===m));$("#hintBest").style.display=MODE==="bestaand"?"block":"none";zoekVak();return}
  const s=e.target.closest("[data-sp]");if(s){GEKOZEN={id:s.dataset.sp,naam:s.dataset.n};zoekVak();return}
  if(e.target.id==="anders"){GEKOZEN=null;zoekVak();setTimeout(()=>$("#zq")&&$("#zq").focus(),20);return}
  if(e.target.closest(".vrij")){const r=$('.vrij input[type=radio]');if(r){r.checked=true;som()}}});
document.addEventListener("input",e=>{if(e.target.id==="zq")zoek(e.target.value);if(e.target.id==="vb")som()});
document.addEventListener("change",e=>{if(e.target.name==="formule"){som();if(e.target.value==="vrij")setTimeout(()=>$("#vb")&&$("#vb").focus(),10)}});
document.addEventListener("submit",e=>{if(e.target.id==="f")verstuur(e)});

/* ---------- betalen via de link uit de mail (zonder factuur) ---------- */
const P={sp:Q.get("b")||"",j:Q.get("j")||"",a:Q.get("a")||"",t:Q.get("t")||""};
const pq=()=>"?"+new URLSearchParams(P).toString();
const terug=()=>"?"+new URLSearchParams({b:P.sp,j:P.j,a:P.a,t:P.t}).toString();
let INFO=null,volgT=0,volgN=0;
function appLink(o){if(!o||!o.deeplink)return null;const ret=location.origin+location.pathname+terug()+"&betaling=terug";return o.deeplink+(o.deeplink.includes("?")?"&":"?")+"returnUrl="+encodeURIComponent(ret)}
function onlineBlok(o){const href=appLink(o);return `<a class="btn bc" id="bcGo" href="${esc(href||o.checkout||"#")}">${BC_ICON}Betaal ${eur(INFO.bedrag)} met Bancontact</a>
  <p class="hint c">${o.deeplink?"Uw bank- of Bancontact-app opent en u bevestigt de betaling daar.":"U gaat naar de beveiligde betaalpagina."}</p>
  ${o.qrcode?`<div class="qrwrap desk"><div class="qr"><img src="${esc(o.qrcode)}" alt="Bancontact-QR-code" width="200" height="200"></div><p>Op een computer? Scan deze code met de Bancontact-app of de app van uw bank.</p></div>`:""}<p class="wacht" id="bcStatus" aria-live="polite"></p>`}
function betaald(){$("#lead").textContent="";$("#h1").textContent="Sponsoring betaald";$("#box").innerHTML=`<div class="card bevestig">${OK_ICON}<h2>Bedankt voor uw steun!</h2><p class="lead2">We ontvingen uw betaling${INFO.bedrag?" van <b>"+eur(INFO.bedrag)+"</b>":""} voor de sponsoring van de brandweerkalender ${esc(INFO.kalenderjaar)}.</p></div>`}
function betaalScherm(){const j=INFO;$("#h1").textContent="Sponsoring betalen";$("#lead").innerHTML=`${esc(j.bedrijf)} · brandweerkalender <b>${esc(j.kalenderjaar)}</b>`;
  $("#box").innerHTML=`<div class="card"><div class="paybox" style="margin-top:0"><h3>Te betalen: ${eur(j.bedrag)}</h3>${j.kanOnline?`<div id="online"><div class="wacht">Betaling voorbereiden…</div></div><details class="zelf"><summary>Geen app of lukt het niet? Betaal via overschrijving</summary>${overschrijven(j)}</details>`:overschrijven(j)}</div></div>`;if(j.kanOnline)start()}
async function start(o){try{if(!o||!(o.deeplink||o.checkout)||["EXPIRED","CANCELLED","FAILED","AUTHORIZATION_FAILED"].includes(o.status)){const r=await fetch("/api/betaling",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(P)});o=await r.json();if(!r.ok)throw new Error(o.error)}
    if(o.status==="SUCCEEDED")return betaald();$("#online").innerHTML=onlineBlok(o);volgN=0;volg()}catch(x){$("#online").innerHTML=`<p class="wacht">Online betalen lukt nu niet. Schrijf het bedrag gerust over.</p>`;const z=$(".zelf");if(z)z.open=true}}
async function volg(){clearTimeout(volgT);try{const r=await fetch("/api/betaling"+pq());const s=await r.json();INFO={...INFO,...s};if(s.betaald)return betaald();const o=s.online||{},st=$("#bcStatus");
    if(["EXPIRED","CANCELLED","FAILED","AUTHORIZATION_FAILED"].includes(o.status)){if(st)st.innerHTML=`${o.status==="EXPIRED"?"Deze betaling is verlopen.":"De betaling is niet gelukt."} <button type="button" class="cp" id="bcNieuw">Opnieuw proberen</button>`;const g=$("#bcGo");if(g)g.classList.add("off");return}
    if(o.status==="IDENTIFIED"||o.status==="AUTHORIZED"){if(st)st.textContent="Bevestig de betaling in uw app…"}}catch(x){}if(++volgN<200)volgT=setTimeout(volg,document.hidden?8000:3000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&INFO&&$("#bcGo")){volgN=0;volg()}});
document.addEventListener("click",async e=>{if(e.target.id==="bcNieuw"){e.target.disabled=true;start(null);return}const b=e.target.closest(".cp");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.cp);const t=b.textContent;b.textContent="Gekopieerd";b.classList.add("ok");setTimeout(()=>{b.textContent=t;b.classList.remove("ok")},1600)}catch(x){}});

(async()=>{try{
  if(P.sp){if(Q.get("betaling"))history.replaceState(null,"",location.pathname+terug());const r=await fetch("/api/betaling"+pq());const j=await r.json();if(!r.ok)throw new Error(j.error||"Deze link werkt niet.");INFO=j;return j.betaald?betaald():betaalScherm()}
  const r=await fetch("/api/sponsor");CFG=await r.json();if(!r.ok)throw new Error(CFG.error||"Laden lukte niet.");
  if(CFG.logoMail){$("#footMail").textContent=CFG.logoMail;$("#footMail").href="mailto:"+CFG.logoMail}
  if(Q.get("vernieuwen"))MODE="bestaand";
  if(!CFG.open){$("#lead").textContent="";$("#box").innerHTML=`<div class="card ok"><h2>Inschrijven is gesloten</h2><p>${CFG.gesloten==="verlopen"?"De inschrijvingen voor de brandweerkalender "+esc(CFG.kalenderjaar)+" zijn afgesloten.":"De inschrijvingen zijn momenteel gesloten."} Interesse? Mail naar <a href="mailto:${esc(CFG.logoMail)}">${esc(CFG.logoMail)}</a>.</p></div>`;return}
  formulier()}catch(x){$("#lead").textContent="";$("#box").innerHTML=`<div class="card ok"><h2>Er ging iets mis</h2><p>${esc(x.message)}</p></div>`}})();
</script>
<script src="/adres.js" defer></script>
