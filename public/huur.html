<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const t0=Date.now();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>"€ "+(Number(n)||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const MND=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"],MK=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"],DAG=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const pd=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const lang=iso=>{const d=pd(iso);return d?DAG[d.getDay()]+" "+d.getDate()+" "+MND[d.getMonth()]:""};
const kort=iso=>{const d=pd(iso);return d?d.getDate()+" "+MK[d.getMonth()]:""};
const per=(a,b)=>a===b?lang(a):lang(a)+" t/m "+lang(b);
const perK=(a,b)=>a===b?kort(a):kort(a)+" – "+kort(b);
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const plus=(iso,n)=>{const d=pd(iso);d.setDate(d.getDate()+n);return isoD(d)};
const dagen=(a,b)=>Math.round((pd(b)-pd(a))/864e5)+1;
const img=id=>"/api/huur?img="+encodeURIComponent(id);
const STN={tebetalen:"Te betalen",betaald:"Bevestigd",uitgeleend:"Afgehaald",afgerond:"Afgerond",geannuleerd:"Geannuleerd"};
const BC_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10 18.5h4"/></svg>';
const LEEG_IC='<svg viewBox="0 0 24 24"><path d="M3 20h18M5 20l7-14 7 14M12 6v14"/></svg>';
let SES=null,D=null,TAB="huren",M={van:"",tot:"",items:{}},KIES="van",CAL="",PR=null,PRT=0,BET=null,volgT=0,volgN=0,WIJZE="bancontact";
try{SES=localStorage.getItem("vbha_huur")}catch(e){}
{const q=new URLSearchParams(location.search);if(q.get("s")){SES=q.get("s");try{localStorage.setItem("vbha_huur",SES)}catch(e){}}
  if(q.get("s")||q.get("betaling"))history.replaceState(null,"",location.pathname);if(q.get("betaling"))TAB="res"}
async function api(body,get){const o=get?{headers:SES?{"x-huur":SES}:{}}:{method:"POST",headers:{"Content-Type":"application/json",...(SES?{"x-huur":SES}:{})},body:JSON.stringify(body||{})};
  const r=await fetch("/api/huur",o);const j=await r.json().catch(()=>({}));if(r.status===401&&SES){afmelden(true);throw new Error(j.error||"Je link is verlopen.")}if(!r.ok)throw new Error(j.error||"Er ging iets mis.");return j}
function afmelden(stil){SES=null;D=null;$("#dag").hidden=true;try{localStorage.removeItem("vbha_huur")}catch(e){}laad(stil?"Je persoonlijke link is verlopen of ongeldig. Vraag hieronder een nieuwe aan.":"")}
const ok=(t,s)=>`<div class="card bevestig" style="margin-bottom:14px"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>${t}</h2><p class="lead2">${s}</p></div>`;

function toonLogin(melding){
  $("#box").innerHTML=`<form class="vb-form" id="fl" novalidate><section class="vb-sec"><h2 class="vb-card-t">Aanmelden</h2>${melding?VB.notice(esc(melding)):""}
  <p class="hint" style="margin:0 0 12px">Huren kan voor leden met een betaald lidgeld. Vul je naam in: we mailen je een persoonlijke link. Daarmee zie je wat je kan huren en aan welke prijs, en reserveer en betaal je meteen.</p>
  <div class="grid"><div class="full"><label for="naam">Je naam</label><input type="text" id="naam" maxlength="100" placeholder="Typ je naam en kies ze uit de lijst"></div></div></section>
  <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
  <p class="err" id="err" role="alert"></p><div class="vb-checkout"><button class="btn" id="go" type="submit">Stuur mij mijn persoonlijke link</button></div></form>`;
  lidPicker($("#naam"));
  $("#fl").addEventListener("submit",async e=>{e.preventDefault();const er=$("#err");er.textContent="";const id=$("#naam").dataset.id;
    if(!id){VB.veldFout($("#naam"),$("#naam").value.trim()?"Kies je naam uit de lijst van leden.":"Vul je naam in en kies ze uit de lijst.");return}
    const b=$("#go");b.disabled=true;b.textContent="Even geduld…";
    try{const j=await api({actie:"login",lidId:id,website:$("#website").value});
      if(j.geenMail){er.textContent="We hebben geen e-mailadres van jou. Mail naar info@vbha.be, dan helpen we je verder.";b.disabled=false;b.textContent="Stuur mij mijn persoonlijke link";return}
      $("#fl").outerHTML=`<div class="card bevestig"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4z"/><path d="M4 7l8 6 8-6"/></svg></div><h2>Kijk in je mailbox</h2>

        ${j.testLink?`<a class="tst" href="${esc(j.testLink)}">Testomgeving (er vertrekt geen mail): open je persoonlijke link</a>`:""}</div>`}
    catch(x){er.textContent=x.message;b.disabled=false;b.textContent="Stuur mij mijn persoonlijke link"}})}

function prijsT(i){const B=i.beurtDagen||1;if(i.prijsModus==="beurt")return eur(i.prijsBeurt)+" per huurbeurt"+(B>1?" (max. "+B+" dagen)":" (1 dag)");
  if(i.prijsModus==="beurtdag")return eur(i.prijsBeurt)+" voor "+(B===1?"1 dag":B+" dagen")+", daarna "+eur(i.prijsDag)+" per extra dag";return eur(i.prijsDag)+" per dag"}
const geboekt=(i,d)=>((D.bezet||{})[i.id]||[]).reduce((t,b)=>b.van<=d&&b.tot>=d?t+b.n:t,0);
function vrij(i){if(!M.van||!M.tot)return null;let max=0;for(let d=M.van;d<=M.tot;d=plus(d,1)){const n=geboekt(i,d);if(n>max)max=n}return Math.max(0,i.aantal-max)}

function tekenCal(){const el=$("#cal");if(!el)return;const v0=vroegst(),max=plus(isoD(new Date()),400);
  if(!CAL)CAL=(M.van||v0).slice(0,7);const [Y,Mo]=CAL.split("-").map(Number),eerste=new Date(Y,Mo-1,1),n=new Date(Y,Mo,0).getDate(),off=(eerste.getDay()+6)%7;
