<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>html{touch-action:manipulation}</style><script>document.addEventListener("gesturestart",function(e){e.preventDefault()},{passive:false});document.addEventListener("touchmove",function(e){if(e.scale&&e.scale!==1&&!(e.target.closest&&e.target.closest(".leaflet-container")))e.preventDefault()},{passive:false})</script>
<title>Kalenders 2026 VBHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F5F6; --surface:#FFFFFF; --sunken:#F1F1F2; --ink:#1A1B1E; --muted:#686B71; --line:#E5E6E8; --line-strong:#CCCED2;
  --navy:#18191C; --navy-2:#26282C; --navy-ink:#FFFFFF; --navy-muted:#A4A7AD;
  --plate:#18191C; --plate-ink:#FFFFFF;
  --accent:#C0161F; --accent-deep:#8F0F16; --accent-soft:#FCEBEC; --accent-ink:#FFFFFF; --signal:#F5B800;
  --info:#2F6FE4; --info-soft:#E4EDFD;
  --good:#18794A; --good-soft:#E3F4EA; --warn:#8A5A00; --warn-soft:#FDF3D7; --bad:#C0161F; --bad-soft:#FCEBEC;
  --brons:#9A5B26; --zilver:#6F7983; --goud:#A98207;
  --shadow:0 1px 2px rgba(17,18,20,.05),0 1px 3px rgba(17,18,20,.04);
  --shadow-lg:0 12px 32px rgba(17,18,20,.18);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#1A1B1E; --sunken:#202226; --ink:#ECEDEF; --muted:#9B9EA5; --line:#2A2C30; --line-strong:#3C3F45;
  --navy:#0A0A0B; --navy-2:#1C1D20; --navy-ink:#FFFFFF; --navy-muted:#9A9DA3; --plate:#2A2C30; --plate-ink:#FFFFFF;
  --accent:#F0454E; --accent-deep:#B5141C; --accent-soft:#3A1A1E; --accent-ink:#FFFFFF; --signal:#F5B800;
  --info:#7DA7F5; --info-soft:#1B2A47;
  --good:#4CC38A; --good-soft:#13301F; --warn:#F0C04F; --warn-soft:#33290F; --bad:#FF6B70; --bad-soft:#3A1A1E;
  --brons:#D08A4F; --zilver:#AEB6BF; --goud:#E8C33E; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1A1B1E; --sunken:#202226; --ink:#ECEDEF; --muted:#9B9EA5; --line:#2A2C30; --line-strong:#3C3F45;
  --navy:#0A0A0B; --navy-2:#1C1D20; --navy-ink:#FFFFFF; --navy-muted:#9A9DA3; --plate:#2A2C30; --plate-ink:#FFFFFF;
  --accent:#F0454E; --accent-deep:#B5141C; --accent-soft:#3A1A1E; --accent-ink:#FFFFFF; --signal:#F5B800;
  --info:#7DA7F5; --info-soft:#1B2A47;
  --good:#4CC38A; --good-soft:#13301F; --warn:#F0C04F; --warn-soft:#33290F; --bad:#FF6B70; --bad-soft:#3A1A1E;
  --brons:#D08A4F; --zilver:#AEB6BF; --goud:#E8C33E; --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.hdr{background:var(--navy);color:var(--navy-ink);flex:none;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding-top:env(safe-area-inset-top,0px)}
.hdr .in{display:flex;align-items:center;gap:12px;height:56px}
.hdr .logo{height:24px;width:auto;display:block}
.logo-l{display:none!important}
.hdr b{font-weight:500;font-size:14.5px;padding-left:12px;border-left:1px solid rgba(255,255,255,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{margin-left:auto;font-size:15px;font-weight:600;color:var(--navy-ink);white-space:nowrap}
.kr-slot{position:relative;flex:1;min-height:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:8px 14px;font:500 14px/1.2 var(--f-body);cursor:pointer;color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent}.btn.sm{padding:4px 10px;font-size:13px;border-radius:6px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.kr-card .kr-adr{display:flex;align-items:baseline;gap:8px}
.kr-card .kr-adr b{font:600 26px/1 var(--f-display);letter-spacing:-.01em}
.kr-card .kr-adr span{color:var(--muted);font-size:14px}
.kr-legend{position:absolute;z-index:1000;top:66px;left:12px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 10px;font-size:12.5px;color:var(--muted);box-shadow:0 4px 14px rgba(17,18,20,.12)}
@media (max-width:560px){.hdr b{display:none}}

/* ============ Kalenderronde: kaart met alle straten (Kalenders › Kalenderronde) ============
   Eigen klassen met prefix kr- zodat ze niet botsen met de rest van VBHA.
   Geen achtergrondkaart: de pagina mag geen kaarttegels van buitenaf laden, dus de straten zelf vormen de kaart. */
:root{--kr-map:#E8EAED;--kr-todo:#A3A8B0;--kr-halo:#FFFFFF;--krb-road:#FFFFFF;--krb-bld:#D2D4D9;--krb-water:#AECBE6;--krb-green:#CFE3C8;--krb-rail:#C2C4CA;--kr-out:#F5F6F8;--kr-grens:#7F848D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kr-map:#131418;--kr-todo:#5A5E67;--kr-halo:#131418;--krb-road:#25272D;--krb-bld:#2D3037;--krb-water:#1A2E45;--krb-green:#18271B;--krb-rail:#34373E;--kr-out:#0C0D10;--kr-grens:#6C717A}}
:root[data-theme="dark"]{--kr-map:#131418;--kr-todo:#5A5E67;--kr-halo:#131418;--krb-road:#25272D;--krb-bld:#2D3037;--krb-water:#1A2E45;--krb-green:#18271B;--krb-rail:#34373E;--kr-out:#0C0D10;--kr-grens:#6C717A}
.kr-prog{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.kr-prog-main{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px}
.kr-prog-t{font-size:14.5px;color:var(--muted)}
.kr-prog-t b{font:600 24px/1 var(--f-display);color:var(--ink);letter-spacing:-.01em;margin-right:4px}
.kr-track{display:block;height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.kr-track span{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .3s}
.kr-track.sm{height:5px}
.kr-wijken{flex:2 1 420px;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kr-wijk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted)}
.kr-wijk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kr-wijk b{color:var(--ink);font-weight:600}
.kr-wijk .kr-track,.kr-wijk small{grid-column:1/-1}
.kr-wijk small{font-size:12px}
.kr-wijk:hover{border-color:var(--line-strong);color:var(--ink)}
@media (max-width:640px){.kr-wijken{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kr-slot{position:relative;height:clamp(380px,68vh,760px)}
.kr-host{position:absolute;inset:0;isolation:isolate}
.kr-map{position:absolute;inset:0;background:var(--kr-map)}
.kr-map .empty{position:absolute;inset:0;display:grid;place-items:center}
.kr-search{position:absolute;z-index:1000;top:12px;left:12px;right:12px;max-width:420px;display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--muted);box-shadow:0 4px 14px rgba(17,18,20,.12);font-size:15px;text-align:left;cursor:pointer}
.kr-search svg,.kr-zoom svg,.kr-sp svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kr-search:hover{border-color:var(--info);color:var(--ink)}
.kr-zoom{position:absolute;z-index:1000;right:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:0 4px 14px rgba(17,18,20,.12)}
.kr-zoom button{width:40px;height:40px;border:0;background:none;color:var(--ink);font:500 21px/1 var(--f-body);display:grid;place-items:center;cursor:pointer;padding:0}
.kr-zoom button+button{border-top:1px solid var(--line)}
.kr-zoom button:hover{background:var(--sunken);color:var(--accent)}
.kr-card{position:absolute;z-index:1001;left:12px;right:64px;bottom:12px;max-width:420px;display:flex;flex-direction:column;gap:12px;padding:14px 12px 14px 16px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-lg)}
.kr-card-h{display:flex;gap:8px;align-items:flex-start}
.kr-card-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.kr-card h3{margin:0;font:600 18px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.kr-card-t span{font-size:13px;color:var(--muted);min-height:1.4em}
.kr-seg{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.kr-seg button{border:0;background:var(--surface);color:var(--ink);padding:10px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.kr-seg button+button{border-left:1px solid var(--line-strong)}
.kr-seg button:hover{background:var(--sunken)}
.kr-seg #krTodo[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);cursor:default}
.kr-seg #krDone[aria-pressed="true"]{background:var(--good);color:#fff;cursor:default}
.kr-seg #krResBtn[aria-pressed="true"]{background:var(--info);color:#fff;cursor:default}
.kr-seg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.kr-link{all:unset;cursor:pointer;font-weight:600}
.kr-wie{font-size:13px;font-weight:500;color:var(--info);align-self:flex-start}
.kr-link:hover,.kr-link:focus-visible{color:var(--accent);text-decoration:underline}
/* zoekscherm */
.kr-sp{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--bg)}
.kr-sp-bar{display:flex;align-items:center;gap:8px;background:var(--navy);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(8px,env(safe-area-inset-left,0px))}
.kr-sp-bar button{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:none;color:var(--navy-ink);cursor:pointer;border-radius:50%}
.kr-sp-bar button svg{width:22px;height:22px}
.kr-sp-bar input{flex:1;min-width:0;padding:10px 12px;border:0;border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:16px}
.kr-sp ul{list-style:none;margin:0;padding:0 0 env(safe-area-inset-bottom,0px);overflow-y:auto;flex:1}
.kr-sp li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.kr-sp li button:hover{background:var(--sunken)}
.kr-sp small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.kr-sp .kr-ok{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:400;font-size:12.5px}
.kr-sp .kr-ok svg{color:var(--good);stroke-width:2.6}
.kr-sp .kr-ok.res{color:var(--info)}
.kr-sp .empty{margin:0}
/* Leaflet: alleen de delen die deze kaart gebruikt (de stylesheet zelf mag niet van een CDN komen) */
.kr-map.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:-2px;font-family:var(--f-body)}
.kr-map .leaflet-pane,.kr-map .leaflet-pane>svg,.kr-map .leaflet-pane>canvas,.kr-map .leaflet-layer{position:absolute;left:0;top:0}
.kr-map.leaflet-touch-zoom{touch-action:pan-x pan-y}
.kr-map.leaflet-touch-drag,.kr-map.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.kr-map .leaflet-pane{z-index:400}
.kr-map .leaflet-overlay-pane{z-index:400}
.kr-map .leaflet-tooltip-pane{z-index:650}
.kr-map .leaflet-map-pane canvas{z-index:100}
.kr-map .leaflet-zoom-animated{transform-origin:0 0}
.kr-map.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.kr-map.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.kr-map .leaflet-interactive{cursor:pointer}
.kr-map.leaflet-grab{cursor:grab}
.kr-map.leaflet-dragging .leaflet-grab,.kr-map.leaflet-dragging{cursor:grabbing}
.kr-map .leaflet-top,.kr-map .leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.kr-map .leaflet-bottom{bottom:0}.kr-map .leaflet-left{left:0}.kr-map .leaflet-right{right:0}.kr-map .leaflet-top{top:0}
.kr-map .leaflet-control{position:relative;pointer-events:auto;float:left;clear:both}
.kr-map .leaflet-control-attribution{margin:0;padding:1px 6px;font-size:11px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted)}
.kr-map .leaflet-control-attribution a{color:var(--muted)}
.kr-map .leaflet-tooltip{position:absolute;white-space:nowrap;pointer-events:none;user-select:none}
.kr-map .leaflet-tooltip.kr-lbl{background:transparent;border:0;box-shadow:none;padding:0;font:600 11px/1.2 var(--f-body);color:var(--ink);text-shadow:0 0 3px var(--kr-halo),0 0 3px var(--kr-halo),0 0 2px var(--kr-halo)}
.kr-map .kr-lbl span{display:block;transform-origin:center}
@media (max-width:760px){.kr-card{right:60px}}
@media (prefers-reduced-motion:reduce){.kr-map.leaflet-zoom-anim .leaflet-zoom-animated{transition:none}}

.kr-multi{display:flex;flex-direction:column;gap:10px}
.kr-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kr-sum>div{background:var(--sunken);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column}
.kr-sum b{font:600 22px/1.15 var(--f-display);letter-spacing:-.01em}
.kr-sum span{font-size:12.5px;color:var(--muted)}
.kr-sum small{font-size:11.5px}
.kr-ml{list-style:none;margin:0;padding:0;max-height:min(34vh,220px);overflow:auto;border:1px solid var(--line);border-radius:8px}
.kr-ml li{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-bottom:1px solid var(--line);font-size:14px}
.kr-ml li:last-child{border-bottom:0}
.kr-ml-n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.kr-ml-n small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.kr-ml-a{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.kr-ml-x{width:28px;height:28px;flex:none;border:0;background:none;color:var(--muted);font-size:18px;border-radius:6px;cursor:pointer}
.kr-ml-x:hover{background:var(--bad-soft);color:var(--bad)}
.kr-card.multi{max-height:calc(100% - 24px);overflow:auto}
.kr-leg{position:absolute;z-index:1000;top:12px;right:12px;display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);box-shadow:0 4px 14px rgba(17,18,20,.12);font-size:12.5px}
.kr-leg span{display:flex;align-items:center;gap:7px}
.kr-leg i{width:16px;height:4px;border-radius:2px;display:inline-block}
.kr-leg small{color:var(--muted);font-size:11px;margin-top:2px}
@media (max-width:760px){.kr-leg{top:62px;left:12px;right:auto;flex-direction:row;flex-wrap:wrap;gap:4px 10px;padding:6px 9px;font-size:12px}.kr-leg small{flex-basis:100%;margin:0}}
.kr-host.kr-vol{position:fixed;inset:0;z-index:45;background:var(--kr-map)}
.kr-host.kr-vol .kr-zoom{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.kr-host.kr-vol .kr-search{top:calc(12px + env(safe-area-inset-top,0px))}
html.kr-vol-aan,html.kr-vol-aan body{overflow:hidden}

<script>
const $=q=>document.querySelector(q);
const KR_WIJKEN=["Centrum","Gijzegem","Hofstade","Nieuwerkerken"];
const KR_LABEL_ZOOM=16;
/* Startbeeld van de kaart: midden van Aalst-centrum op zoomniveau 15. De knop met het speldje toont de hele regio. */
const KR_START={at:[50.9413,4.0341],zoom:14};
/* Lijndikte per zoomniveau (pixels): [te doen, gedaan, geselecteerd]. Tussen twee niveaus wordt de dichtstbijzijnde gebruikt. */
const KR_DIKTE={12:[1,1.5,4],13:[1.2,2,4.5],14:[1.6,2.5,5],15:[2,3,6],16:[2.8,4,7],17:[3.5,5,8],18:[4,6,9]};
const krDikte=z=>KR_DIKTE[Math.max(12,Math.min(18,Math.round(z)))]; // vanaf dit zoomniveau staan de straatnamen op de kaart
const KR_CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const krSlug=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function krDecode(s){const pts=[];let i=0,la=0,lo=0;
  while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=(r&1)?~(r>>1):(r>>1);if(k===0)la+=d;else lo+=d}pts.push([la/1e5,lo/1e5])}
  return pts}
/* Grenzen van de verdeelregio (<script id="krGrens">). Straatdelen die voor meer dan de helft buiten deze grenzen liggen,
   worden weggelaten; een straat zonder delen binnen de grenzen verdwijnt helemaal (niet zichtbaar, niet aanklikbaar, niet geteld). */
const KR_GRENS=(()=>{const el=document.getElementById("krGrens");if(!el)return[];return el.textContent.trim().split("\n").map(l=>l.slice(l.indexOf(" ")+1).trim().split(" ").map(krDecode)).flat()})();
const krInRing=(p,r)=>{let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const yi=r[i][0],xi=r[i][1],yj=r[j][0],xj=r[j][1];if(((yi>p[0])!==(yj>p[0]))&&(p[1]<(xj-xi)*(p[0]-yi)/(yj-yi)+xi))c=!c}return c};
const krBinnen=p=>!KR_GRENS.length||KR_GRENS.some(r=>krInRing(p,r));
const KR_STREETS=(()=>{const el=document.getElementById("krData");if(!el)return[];
  /* regels "naam deelgemeente adressen delen"; "#gen N" = vanaf hier generatie N. Een regel met een naam die al bestaat voegt
     stukken toe aan die straat (en adressen, meestal 0). */
  let gen=0;const uit=[],per=new Map();
  for(const l of el.textContent.trim().split("\n")){const gm=l.match(/^#gen (\d+)/);if(gm){gen=+gm[1];continue}const m=l.match(/^(.*) ([0-3]) (\d+) ([^0-9]*)$/);if(!m)continue;const n=m[1],w=KR_WIJKEN[+m[2]];
    const id=w==="Centrum"?krSlug(n):krSlug(n)+"--"+krSlug(w),g=m[4].trim().split(" ").map(krDecode).filter(part=>part.filter(krBinnen).length*2>=part.length);
    const s=per.get(id);if(s){s.g.push(...g);s.pg.push(...g.map(()=>gen));s.a+=+m[3];continue}
    const x={id,n,w,a:+m[3],gen,g,pg:g.map(()=>gen)};per.set(id,x);uit.push(x)}
  return uit.filter(s=>s.g.length)})();
let PER_DOOS=100;
/* Stand van de aanduidingen uit VBHA Beheer (status en datum), bijgewerkt op 6/11/2026 12:10. d = gedaan, r = gereserveerd. */
let KR_STAND={},KR_DOOR={},KR_OP={},KR_STAND_OP="";
const KR={ss:new Set(),map:null,lines:new Map(),labels:null,labelAt:null,sel:null,byId:new Map(KR_STREETS.map(s=>[s.id,s]))};
/* Straatdelen: een straat wordt opgedeeld van kruispunt tot kruispunt. Een kruispunt is een punt dat de straat deelt met een andere straat.
   Punten van eenzelfde straat die minder dan 40 m van elkaar liggen tellen als één kruispunt, zodat de twee rijrichtingen van een
   gescheiden rijbaan samen één stuk vormen. Stukken korter dan 50 m worden bij een aangrenzend stuk gevoegd.
   Id van een deel: <straat-id>~<volgnummer>. Zelfde code in de app en op de openbare kaart, zodat de ids overal gelijk zijn.
   Stabiele ids: elk stuk lijn heeft een generatie (#gen in krData). Lijnen worden enkel opgedeeld door lijnen van dezelfde of een
   oudere generatie, en een straat wordt per generatie apart opgedeeld en genummerd (oudste eerst). Zo veranderen de stukken van
   bestaande straten niet als er later straten of stukken straat bijkomen. */
function krMaakDelen(streets){const key=p=>p[0].toFixed(5)+","+p[1].toFixed(5),cntVan=new Map();
  const pgen=(s,i)=>s.pg?s.pg[i]:(s.gen||0);
  const cntTot=g=>{if(!cntVan.has(g)){const c=new Map();for(const s of streets){const seen=new Set();s.g.forEach((part,i)=>{if(pgen(s,i)>g)return;for(const p of part){const k=key(p);if(!seen.has(k)){seen.add(k);c.set(k,(c.get(k)||0)+1)}}})}cntVan.set(g,c)}return cntVan.get(g)};
  const dist=(a,b)=>{const dy=(a[0]-b[0])*111320,dx=(a[1]-b[1])*111320*Math.cos(a[0]*Math.PI/180);return Math.hypot(dx,dy)};
  const lengte=g=>{let t=0;for(let i=1;i<g.length;i++)t+=dist(g[i-1],g[i]);return t};
  const out=new Map();
  for(const s of streets){const gens=[...new Set(s.g.map((_,i)=>pgen(s,i)))].sort((a,b)=>a-b),alle=[];
    for(const ge of gens){const delen=s.g.filter((_,i)=>pgen(s,i)===ge),cnt=cntTot(ge),stuk=[];
      for(const part of delen){let cur=[part[0]];for(let i=1;i<part.length;i++){cur.push(part[i]);if(i<part.length-1&&cnt.get(key(part[i]))>1){stuk.push(cur);cur=[part[i]]}}if(cur.length>1)stuk.push(cur)}
      // eindpunten van de stukken groeperen tot kruispunten (binnen 40 m)
      const kp=[];const kpVan=p=>{for(let i=0;i<kp.length;i++)if(dist(kp[i],p)<40)return i;kp.push(p);return kp.length-1};
      let groepen=[];const per=new Map();
      for(const g of stuk){const a=kpVan(g[0]),b=kpVan(g[g.length-1]),k=Math.min(a,b)+"-"+Math.max(a,b);
        if(!per.has(k)){const gr={a:Math.min(a,b),b:Math.max(a,b),g:[]};per.set(k,gr);groepen.push(gr)}per.get(k).g.push(g)}
      const glen=gr=>Math.max(...gr.g.map(lengte));
      for(let t=0;t<groepen.length&&groepen.length>1;){const gr=groepen[t];
        if(gr.a===gr.b||glen(gr)<50){const h=groepen.find(x=>x!==gr&&(x.a===gr.a||x.b===gr.a||x.a===gr.b||x.b===gr.b))||groepen.find(x=>x!==gr);
          h.g.push(...gr.g);groepen.splice(t,1);t=0;continue}t++}
      // nummeren in de richting van de straat (van het ene uiteinde naar het andere)
      const pts0=delen.flat(),p0=pts0[0],ver=pts0.reduce((b,p)=>dist(p0,p)>dist(p0,b)?p:b,p0),ax=[ver[0]-p0[0],ver[1]-p0[1]];
      const proj=gr=>{const pts=gr.g.flat(),m=pts[Math.floor(pts.length/2)];return (m[0]-p0[0])*ax[0]+(m[1]-p0[1])*ax[1]};
      groepen=groepen.map(gr=>({gr,v:proj(gr)})).sort((x,y)=>x.v-y.v).map(x=>x.gr);
      for(const gr of groepen)alle.push({g:gr.g,k:[kp[gr.a],kp[gr.b]]})}
    const len=alle.map(gr=>gr.g.reduce((x,g)=>x+lengte(g),0)),L=len.reduce((a,b)=>a+b,0)||1;
    out.set(s.id,alle.map((gr,i)=>({id:s.id+"~"+i,sid:s.id,nr:i+1,g:gr.g,k:gr.k,len:len[i],a:Math.max(alle.length>1?1:0,Math.round(s.a*len[i]/L))})))}
  return out}
const KR_DELEN=krMaakDelen(KR_STREETS),KR_DEEL=new Map([...KR_DELEN.values()].flat().map(d=>[d.id,d]));
const krDeelStand=sid=>{const L=KR_DELEN.get(sid)||[];let d=0,r=0;for(const x of L){if(KR_STAND[x.id]==="d")d++;else if(KR_STAND[x.id]==="r")r++}return{n:L.length,d,r}};

const krVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const krAdr=n=>n===1?"adres":"adressen";
const krNum=n=>n.toLocaleString("nl-BE");
const krFold=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const KR_SORTED=[...KR_STREETS].sort((a,b)=>a.n.localeCompare(b.n,"nl")||a.w.localeCompare(b.w,"nl"));
function krLabels(){if(!KR.labels)return;KR.labels.clearLayers();const map=KR.map;if(map.getZoom()<KR_LABEL_ZOOM)return;
  const view=map.getBounds().pad(.1);
  for(const s of KR_STREETS){const {at,angle}=KR.labelAt.get(s.id);if(!view.contains(at))continue;
    const t=document.createElement("span");t.textContent=s.n;t.style.transform=`rotate(${angle.toFixed(1)}deg)`;
    KR.labels.addLayer(L.tooltip({permanent:true,direction:"center",className:"kr-lbl",interactive:false}).setLatLng(at).setContent(t))}}
const KR_BLD_ZOOM=15;
const KR_BG_ORDER=[["green","--krb-green"],["water","--krb-water"],["road","--krb-road"],["rail","--krb-rail"],["bld","--krb-bld"]];
function krBg(){if(KR.bgLoading||KR.bg||!KR.map)return;KR.bgLoading=true;
  fetch("/kaart.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
    const map=KR.map;map.createPane("krBg").style.zIndex=300;map.createPane("krBld").style.zIndex=310;
    const rBg=L.canvas({pane:"krBg",padding:.3}),rBld=L.canvas({pane:"krBld",padding:.3});
    KR.bg={groups:{},src:d.src||""};
    for(const [k,tok] of KR_BG_ORDER){const items=(d.L&&d.L[k])||[];if(!items.length)continue;
      const bld=k==="bld",g=L.layerGroup();
      for(const it of items){const rings=(Array.isArray(it)?it:[it]).map(krDecode);
        g.addLayer(L.polygon(rings,{renderer:bld?rBld:rBg,pane:bld?"krBld":"krBg",interactive:false,stroke:false,fillOpacity:1,_krTok:tok}))}
      KR.bg.groups[k]=g;if(!bld)g.addTo(map)}
    map.attributionControl.addAttribution("Achtergrond © GRB, Digitaal Vlaanderen");
    krGrens(map);
    map.on("zoomend",krBgZoom);krBgZoom();krBgStyle();
  }).catch(()=>{KR.bgLoading=false})}
/* Alles buiten de deelgemeenten Aalst, Gijzegem, Hofstade en Nieuwerkerken wordt afgedekt (--kr-out), met een stippellijn op de grens.
   De grenzen staan in <script id="krGrens">: per lijn een naam en één ring. */
function krGrens(map){const el=document.getElementById("krGrens");if(!el)return;
  const R=KR_GRENS;if(!R.length)return;
  map.createPane("krMask").style.zIndex=330;const r=L.canvas({pane:"krMask",padding:.5});
  const world=[[52.5,2],[52.5,6.5],[49.5,6.5],[49.5,2]];
  KR.bg.mask=L.polygon([world,...R],{renderer:r,pane:"krMask",interactive:false,stroke:false,fillOpacity:1}).addTo(map);
  KR.bg.grens=L.polyline(R.map(x=>x.concat([x[0]])),{renderer:r,pane:"krMask",interactive:false,weight:1.5,dashArray:"6 5",opacity:1}).addTo(map)}
function krBgZoom(){const g=KR.bg&&KR.bg.groups.bld;if(!g)return;const on=KR.map.getZoom()>=KR_BLD_ZOOM;
  if(on&&!KR.map.hasLayer(g))g.addTo(KR.map);else if(!on&&KR.map.hasLayer(g))g.remove()}
function krBgStyle(){if(!KR.bg)return;const c={};
  for(const g of Object.values(KR.bg.groups))g.eachLayer(l=>{const t=l.options._krTok;l.setStyle({fillColor:c[t]||(c[t]=krVar(t))})});
  if(KR.bg.mask)KR.bg.mask.setStyle({fillColor:krVar("--kr-out")});if(KR.bg.grens)KR.bg.grens.setStyle({color:krVar("--kr-grens")})}

function krStyleAll(){const todo=krVar("--kr-todo"),sel=krVar("--accent");const w=krDikte(KR.map?KR.map.getZoom():15);
  const dn=krVar("--good"),rs=krVar("--info");
  for(const [id,line] of KR.lines){const s=KR.ss.has(id),m=KR_STAND[id];line.setStyle({color:s?sel:m==="d"?dn:m==="r"?rs:todo,weight:s?w[2]:m?w[1]:w[0],opacity:1})}
  for(const id in KR_STAND){const l=KR.lines.get(id);if(l)l.bringToFront()}
  for(const id of KR.ss){const l=KR.lines.get(id);if(l)l.bringToFront()}
  /* delen van een straat (tot een kruispunt) */
  if(!KR.segLayer)KR.segLayer=L.layerGroup().addTo(KR.map);KR.segLayer.clearLayers();
  for(const id in KR_STAND){const x=KR_DEEL.get(id);if(!x||KR_STAND[x.sid]||KR.ss.has(x.sid))continue;
    L.polyline(x.g,{renderer:KR.renderer,interactive:false,weight:w[1],color:KR_STAND[id]==="r"?rs:dn,lineCap:"round",opacity:1}).addTo(KR.segLayer)}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const krDeelTekst=sid=>{const t=krDeelStand(sid);return t.d||t.r?"deels: "+[t.d?t.d+" van "+t.n+" stukken bedeeld":"",t.r?t.r+" gereserveerd":""].filter(Boolean).join(", "):""};
const krWie=id=>(KR_STAND[id]==="d"?"al bedeeld":"gereserveerd")+(KR_OP[id]?" · "+KR_OP[id]:"");
function krCard(){const c=$("#krCard"),ids=[...KR.ss].filter(id=>KR.byId.has(id));if(!ids.length){c.hidden=true;return}c.hidden=false;
  const one=ids.length===1;$("#krOne").hidden=!one;$("#krMulti").hidden=one;c.classList.toggle("multi",!one);
  if(one){const s=KR.byId.get(ids[0]);$("#krCardT").textContent=s.n;$("#krCardM").textContent=[s.w==="Centrum"?"":s.w,KR_STAND[s.id]?krWie(s.id):krDeelTekst(s.id),"tik nog een straat aan om op te tellen"].filter(Boolean).join(" · ");$("#krCardA").textContent=krNum(s.a);$("#krCardAl").textContent=krAdr(s.a);return}
  const L=ids.map(id=>KR.byId.get(id)),tot=L.reduce((t,x)=>t+x.a,0),doz=Math.ceil(tot/PER_DOOS);
  $("#krCardT").textContent=ids.length+" straten geselecteerd";$("#krCardM").textContent="Tik een straat aan om ze toe te voegen, nog eens om ze weg te halen.";
  $("#krMulti").innerHTML=`<div class="kr-sum"><div><b>${krNum(tot)}</b><span>adressen</span></div><div><b>${krNum(doz)}</b><span>${doz===1?"doos":"dozen"} <small>(${PER_DOOS} per doos)</small></span></div></div>
  <ul class="kr-ml">${L.map(x=>`<li><span class="kr-ml-n">${esc(x.n)}${KR_STAND[x.id]?`<small>${esc(krWie(x.id))}</small>`:""}</span><span class="kr-ml-a">${krNum(x.a)}</span></li>`).join("")}</ul>`}
function krSelect(id){KR.ss=new Set(id?[id]:[]);KR.sel=id||null;if(KR.map)krStyleAll();krCard()}
function krToggle(id){if(KR.ss.has(id))KR.ss.delete(id);else KR.ss.add(id);KR.sel=KR.ss.size?id:null;if(KR.map)krStyleAll();krCard()}
function krZoomTo(id){const l=KR.lines.get(id);if(l&&KR.map)KR.map.fitBounds(l.getBounds(),{maxZoom:17,paddingTopLeft:[40,80],paddingBottomRight:[70,200]})}
function krInit(){if(!window.L){$("#krMap").innerHTML='<div class="empty">De kaart kon niet laden. Controleer je internetverbinding en herlaad de pagina.</div>';return}
  const map=L.map($("#krMap"),{zoomControl:false,preferCanvas:true,minZoom:12,maxZoom:19});KR.map=map;
  const renderer=L.canvas({tolerance:10});KR.renderer=renderer;
  KR.bounds=L.latLngBounds(KR_STREETS.flatMap(s=>s.g.flat()));
  map.setView(KR_START.at,KR_START.zoom);map.setMaxBounds(KR.bounds.pad(.3));
  map.on("zoomend",()=>krStyleAll());
  map.attributionControl.setPrefix(false);map.attributionControl.setPosition("bottomleft");
  map.attributionControl.addAttribution('Straten © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>');
  for(const s of KR_STREETS){const line=L.polyline(s.g,{renderer,weight:4,lineCap:"round",lineJoin:"round"})
    .on("click",e=>{L.DomEvent.stopPropagation(e);krToggle(s.id)}).addTo(map);KR.lines.set(s.id,line)}
  
  KR.labelAt=new Map(KR_STREETS.map(s=>{let best=null,bl=-1;
    for(const part of s.g)for(let i=1;i<part.length;i++){const a=map.project(part[i-1],KR_LABEL_ZOOM),b=map.project(part[i],KR_LABEL_ZOOM);const len=a.distanceTo(b);if(len>bl){bl=len;best=[part[i-1],part[i],a,b]}}
    if(!best){const p=s.g[0][0];return[s.id,{at:p,angle:0}]}
    const [p,q,a,b]=best;let ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;
    return[s.id,{at:[(p[0]+q[0])/2,(p[1]+q[1])/2],angle:ang}]}));
  KR.labels=L.layerGroup().addTo(map);map.on("zoomend moveend",krLabels);krLabels();
  krBg();krStyleAll();
  const restyle=()=>{if(KR.map){krStyleAll();krBgStyle()}};matchMedia("(prefers-color-scheme: dark)").addEventListener("change",restyle)}
/* zoeken */
let HITS=[];
function krOpenSearch(){const inp=$("#krSpIn");inp.value="";$("#krSp").hidden=false;inp.focus();krResults();$("#krSpList").scrollTop=0}
function krCloseSearch(){$("#krSpIn").blur();$("#krSp").hidden=true}
function krPick(s){krCloseSearch();krZoomTo(s.id);if(!KR.ss.has(s.id))krToggle(s.id)}
function krResults(){const q=krFold($("#krSpIn").value.trim());HITS=q?KR_SORTED.filter(s=>krFold(s.n).includes(q)||krFold(s.w).startsWith(q)):KR_SORTED;
  $("#krSpEmpty").hidden=HITS.length>0;
  $("#krSpList").replaceChildren(...HITS.map(s=>{const li=document.createElement("li"),b=document.createElement("button");b.type="button";
    const nm=document.createElement("span");nm.textContent=s.n;const sm=document.createElement("small");sm.textContent=s.w;nm.append(sm);b.append(nm);
    const a=document.createElement("span");a.className="kr-ok";a.textContent=krNum(s.a)+" "+krAdr(s.a);b.append(a);b.onclick=()=>krPick(s);li.append(b);return li}))}
$("#krSearchOpen").onclick=krOpenSearch;$("#krSpBack").onclick=krCloseSearch;
$("#krSpIn").addEventListener("input",krResults);
$("#krSpIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&HITS.length){e.preventDefault();krPick(HITS[0])}if(e.key==="Escape")krCloseSearch()});
$("#krZin").onclick=()=>KR.map&&KR.map.zoomIn();$("#krZout").onclick=()=>KR.map&&KR.map.zoomOut();
$("#krFit").onclick=()=>KR.map&&KR.map.fitBounds(KR.bounds,{padding:[20,20]});$("#krCardX").onclick=()=>krSelect(null);$("#krCard").addEventListener("click",e=>{const b=e.target.closest("[data-krx]");if(b){e.stopPropagation();krToggle(b.dataset.krx)}});
/* ============ Kalenderronde: kaart op volledig scherm ============
   Knop in de zoombalk. Het kader wordt over het hele venster gelegd (werkt ook op iPhone); waar het kan ook echt volledig scherm
   (zonder adresbalk). Escape, de knop of een andere pagina zet het terug. Zelfde code op de openbare kaart (kaart.html). */
const KR_VOL_IC={aan:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',uit:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'};
function krVol(host,aan){if(!host)return;host.classList.toggle("kr-vol",aan);document.documentElement.classList.toggle("kr-vol-aan",aan);
  const b=host.querySelector(".kr-vol-b");if(b){b.innerHTML=aan?KR_VOL_IC.uit:KR_VOL_IC.aan;b.setAttribute("aria-label",aan?"Volledig scherm sluiten":"Volledig scherm");b.title=b.getAttribute("aria-label");b.setAttribute("aria-pressed",String(aan))}
  try{const d=document.documentElement;if(aan&&d.requestFullscreen&&!document.fullscreenElement)d.requestFullscreen({navigationUI:"hide"}).catch(()=>{});else if(!aan&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
  const m=typeof KR!=="undefined"&&KR.map;if(m){setTimeout(()=>m.invalidateSize({pan:false}),60);setTimeout(()=>m.invalidateSize({pan:false}),350)}}
function krVolKnop(host){const z=host&&host.querySelector(".kr-zoom");if(!z||z.querySelector(".kr-vol-b"))return;
  const b=document.createElement("button");b.type="button";b.className="kr-vol-b";b.innerHTML=KR_VOL_IC.aan;b.setAttribute("aria-label","Volledig scherm");b.title="Volledig scherm";b.setAttribute("aria-pressed","false");
  b.onclick=()=>krVol(host,!host.classList.contains("kr-vol"));z.appendChild(b)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const h=document.querySelector(".kr-host.kr-vol");if(h&&!document.querySelector(".modal-bg,.kr-sp:not([hidden])"))krVol(h,false)}});
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement){const h=document.querySelector(".kr-host.kr-vol");if(h)krVol(h,false)}});
krVolKnop(document.querySelector(".kr-host"));
$("#krStand").textContent="Stand laden…";
krInit();
/* Live stand uit VBHA Beheer (via /api/ronde), elke 30 seconden vernieuwd. */
const krDag=t=>{const d=new Date(t);if(isNaN(d))return /^\d{1,2}\/\d{1,2}\/\d{4}/.test(t)?t.split(" ")[0]:"";const p=new Intl.DateTimeFormat("nl-BE",{timeZone:"Europe/Brussels",day:"numeric",month:"numeric",year:"numeric"}).formatToParts(d),g=k=>p.find(x=>x.type===k).value;return g("day")+"/"+g("month")+"/"+g("year")};
async function krLive(){try{const r=await fetch("/api/ronde",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
  const st={},dr={},op={};for(const x of j.straten||[]){st[x.s]=x.st;const d=x.at?krDag(x.at):"";if(d)op[x.s]=d}
  KR_STAND=st;KR_DOOR=dr;KR_OP=op;PER_DOOS=Number(j.perDoos)||100;
  if(j.jaar){document.title="Kalenders "+j.jaar+" VBHA";document.querySelectorAll("[data-krjaar]").forEach(e=>e.textContent="Kalenders "+j.jaar)}
  const n=new Date(j.nu||Date.now());KR_STAND_OP=krDag(n)+" "+n.toLocaleTimeString("nl-BE",{timeZone:"Europe/Brussels",hour:"2-digit",minute:"2-digit"});
  $("#krStand").textContent="Bijgewerkt "+KR_STAND_OP;if(KR.map){krStyleAll();krCard()}}
  catch(e){if(!KR_STAND_OP)$("#krStand").textContent="Stand kon niet geladen worden"}}
setInterval(()=>{if(!document.hidden)krLive()},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)krLive()});
krLive();

</script>
</body></html>
