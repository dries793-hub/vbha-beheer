<main>
  <div class="title"><h1 id="h1">Kassa</h1></div>
  <p class="lead" id="lead">Tickets scannen aan de kassa.</p>
  <div id="box"></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const JSQR={src:"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",sri:"sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx"};
let TOK=null;try{const t=JSON.parse(localStorage.getItem("vbha_kassa")||"null");if(t&&t.tot>Date.now())TOK=t}catch(x){}
const post=async b=>{const r=await fetch("/api/fuif",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"Er ging iets mis.");e.status=r.status;throw e}return j};
function login(msg){stop();$("#lead").textContent="Geef de kassacode in die je van het bestuur kreeg. Daarmee kan je enkel tickets scannen.";
  $("#box").innerHTML=`<form class="card" id="fl" novalidate><label for="kc">Kassacode</label><input type="text" id="kc" class="ks-code" autocomplete="off" autocapitalize="characters" maxlength="12" style="width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)"><p class="err" id="err" role="alert">${esc(msg||"")}</p><button class="btn" id="go" type="submit">Starten</button></form>`;
  $("#fl").onsubmit=async e=>{e.preventDefault();const b=$("#go");b.disabled=true;try{const j=await post({actie:"kassa-login",code:$("#kc").value});TOK=j;try{localStorage.setItem("vbha_kassa",JSON.stringify(j))}catch(x){}scanner()}catch(x){$("#err").textContent=x.message;b.disabled=false}}}
let S=null;
function stop(){if(!S)return;S.stop=true;cancelAnimationFrame(S.raf);if(S.stream)S.stream.getTracks().forEach(x=>x.stop());S=null}
function laadJsQR(){if(window.jsQR)return Promise.resolve();return new Promise((ok,nok)=>{const s=document.createElement("script");s.src=JSQR.src;s.integrity=JSQR.sri;s.crossOrigin="anonymous";s.onload=ok;s.onerror=()=>nok(new Error("De QR-lezer kon niet geladen worden."));document.head.append(s)})}
let AANBOD=null;
async function stand(){try{const j=await post({actie:"kassa-stand",token:TOK.token});AANBOD=j;const e=$("#stand");if(e)e.textContent=`${j.binnen} binnen (${j.tickets} online + ${j.kassa.tickets} aan de kassa)`;if(j.naam){$("#h1").textContent="Kassa · "+j.naam}}catch(e){if(e.status===401)login(e.message)}}
const tabs=k=>`<div class="ks-tabs"><button type="button" data-tab="scan" class="${k==="scan"?"on":""}">Scannen</button><button type="button" data-tab="verkoop" class="${k==="verkoop"?"on":""}">Verkopen</button></div>`;
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab]");if(!t)return;if(t.dataset.tab==="scan")scanner();else verkoop()});
async function scanner(){$("#lead").textContent="Richt de camera op de QR-code van het ticket of de drankkaart.";
  $("#box").innerHTML=tabs("scan")+`<div class="ks-cam"><video id="v" playsinline muted></video><div class="ks-kader"></div><div class="ks-res" id="res" hidden></div></div>
   <div class="ks-bar"><span id="stand"></span><button type="button" class="linkb" id="uit">Afmelden</button></div>
   <form class="ks-man" id="man" novalidate><input id="code" placeholder="Of typ de code" autocomplete="off" autocapitalize="characters"><button class="btn" type="submit">Controleren</button></form>
   <p class="hint" id="stat" style="text-align:center"></p>`;
  $("#uit").onclick=()=>{try{localStorage.removeItem("vbha_kassa")}catch(x){}TOK=null;login()};
  $("#man").onsubmit=e=>{e.preventDefault();const v=$("#code").value.trim();if(v){check(v);$("#code").value=""}};
  stand();S={bezig:false,stop:false,laatst:"",t:0};
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});if(!S||S.stop){st.getTracks().forEach(x=>x.stop());return}
    S.stream=st;const v=$("#v");v.srcObject=st;await v.play();
    let det=null;if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("qr_code"))det=new BarcodeDetector({formats:["qr_code"]})}catch(x){}}
    if(!det)await laadJsQR();
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const loop=async()=>{if(!S||S.stop)return;
      if(!S.bezig&&v.readyState>=2){let txt="";
        try{if(det){const r=await det.detect(v);txt=r[0]&&r[0].rawValue||""}else{const w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});txt=r&&r.data||""}}catch(x){}
        if(txt&&!(txt===S.laatst&&Date.now()-S.t<4000)){S.laatst=txt;S.t=Date.now();check(txt)}}
      S.raf=requestAnimationFrame(loop)};loop();
  }catch(e){$("#stat").textContent=e&&e.name==="NotAllowedError"?"Geen toegang tot de camera. Sta de camera toe, of typ de code hierboven.":"De camera kon niet starten. Typ de code hierboven."}}
async function check(txt){if(S)S.bezig=true;const r=$("#res");
  try{const j=await post({actie:"kassa-scan",token:TOK.token,code:txt});const tijd=s=>new Date(s).toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});
    r.className="ks-res "+(j.ok?(j.soort==="drank"?"dk":"ok"):j.al?"al":"nok");
    r.innerHTML=j.ok?(j.soort==="drank"?`<b>🍺 Drankkaart €${esc(j.waarde)} geven</b><span>${esc(j.naam)}</span><small>Drankkaart ${j.nr} van ${j.van}</small>`:`<b>✓ Geldig</b><span>${esc(j.naam)}</span><small>Ticket ${j.nr} van ${j.van}</small>`)
      :`<b>${j.al?"⚠ Al gescand":"✕ Niet geldig"}</b><span>${esc(j.naam||"")}</span><small>${esc(j.reden||"")}${j.al&&j.op?" Om "+tijd(j.op)+".":""}</small>`;
    r.hidden=false;try{navigator.vibrate&&navigator.vibrate(j.ok?80:[60,60,60])}catch(x){}if(j.ok&&j.soort!=="drank")stand()}
  catch(e){if(e.status===401){login(e.message);return}r.className="ks-res nok";r.innerHTML=`<b>Fout</b><small>${esc(e.message)}</small>`;r.hidden=false}
  setTimeout(()=>{if(S)S.bezig=false;const x=$("#res");if(x)x.hidden=true},2200)}
const P=new URLSearchParams(location.search);
if(TOK)scanner();else{login();if(P.get("code")){$("#kc").value=P.get("code");history.replaceState(null,"",location.pathname)}}
// ---------- verkopen aan de kassa ----------
const eur=n=>"€ "+Number(n||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
let MAND={},VK=null,vkT=0;
function items(){const A=AANBOD||{kassaPrijs:0,dranken:[]};return[{id:"ticket",naam:"Inkom",prijs:A.kassaPrijs,k:"inkom"},...(A.dranken||[]).map(d=>({id:d.id,naam:"Drankkaart €"+d.waarde,prijs:d.waarde,k:"drank"}))]}
async function verkoop(){stop();if(!AANBOD)await stand();$("#lead").textContent="Tik op een tegel per verkochte kaart en reken af met Bancontact.";vkTeken()}
function vkTeken(){clearTimeout(vkT);const I=items(),tot=I.reduce((n,x)=>n+(MAND[x.id]||0)*x.prijs,0),gekozen=I.filter(x=>MAND[x.id]);
  $("#box").innerHTML=tabs("verkoop")+`<div class="pos">${I.map(x=>`<button type="button" class="pt ${x.k}" data-pt="${x.id}"><i>${MAND[x.id]||""}</i><b>${esc(x.naam)}</b><span>${eur(x.prijs)}</span></button>`).join("")}</div>
   <div class="mand">${gekozen.length?gekozen.map(x=>`<div class="mand-r"><span><b>${MAND[x.id]}×</b> ${esc(x.naam)}</span><span style="display:flex;align-items:center;gap:8px">${eur(MAND[x.id]*x.prijs)}<button type="button" data-min="${x.id}" aria-label="Eén minder">−</button></span></div>`).join(""):'<div class="hint" style="margin:0;text-align:center">Nog niets gekozen.</div>'}
   <div class="mand-t"><span>Totaal</span><span>${eur(tot)}</span></div></div>
   <div class="ks-acts"><button class="btn" id="afr"${tot>0?"":" disabled"}>Afrekenen met Bancontact</button><button class="btn sec" id="cash"${tot>0?"":" disabled"}>Cash</button></div>
   ${gekozen.length?'<p style="text-align:center;margin:10px 0 0"><button type="button" class="linkb" id="leeg">Alles wissen</button></p>':""}`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-pt]");if(t){MAND[t.dataset.pt]=(MAND[t.dataset.pt]||0)+1;try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}vkTeken();return}
  const m=e.target.closest("[data-min]");if(m){const k=m.dataset.min;MAND[k]=Math.max(0,(MAND[k]||0)-1);if(!MAND[k])delete MAND[k];vkTeken();return}
  if(e.target.id==="leeg"){MAND={};vkTeken()}else if(e.target.id==="afr")afrekenen(false);else if(e.target.id==="cash")afrekenen(true)
  else if(e.target.id==="vkStop"){if(VK)post({actie:"kassa-stop",token:TOK.token,id:VK.id}).catch(()=>{});VK=null;vkTeken()}
  else if(e.target.id==="vkNieuw")nieuweQr();else if(e.target.id==="vkVolgende"){MAND={};VK=null;vkTeken();stand()}});
async function afrekenen(cash){const b=$(cash?"#cash":"#afr");b.disabled=true;
  try{const j=await post({actie:"kassa-verkoop",token:TOK.token,items:MAND,betaalwijze:cash?"cash":"bancontact"});VK=j;if(j.status==="SUCCEEDED"){betaald(cash);return}toonQr();volgVk()}
  catch(e){if(e.status===401){login(e.message);return}alert(e.message);b.disabled=false}}
function toonQr(){$("#box").innerHTML=tabs("verkoop")+`<div class="card bq"><p style="margin:0;color:var(--muted)">Laat de klant deze QR-code scannen met de Bancontact- of bankapp</p><div class="bedrag">${eur(VK.bedrag)}</div>
  ${VK.qrcode?`<img src="${esc(VK.qrcode)}" alt="Bancontact-QR-code">`:`<p>Geen QR-code beschikbaar.</p>`}<p class="wacht" id="vkSt" style="margin-top:10px">Wachten op betaling…</p>
  <div class="ks-acts" style="grid-template-columns:1fr 1fr"><button class="btn sec" id="vkNieuw">Nieuwe QR</button><button class="btn sec" id="vkStop">Annuleren</button></div></div>`}
async function nieuweQr(){try{const j=await post({actie:"kassa-nieuweqr",token:TOK.token,id:VK.id});VK={...VK,...j};toonQr();volgVk()}catch(e){alert(e.message)}}
async function volgVk(){clearTimeout(vkT);if(!VK)return;const id=VK.id;
  try{const j=await post({actie:"kassa-status",token:TOK.token,id});if(!VK||VK.id!==id)return;
    if(j.status==="SUCCEEDED"){betaald(false);return}
    const st=$("#vkSt");if(st){if(["EXPIRED","CANCELLED","FAILED","AUTHORIZATION_FAILED"].includes(j.status))st.textContent=j.status==="EXPIRED"?"QR-code verlopen. Tik op Nieuwe QR.":"Betaling niet gelukt. Tik op Nieuwe QR.";else if(j.status==="IDENTIFIED"||j.status==="AUTHORIZED")st.textContent="Klant bevestigt in de app…"}
    if(["EXPIRED","CANCELLED","FAILED","AUTHORIZATION_FAILED"].includes(j.status))return}
  catch(e){if(e.status===401){login(e.message);return}}
  vkT=setTimeout(volgVk,2000)}
function betaald(cash){clearTimeout(vkT);const I=items(),wat=I.filter(x=>MAND[x.id]).map(x=>`${MAND[x.id]}× ${esc(x.naam)}`).join("<br>");
  $("#box").innerHTML=tabs("verkoop")+`<div class="card bq ok"><div class="vink">✓</div><h2 style="margin:0">${cash?"Cash ontvangen":"Betaald"}</h2><div class="bedrag">${eur(VK?VK.bedrag:0)}</div><p style="margin:0 0 4px">Geef de klant:</p><p style="margin:0;font-size:18px"><b>${wat}</b></p>
  <button class="btn" id="vkVolgende" style="margin-top:18px">Volgende klant</button></div>`;try{navigator.vibrate&&navigator.vibrate([80,40,80])}catch(x){}}
</script>
</body>
</html>
